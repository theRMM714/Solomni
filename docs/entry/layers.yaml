# 入口（entry）分层的唯一权威：一行一条「模块: 层号」。
# 模块名＝src/entry 下的文件名 / 目录名（目录算一个模块），编排根单列成 main（src/main.rs）；
# src/entry.rs 只是 mod 声明，不参与分层，混合代码由门禁拒绝。
# 段是启动流程的职责，不是依赖深度的副作用：数字大＝更靠上、更晚接进流程。
# 同段之间不许互相依赖（同段有边就失败），因此不可能成环，只能依赖严格更低的段。
# 段号必须严格压住全部依赖（压不住就失败）；比依赖深度松不算错——段是阶段职责，深度是实现事实。
# 由 T0 的 structure/entry-tiers 双向比对：盘上的模块必须在表里，表里的模块必须在盘上。

# 第 0 段 值层：只读事实与纯值，不起流程、不做判定
root: 0
toolchains: 0
probes: 0

# 第 1 段 判定层：只决定「能不能开工」，不装配任何东西
startup: 1
portable: 1

# 第 2 段 装配层：把端口接成能力面、把面袋交给呈现层；内部协议分派也在这里
args: 2
assembly: 2
web: 2

# 第 3 段 编排层：只串流程，不判定也不装配
main: 3
