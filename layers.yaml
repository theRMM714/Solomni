# 单元环表：架构地位的唯一权威。环是规则，不是可以写宽的意图。
# 环 0 kernel（地基库）；环 1 纯（无 IO、无状态、无端口、可穷举测试）；
# 环 2 状态与机制；环 3 用例；环 4 适配器（presentation/、entry/）不入本表，由 entry-tiers.js 与 dependency.js 管。
# H1：跨单元边只能指向严格更低的环；同环只允许指向 rank 更低的单元（rank 由同环边算，只回执）。
# H2：环 1 的单元不得出现 IO、ports/、可变全局，也不得依赖 kernel。
# 改环 = 改架构地位：必须在 PR 说明理由，门禁不再接受「声明 == 按依赖重算」。
# 门禁：tests/gates/structure/layers.js（T0 结构审查）。新增单元必须先在这里归环，否则失败。
kernel: 0

# 环 1 纯
exec_model: 1
permission: 1
registry_model: 1
taskchain: 1

# 环 2 状态与机制
agentloop: 2
catalog: 2
