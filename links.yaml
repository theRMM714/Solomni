# 外部连接台账（唯一真相）：项目自用、可能变的外部 URL 都放这里，改一处全仓生效。
#
# 规矩：
# - 扁平的一行一个键：域.用途: https://...
# - 值必须是 https://；域限于 rustup / winlibs / release / guest（加域要同时改 tests 里的白名单）。
# - **校验值（sha256）与它守护的那条链接成对**：键 = 链接键 + `.sha256`，值是 64 位十六进制；
#   来源（上游同 release 的 `<资产>.sha256`，或 GitHub API 的资产 digest 字段）写在本行上面的注释里。
#   升级资产时 URL 与校验值必须在同一个 diff 里改掉——分居两处就会腐烂：曾把 URL 升到新版本、
#   忘了改代码里那个常量，于是每次下载都判"不符 → 删文件 → 重跑"，把人挡在门外。
#   自托管 release 资产不在这里 pin：那条连接的身份在 `dependencies.yaml` 的条目里（`sha256:` 字段）。
# - 不是每条都要 pin：源本身是 `latest`（会随上游滚动）的，pin 上去必然腐烂，就不写校验值，
#   改由"下载成功 + 解包/解析成功"判。
# - 只收"项目自用、可能变"的指路 / 下载源；用户自己配的（providers、qemu_path、guest_image）
#   与项目内稳定的东西不在这里。用户想换下载源：走设置与环境变量（如 SOLOMNI_GH_MIRROR），不改本文件。
# - 代码里用 link("键") 引用（Rust 侧 links.link("键")；Rust 与 Node 都按这一行读）。
#   tests 的结构审查比对"台账的键 ↔ 代码里 link(...) 的引用"：没人用的键进不来，引用了没声明的键也过不去。
rustup.init.windows: https://win.rustup.rs/x86_64
rustup.init.unix: https://sh.rustup.rs
winlibs.upstream.releases: https://github.com/brechtsanders/winlibs_mingw/releases
winlibs.upstream.asset: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-14.0.0-ucrt-r2/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r2.zip
# 来源：同一个 release 里的 `winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r2.zip.sha256`
# （GitHub API 该资产的 digest 字段是同一个值）。升版本时照上游重取，不要手抄下载结果。
winlibs.upstream.asset.sha256: d5dbafc4a170e762ca6143151ec918fb9e2c72736fb14cd704abebc6bdd5276a
guest.debian.image: https://cdimage.debian.org/cdimage/cloud/trixie/latest/debian-13-genericcloud-amd64.tar.xz
# 直接用磁盘镜像（qcow2）：不用解 tar.xz，firmware 引导即可（Windows / macOS 宿主没有 9p，root 必须是磁盘）。
guest.debian.qcow2: https://cdimage.debian.org/cdimage/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2
guest.debian.pool: https://deb.debian.org/debian/pool/main/q/qemu/
guest.debian.linux: https://deb.debian.org/debian/pool/main/l/linux/
release.base: https://github.com/theRMM714/Solomni/releases/download/dependencies/
# Windows 的 SMB 共享 helper：独立 fork 仓自己发 Release 资产（源码 + 预编译 smbd.exe）。
smbd.windows: https://github.com/theRMM714/rust-smb-server-win/releases/download/v0.0.1/smbd-windows-x86_64.exe
# 来源：该 release 的 `smbd-windows-x86_64.exe` 资产 digest（GitHub API）。
smbd.windows.sha256: 0ce4f31a8621817212e9706ec9f8651fd40f02535d07660eec2855187c73b90f
