# 三平台测试：GitHub 托管 runner 是一次性机器，「会改本机状态」的真机围栏测试只在这里开。
# 本地默认安全模式（见 TESTING.md）：会改本机状态的测试要显式 --fence-live。
# 无论成败都把报告与日志留两份：产物（供人下载）与 ci-report 分支（供没有凭据的会话直接读）。测试 job 仅需读取权限；只有 publish-report job 可写 ci-report。
# 成功 run 的 job 日志要凭据才读得到、且没有产物，所以"绿了"本身必须自带现场（steps/envSkips/围栏能力）。
name: 测试

on:
  push:
  pull_request:

permissions:
  contents: read # 默认只读；仅 publish-report job 获得 ci-report 写权限。

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 准备 Rust（runner 自带工具链，不装项目外的任何东西）
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          cargo --version

      - name: 跑全部测试（一次性环境：允许真机围栏测试）
        run: node run-tests.js --fence-live

      - name: 抓 macOS 沙箱拒绝记录（无论成败都留；非 macOS 跳过）
        if: always() && runner.os == 'macOS'
        run: |
          mkdir -p target/test-logs
          # 内核把每次沙箱拒绝写进统一日志（"Sandbox: <进程> deny(1) <操作> <路径>"）。
          # 失败时它是"缺哪条放行"的原始证据；通过时它是"围栏确实生效并拦过越界读"的正面证据。
          sudo log show --last 10m --style compact --predicate 'eventMessage CONTAINS "Sandbox"' 2>/dev/null | tail -n 200 > target/test-logs/sandbox-denials.log || true
          echo "沙箱拒绝记录行数：$(wc -l < target/test-logs/sandbox-denials.log)"

      - name: 留产物（报告与日志，供人下载；无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: |
            target/test-report.json
            target/test-logs/
          if-no-files-found: ignore

  publish-report:
    name: 汇总并发布 ci-report
    needs: test
    permissions:
      contents: write
    if: ${{ always() && needs.test.result != 'cancelled' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ci-report-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 先把 ci-report 重建为空分支
        env:
          REPORT_BRANCH: ci-report
        run: |
          source_sha="${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 先重建并强推空报告分支；此时尚未下载 artifacts，因此不会误删报告现场。
          # 使用孤儿提交切断默认分支内容；后续只由报告文件重新填充该分支。
          git checkout --orphan ci-report-clean
          git rm -rf . >/dev/null 2>&1 || true
          git commit --allow-empty -m "重建 ci-report 报告树（run ${GITHUB_RUN_NUMBER}）"
          git push origin "HEAD:refs/heads/${REPORT_BRANCH}" --force

      - name: 恢复源码工作树
        run: git checkout --detach "${GITHUB_SHA}"

      - name: 下载三个测试 job 的报告产物
        uses: actions/download-artifact@v4
        with:
          pattern: test-report-*
          path: ci-artifacts
          merge-multiple: false

      - name: 逐平台写入干净的报告分支
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # ci-publish.mjs 负责报告内容、失败证据和 Contents API 写入；这里串行调用，
          # 避免三个平台同时覆盖 ci-report，并使前面的空分支重建不会留下旧文件。
          for platform in windows-latest ubuntu-latest macos-latest; do
            rm -rf target
            mkdir -p target/test-logs

            artifact_target="ci-artifacts/test-report-${platform}"
            if [ -d "${artifact_target}" ]; then
              cp -R "${artifact_target}/." target/
            fi

            case "${platform}" in
              windows-latest) runner_os="Windows" ;;
              ubuntu-latest) runner_os="Linux" ;;
              macos-latest) runner_os="macOS" ;;
              *) echo "未知平台：${platform}" >&2; exit 1 ;;
            esac

            echo "发布 ${platform} 的报告"
            RUNNER_OS="${runner_os}" node tests/ci-publish.mjs
          done
