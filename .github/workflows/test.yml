# 三平台测试：GitHub 托管 runner 是一次性机器，「会改本机状态」的真机围栏测试只在这里开。
# 本地默认安全模式（见 TESTING.md）：会改本机状态的测试要显式 --fence-live。
#
# 触发：**PR（目标 main，且已 Ready for review）、手动 workflow_dispatch，以及 push 到 main**。push 只跑
# cache-seed（把工具链缓存播种到 main，供后续 PR 恢复），其余 job 在 push 事件上全部跳过：不跑门禁、
# 不碰 ci-report，也不为了一次合并把整套门禁在 main 上再跑一遍（PR 上已经跑过同一份 head）。
# Draft PR 的 opened / synchronize 仍会创建 run，但所有 job 跳过（不耗 runner、不发布 ci-report）；
# 标 Ready（ready_for_review）才跑验收，之后的推送也重跑。PR 验收 PR head 提交（SOURCE_SHA），
# 报告的 sha 因此等于 PR 头；手动派发验收 github.sha。代码验收的 CI 价值是给出本机拿不到的结论（他平台编译、
# 真机围栏、TLS 出站）；文档/结构审查在 CI 里跑是为了合并闸门，不是补平台结论。inputs.clean=true 跳过缓存，用于「干净机器」验收。契约见 docs/testing/execution-ci.md。
#
# job 结构：平台相关的是 quality（平台门禁 + 单元 + 探针 + 前端冒烟）与 e2e（L4 端到端）；
# 覆盖率报告 coverage 只在 Linux 采集（子进程 profile 依赖 POSIX 信号正常退出，Windows 的 TerminateProcess
# 会丢掉产品进程 atexit 写出的 profile；平台专有代码由三平台 quality 的行为测试覆盖）。
# 覆盖率不是验收闸门：它不进 gate 的判定（tests/ci-gate.mjs 不读它），job 级 continue-on-error 让它红了也不改
# workflow 结论——报告只作为观察指标留档。
# 平台无关的是 changes（分流）、docs（文档审查）、structure（结构审查）、workflow（工作流静态检查）、
# gate（验收闸门）与 publish-report（汇总发布）。push 到 main 只跑 cache-seed（三平台并行播种工具链缓存）。
# 有代码变更 → quality / coverage / e2e；有文档变更 → docs；structure / workflow 始终跑（结构代码和文档两边都能破坏；
# workflow 改坏会让必填检查不上报，所以不按变更类型跳过）。
# gate 汇总五个 lane 的结果，是规则集里唯一代表代码/文档验收的必填检查：quality / e2e 是矩阵 job，被 job 级 if 跳过时
# 矩阵不展开，只报一条名字带字面量 ${{ matrix.os }} 的 skipped，永远对不上按平台名配置的 required context。
# gate 的判定逻辑在 tests/ci-gate.mjs（--self-test 覆盖跳过合法性），本文件只把 needs.*.result 传进去。
# 报告统一到 ci-report：runs/structure、runs/docs、runs/<os>；gate 只做闸门，不产报告。
# changes 只是路由，不要设为 required（卡住不应阻塞合并）；也不要用 workflow 级 paths-ignore（required check 会永远 pending）。
# 第三方 action 一律 SHA pin（行尾注释保留可读版本）；升级时同一个 diff 改 SHA 与注释，不跑无人审的浮动 tag。
# 缓存只读不写：任何 ref 都能恢复，保存只在 main（PR 的缓存分支作用域只对同分支可见，存了只会挤掉主线缓存项）。
# main 上的工具链缓存由 push 触发的 cache-seed 播种（合并即 push），依赖与编译产物缓存仍由手动派发到 main 的 quality 保存。
# 开发工具链统一项目内（与本机同一口径）：quality / e2e / coverage 跑 env.js setup（+ setup-dev）装齐
# Rust / cc / python / node / 组件 / 供应链工具，探针在场即跳过；工具链缓存按清单哈希取，只由 cache-seed
# （push 到 main）与 quality（手动派发到 main）保存——播种 job 只写工具链，不写 cargo / target，见其注释。
# setup-node 固定 24 只作点火：门禁入口 re-exec 到项目内 node（env.js 的 reexecProjectNode）。
name: 测试

on:
  workflow_dispatch:
    inputs:
      clean:
        description: "跳过缓存，按干净机器跑（验收用）"
        type: boolean
        default: false
  pull_request:
    branches: [main]
    # ready_for_review 不在默认活动类型里：不加这一项，Draft 转 Ready 不会触发 CI。
    types: [opened, synchronize, reopened, ready_for_review]
  # 合并 PR 就是一次 main 上的 push：只跑 cache-seed 播种工具链缓存，其余 job 用各自的
  # `github.event_name != 'push'` 守卫跳过。规则集没有 restrictions 规则，"禁止直接 push" 由
  # pull_request 规则实现，与这里的 push 触发器不冲突（详见 docs/testing/execution-ci.md）。
  push:
    branches: [main]

# PR 触发时验收 PR head（不是 merge commit）；手动派发时就是 github.sha。报告与发布共用这一份；
# checkout 用 base 仓的 refs/pull/<N>/head，指向同一个 head 提交。
# 分流由 changes job 做；不要改成 workflow 级 paths-ignore（required check 会 pending）。
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read # 默认只读；仅 publish-report 获得 ci-report 的写权限。

# 同一 ref 同时只跑一次；不自动取消已开跑的那次（验收现场不能被中途掐掉，ci-report 不能被写坏）。
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: 变更分流
    # Draft 不跑：Draft 的 opened / synchronize 会创建 run，这里跳过（不耗 runner）。
    if: ${{ github.event_name != 'push' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 只读 job：分类不写仓库，关闭令牌持久化（zizmor artipacked）。
          persist-credentials: false
          # 与三个重 job 同一份 head；分类只看 PR 的提交差异。
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # 分类器自带样例自测与 include_str! 文档消费自检：自测失败 = job 失败，下游按全量兜底。
      # 从 base 取分类器副本再执行：PR 若改 tests/ci-changes.mjs 想把自己判成全文档，改的是 head 的脚本，
      # 而这里跑的是 base 的脚本（它会把该文件判成代码）；base 还没有分类器时直接用全量。
      # 分类字段缺失（例如 base 的分类器还没有该键）时，下游条件按「!= false」兜底为全量跑。
      - name: 判定代码 / 文档变更
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOLOMNI_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ]; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}" >/dev/null 2>&1 || true
          fi
          mkdir -p target
          if [ -n "${BASE_SHA}" ] && git show "${BASE_SHA}:tests/ci-changes.mjs" > target/ci-changes-trusted.mjs 2>/dev/null; then
            node target/ci-changes-trusted.mjs
          else
            echo "::warning title=变更分流::base 没有可信分类器，按全量 CI 处理"
            {
              echo "code_changed=true"
              echo "docs_changed=true"
            } >> "${GITHUB_OUTPUT}"
          fi

  docs:
    name: 文档审查
    needs: changes
    # 有文档变更才跑；纯代码 PR 跳过（代码不会碰门户、链接、根文档路由）。
    # 只有显式 false 才跳过：分类器缺失/分类失败一律按全量跑。
    if: ${{ github.event_name != 'push' && always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.changes.result != 'success' || needs.changes.outputs.docs_changed != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 只读 job：不写仓库，关闭令牌持久化（zizmor artipacked）。
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # 只跑文档自身的检查（门户/链接/根文档路由），不编译、不跑三平台。
      - name: 文档审查
        run: node run-tests.js --audit=docs

      - name: 留产物（文档审查报告；无论成败）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-report
          path: target/test-report.json
          if-no-files-found: ignore

  structure:
    name: 结构审查
    # 始终跑：代码↔文档结构两边都能破坏（新增 src 文件没进 unit-map；删 unit-map 一行 / 提示词键表一个键）。
    # 平台无关，只跑一次；不放进三平台 quality，避免每个平台各跑一遍。
    if: ${{ github.event_name != 'push' && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 只读 job：不写仓库，关闭令牌持久化（zizmor artipacked）。
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # 只跑代码↔文档结构审查，不编译、不跑三平台。
      - name: 结构审查
        run: node run-tests.js --audit=structure

      - name: 留产物（结构审查报告；无论成败）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: structure-report
          path: target/test-report.json
          if-no-files-found: ignore

  workflow:
    name: 工作流静态检查
    # 恒跑（与 structure 同理）：workflow 文件本身坏了，必填检查可能根本不上报，所以不按变更类型跳过。
    # actionlint 阻断（YAML / 表达式 / 内联 bash 的 shellcheck）；zizmor 阻断（安全审查，findings 即整个 job 失败）。
    if: ${{ github.event_name != 'push' && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 只读 job：不写仓库，关闭令牌持久化（zizmor artipacked）。
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # 闸门判定脚本自身的自测：要合并进去的 gate 逻辑必须在这一步就验过（9 个样例，含「覆盖率不参与判定」）。
      - name: 闸门判定自测
        run: node tests/ci-gate.mjs --self-test

      # go install 用固定版本 tag（runner 自带 go）；不用浮动下载脚本，避免"今天能跑明天不能跑"。
      - name: 工作流静态检查（actionlint）
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          # 不带参数 = 自动检查 .github/workflows 下所有 workflow（当前 3 个，新文件自动纳入）；
          # 内联 bash 由 actionlint 调 shellcheck 检查（ubuntu runner 自带）。
          "$(go env GOPATH)/bin/actionlint" -no-color

      # zizmor：GitHub Actions 的安全审查（未 pin 的 action、危险触发器、权限过宽等）。
      # 阻断：findings（退出码 11–14）即 job 失败，gate 随之红；安装走 taiki-e/install-action，版本固定 1.32.0。
      - name: 安装 zizmor
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: zizmor@1.32.0

      - name: 工作流安全审查（zizmor）
        run: |
          set -euo pipefail
          zizmor --persona=regular --format=plain .github/workflows

  quality:
    name: 质量与单元（${{ matrix.os }}）
    needs: changes
    # 有代码变更才跑；结构审查由独立 structure job 承担，这里用 --skip-audit。
    if: ${{ github.event_name != 'push' && always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.changes.result != 'success' || needs.changes.outputs.code_changed != 'false') }}
    runs-on: ${{ matrix.os }}
    # 比 e2e 宽：要额外装 Rust 组件与供应链工具（setup-dev；供应链门禁见 docs/testing/levels.md 的 T0）。
    # 冷机要全量引导工具链（Rust / MinGW / python / node / 组件 / 供应链工具），给足墙钟；缓存命中后远快于此。
    timeout-minutes: 60
    # 开发工具链统一项目内（与本机同一口径）：env.js setup 装 Rust/cc/python/node，setup-dev 装组件与供应链工具。
    # OS_KEY 让缓存路径落 platform/<os>/——与 env.js 默认的 CARGO_HOME / RUSTUP_HOME 同一路径。
    env:
      OS_KEY: ${{ matrix.oskey }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            oskey: windows
          - os: ubuntu-latest
            oskey: linux
          - os: macos-latest
            oskey: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 只读 job：不写仓库，关闭令牌持久化（zizmor artipacked）。
          persist-credentials: false
          # fork PR 的 head 分支在对方仓；用 base 仓为每个 PR 建的 refs/pull/<N>/head（同仓 PR 同样可用）。
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}

      # 点火 node：固定 24（与项目内 node 同主版本）；门禁入口 re-exec 到项目内 node，这里只负责点火。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # 工具链缓存：Rust / cc / python / node / 供应链工具（探针在场即跳过安装）。
      # cargo/bin 里的 rustup 代理与 rustup 里的工具链是**一个整体**：只恢复代理、没有工具链时
      # 项目内 cargo 能打印版本却选不出 toolchain，env.js 会当场停下（缓存版本一变就撞上）。
      # 缓存身份 = 清单 + 链接台账 + 开发工具清单的哈希：任一版本变动整体失效；
      # 不给 restore-keys——半套工具链比全新安装更坏（身份不符的缓存宁可不要）。
      - name: 恢复项目内工具链缓存（inputs.clean 时跳过）
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            platform/${{ env.OS_KEY }}/rustup
            platform/${{ env.OS_KEY }}/cargo/bin
            .tools/toolchains
            .tools/mingw64
            .tools/bin
          key: ${{ runner.os }}-${{ runner.arch }}-toolchains-${{ hashFiles('dependencies.yaml', 'links.yaml', 'dev-tools.js') }}

      # 只缓存依赖（registry / git）与 debug 产物：cargo/bin 归工具链缓存（代理与工具链同进同出），
      # 不缓存 target/ 根——报告与日志来自本次运行，不能被上一次的缓存顶替。
      - name: 建项目内 CARGO_HOME（缓存要求目录先存在）
        if: ${{ !inputs.clean }}
        shell: bash
        run: mkdir -p "platform/${OS_KEY}/cargo"

      # 只缓存项目内路径：缓存身份含 path，改路径即新缓存项（旧项自动淘汰，见 docs/testing/execution-ci.md）。
      # 恢复所有 ref（PR 读 main 的缓存）；保存只在 main，见每个 job 末尾的 save 步骤。
      - name: 恢复依赖与编译产物缓存（inputs.clean 时跳过）
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            platform/${{ env.OS_KEY }}/cargo/registry
            platform/${{ env.OS_KEY }}/cargo/git
            target/debug
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      # 前端类型检查用项目内 node_modules（清单与锁文件入库）；不跑第三方安装脚本。
      - name: 安装前端类型检查依赖（npm ci）
        run: npm ci --ignore-scripts --no-audit --no-fund

      # 装齐项目内开发工具链（与本机同一口径；缓存命中即跳过）：Rust/cc/python/node 经 env.js，
      # 组件 / 交叉 target / 供应链工具经 setup-dev。用时经 SOLOMNI_CI_PREINSTALL_MS 带进门禁报告。
      - name: 装齐项目内开发工具链（env.js + setup-dev）
        shell: bash
        run: |
          set -euo pipefail
          start=$(node -e 'console.log(Date.now())')
          node env.js setup --yes
          node setup-dev.js --yes
          echo "SOLOMNI_CI_PREINSTALL_MS=$(( $(node -e 'console.log(Date.now())') - start ))" >> "$GITHUB_ENV"

      # 结构审查已由 structure job 跑过；这里只跑平台相关门禁与测试（--skip-audit）。
      - name: 质量门禁 + 单元 + 平台探针（跳过 L4 与结构审查）
        # --strict-env：必装工具（rustfmt / clippy / cargo-audit / cargo-deny）缺失或取不到数据时，不许记 env-skip 冒充通过。
        run: node run-tests.js --fence-live --skip-e2e --skip-audit --strict-env

      # 锁文件漂移：改了 Cargo.toml 却没带 Cargo.lock 时，cargo 会在 CI 里默默更新锁文件、测试照样绿，
      # 合并后仓库里的锁就过期了。只读工作树：本次运行改过锁文件即失败（改动原文打进日志）。
      - name: 锁文件漂移检查（Cargo.lock 必须与清单一致）
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- Cargo.lock)" ]; then
            echo "::error title=Cargo.lock 漂移::Cargo.lock 被本次运行改动（Cargo.toml / Cargo.lock 必须同一提交）"
            git --no-pager diff -- Cargo.lock
            exit 1
          fi
          echo "Cargo.lock 无漂移"

      - name: 抓 macOS 沙箱拒绝记录（无论成败都留；非 macOS 跳过）
        if: always() && runner.os == 'macOS'
        run: |
          mkdir -p target/test-logs
          # 内核把每次沙箱拒绝写进统一日志（"Sandbox: <进程> deny(1) <操作> <路径>"）。
          # 失败时它是"缺哪条放行"的原始证据；通过时它是"围栏确实生效并拦过越界读"的正面证据。
          sudo log show --last 10m --style compact --predicate 'eventMessage CONTAINS "Sandbox"' 2>/dev/null | tail -n 200 > target/test-logs/sandbox-denials.log || true
          echo "沙箱拒绝记录行数：$(wc -l < target/test-logs/sandbox-denials.log)"

      - name: 留产物（报告与日志，供人下载；无论成败）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report-${{ matrix.os }}
          path: |
            target/test-report.json
            target/test-logs/
          if-no-files-found: ignore

      # 保存只在 main：PR 的缓存作用域只对同分支可见，存了只会挤掉主线缓存项；save 失败不挡验收。
      - name: 保存项目内工具链缓存（仅 main）
        if: ${{ !inputs.clean && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            platform/${{ env.OS_KEY }}/rustup
            platform/${{ env.OS_KEY }}/cargo/bin
            .tools/toolchains
            .tools/mingw64
            .tools/bin
          key: ${{ runner.os }}-${{ runner.arch }}-toolchains-${{ hashFiles('dependencies.yaml', 'links.yaml', 'dev-tools.js') }}

      - name: 保存依赖与编译产物缓存（仅 main）
        if: ${{ !inputs.clean && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            platform/${{ env.OS_KEY }}/cargo/registry
            platform/${{ env.OS_KEY }}/cargo/git
            target/debug
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}

  e2e:
    name: 端到端（${{ matrix.os }}）
    needs: changes
    # 有代码变更才跑；文档-only 时跳过。
    if: ${{ github.event_name != 'push' && always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.changes.result != 'success' || needs.changes.outputs.code_changed != 'false') }}
    runs-on: ${{ matrix.os }}
    # HTTP 旅程 + 浏览器旅程各起一次编排器；浏览器缺失时要下载 Chromium，冷机还要全量引导工具链，留足墙钟。
    timeout-minutes: 60
    # 开发工具链统一项目内（与本机同一口径）；OS_KEY 让缓存路径落 platform/<os>/（env.js 默认路径）。
    env:
      OS_KEY: ${{ matrix.oskey }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            oskey: windows
          - os: ubuntu-latest
            oskey: linux
          - os: macos-latest
            oskey: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 只读 job：不写仓库，关闭令牌持久化（zizmor artipacked）。
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}

      # 点火 node：固定 24；ci-e2e 入口 re-exec 到项目内 node，这里只负责点火。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # 工具链缓存：与 quality 同一 key（同机同清单共用一份）；探针在场即跳过安装。
      - name: 恢复项目内工具链缓存（inputs.clean 时跳过）
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            platform/${{ env.OS_KEY }}/rustup
            platform/${{ env.OS_KEY }}/cargo/bin
            .tools/toolchains
            .tools/mingw64
            .tools/bin
          key: ${{ runner.os }}-${{ runner.arch }}-toolchains-${{ hashFiles('dependencies.yaml', 'links.yaml', 'dev-tools.js') }}

      # 浏览器 E2E 用项目内 playwright（根 package.json + 锁文件）；不跑安装脚本，浏览器由 CLI 单独下载。
      - name: 安装浏览器 E2E 依赖（npm ci）
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 建项目内 CARGO_HOME（缓存要求目录先存在）
        if: ${{ !inputs.clean }}
        shell: bash
        run: mkdir -p "platform/${OS_KEY}/cargo"

      # 只缓存项目内路径：缓存身份含 path，改路径即新缓存项（旧项自动淘汰，见 docs/testing/execution-ci.md）。
      # 恢复所有 ref（PR 读 main 的缓存）；保存只在 main，见每个 job 末尾的 save 步骤。
      - name: 恢复依赖与编译产物缓存（inputs.clean 时跳过）
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            platform/${{ env.OS_KEY }}/cargo/registry
            platform/${{ env.OS_KEY }}/cargo/git
            target/debug
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      # 浏览器二进制单独缓存：按 playwright 锁文件版本取，换版本自动失效。
      - name: 恢复浏览器缓存（inputs.clean 时跳过）
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # 装齐项目内工具链（与本机同一口径；缓存命中即跳过）：e2e 要构建产品、编 indexer、跑 python/node 模块工具。
      # 组件 / 供应链工具由 quality job 的 setup-dev 装（同一份工具链缓存），这里不重复装。
      - name: 装齐项目内工具链（env.js）
        run: node env.js setup --yes

      # 自己构建产品（不依赖 quality job 的产物，才能和它并行）：构建 + HTTP 旅程 + 浏览器旅程 + 写 e2e-report.json。
      - name: 跑 L4 端到端（HTTP + 浏览器）
        run: node tests/ci-e2e.mjs

      # 上传根必须与 quality 一致（都是 target/）：发布端把产物 cp 进 target/ 再找 target/e2e-report.json；
      # 若把夹具日志（tests/...）也放进同一个产物，上传根会被抬到仓库根，报告就变成 target/target/e2e-report.json。
      - name: 汇总 e2e 夹具日志（上传根统一为 target/）
        if: always()
        shell: bash
        run: |
          mkdir -p target/e2e-logs
          if [ -d tests/cross-platform/e2e/root/logs ]; then cp -R tests/cross-platform/e2e/root/logs/. target/e2e-logs/; fi

      - name: 留产物（e2e 报告与日志；无论成败）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            target/e2e-report.json
            target/test-logs/
            target/e2e-logs/
            target/e2e-browser/
          if-no-files-found: ignore

      # 保存只在 main（同 quality job）：PR 只恢复 main 的缓存，不往缓存池里加同分支私有项。
      # 工具链缓存只由 quality 保存（它跑 setup-dev，.tools/bin 齐全）；这里只恢复不保存，
      # 免得空 .tools/bin 抢先占住同 key，让供应链工具每次重装。
      - name: 保存依赖与编译产物缓存（仅 main）
        if: ${{ !inputs.clean && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            platform/${{ env.OS_KEY }}/cargo/registry
            platform/${{ env.OS_KEY }}/cargo/git
            target/debug
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: 保存浏览器缓存（仅 main）
        if: ${{ !inputs.clean && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

  coverage:
    name: 覆盖率报告（Linux）
    # 只报不拦：不达标按 policy.reportOnly 退出 0；坏跑（测试/e2e 挂）仍非零，但只是这份报告红，
    # 既不进 gate 的判定，也不把 workflow 判成失败（job 级 continue-on-error）。
    continue-on-error: true
    needs: changes
    # 有代码变更才跑；覆盖率要跑单元/平台测试 + 插桩构建 + L4，成本高于 quality，不放进矩阵。
    if: ${{ github.event_name != 'push' && always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.changes.result != 'success' || needs.changes.outputs.code_changed != 'false') }}
    runs-on: ubuntu-latest
    # 冷机要编译两遍（普通 + 插桩）再跑 L4；给足时间，超时按失败处理。
    timeout-minutes: 60
    # 开发工具链统一项目内（与本机同一口径）；缓存路径落 platform/linux/（env.js 默认路径）。
    env:
      OS_KEY: linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 只读 job：不写仓库，关闭令牌持久化（zizmor artipacked）。
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          # 变更行门禁要拿 PR 基线做 git diff；浅克隆没有基线提交。
          fetch-depth: 0

      # 点火 node：固定 24；coverage 入口 re-exec 到项目内 node，这里只负责点火。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # 工具链缓存：与 quality 同一 key、同一批路径（只恢复不保存——保存由 quality 统一做，见那里的注释）。
      - name: 恢复项目内工具链缓存（inputs.clean 时跳过）
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            platform/${{ env.OS_KEY }}/rustup
            platform/${{ env.OS_KEY }}/cargo/bin
            .tools/toolchains
            .tools/mingw64
            .tools/bin
          key: ${{ runner.os }}-${{ runner.arch }}-toolchains-${{ hashFiles('dependencies.yaml', 'links.yaml', 'dev-tools.js') }}

      - name: 建项目内 CARGO_HOME（缓存要求目录先存在）
        if: ${{ !inputs.clean }}
        shell: bash
        run: mkdir -p "platform/${OS_KEY}/cargo"

      # 只缓存依赖：插桩产物带 RUSTFLAGS，跨提交复用会把编译缓存搅乱，不缓存 target/。
      - name: 恢复依赖缓存（inputs.clean 时跳过）
        if: ${{ !inputs.clean }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            platform/${{ env.OS_KEY }}/cargo/registry
            platform/${{ env.OS_KEY }}/cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-coverage-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-coverage-cargo-

      # 装齐项目内工具链（与本机同一口径）：cargo-llvm-cov 与 llvm-tools-preview 经 setup-dev
      # 装进项目内（.tools/bin 与项目内 rustup），不再用 runner 的 rustup / 预编译动作。
      - name: 装齐项目内开发工具链（env.js + setup-dev）
        run: |
          node env.js setup --yes
          node setup-dev.js --yes

      # 四步：测试进程内 profile → 插桩构建产品 → L4 子进程 profile → 合并报告并按风险区统计 80/60/100。
      # 只报不拦（tests/coverage-policy.json 的 reportOnly）：桶与变更行不达标只打回执，本 job 变红不阻塞合并，
      # gate 对它只出 ::warning。测试或 e2e 坏跑仍非零；缺工具直接非零，不记 env-skip 冒充通过。
      - name: 采集并报告覆盖率
        env:
          # PR 才有基线；main 推送与手动运行只判风险桶。
          COVERAGE_DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        run: node tests/coverage.mjs --collect

      - name: 留产物（覆盖率报告与摘要；无论成败）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: target/coverage/
          if-no-files-found: ignore

      - name: 保存依赖缓存（仅 main）
        if: ${{ !inputs.clean && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            platform/${{ env.OS_KEY }}/cargo/registry
            platform/${{ env.OS_KEY }}/cargo/git
          key: ${{ runner.os }}-${{ runner.arch }}-coverage-cargo-${{ hashFiles('Cargo.lock') }}

  gate:
    name: 验收闸门
    # 规则集里代表「代码/文档验收可合并」的必填检查：quality / e2e 是矩阵 job，被 job 级 if 跳过时矩阵不展开，
    # 只报一条名字带字面量 ${{ matrix.os }} 的 skipped，按平台名配置的 required context 永远不会上报。
    # 这里用固定名字汇总：跳过是否合法按变更分类判，不按「有没有跑」猜；判定逻辑在 tests/ci-gate.mjs（可自测）。
    # always()：依赖失败或被跳过也要给出结论；取消的 job 结果不是 success，同样判失败，不让 skipped 冒充通过。
    # coverage 不在 needs 里：覆盖率报告不是验收闸门，等它只会让合并多一个无关的等待。
    needs: [changes, docs, structure, workflow, quality, e2e]
    if: ${{ github.event_name != 'push' && always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 只读 job：闸门只读 needs 结果、不写仓库，关闭令牌持久化（zizmor artipacked）。
          persist-credentials: false
          # gate 判定逻辑取自可信来源：同仓 PR 用 head（本 PR 要改 gate 本身），fork PR 用 base
          # （对方不能改闸门逻辑；与 changes 从 base 取分类器同一口径）。非 PR 用 github.sha。
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && format('refs/pull/{0}/head', github.event.pull_request.number) || github.event.pull_request.base.sha || github.sha }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: 按变更类型核对五个 lane
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code_changed }}
          DOCS_CHANGED: ${{ needs.changes.outputs.docs_changed }}
          DOCS: ${{ needs.docs.result }}
          STRUCTURE: ${{ needs.structure.result }}
          WORKFLOW: ${{ needs.workflow.result }}
          QUALITY: ${{ needs.quality.result }}
          E2E: ${{ needs.e2e.result }}
        run: node tests/ci-gate.mjs

  publish-report:
    name: 汇总并发布 ci-report
    needs: [changes, structure, docs, quality, e2e]
    # fork PR 的 token 只读，发布必然失败；测试照跑，只跳过发布。
    # Draft 的 run 里依赖 job 都跳过：这里也跳过，免得发布出空报告。
    # 分类失败时 structure / quality / e2e 已按全量兜底，这里照常发布。
    if: ${{ github.event_name != 'push' && always() && !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-report-publish
      cancel-in-progress: false
    steps:
      # actions/checkout v7.0.1：本 job 用 git push 重建 ci-report 滚动分支，需要 checkout 凭据；其余 checkout 均已关闭持久化。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked] 本 job 需要凭据重建滚动分支
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      # 结构审查始终跑；报告缺失（更早失败）不阻塞发布：ci-publish 会记成失败证据。
      - name: 下载结构审查报告
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: structure-report
          path: ci-artifacts/structure-report

      - name: 下载文档审查报告
        if: ${{ needs.docs.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-report
          path: ci-artifacts/docs-report

      - name: 下载 quality 报告产物
        if: ${{ needs.quality.result != 'skipped' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-report-*
          path: ci-artifacts
          merge-multiple: false

      - name: 下载 e2e 报告产物
        if: ${{ needs.e2e.result != 'skipped' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-report-*
          path: ci-artifacts
          merge-multiple: false

      - name: 先把 ci-report 重建为空分支
        env:
          REPORT_BRANCH: ci-report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # artifacts 已完整下载后才清理并强推；下载失败不会留下空报告分支。
          # git rm 只删除已跟踪源码，保留未跟踪的 ci-artifacts；不要使用 git clean。
          git checkout --orphan ci-report-clean
          git rm -rf . >/dev/null 2>&1 || true
          git commit --allow-empty -m "重建 ci-report 报告树（run ${GITHUB_RUN_NUMBER}）"
          git push origin "HEAD:refs/heads/${REPORT_BRANCH}" --force

      - name: 恢复源码工作树
        run: git checkout --detach "${SOURCE_SHA}"

      # 三个 lane 各写自己的 key：runs/structure、runs/docs、runs/<os>。顺序执行，避免同时覆盖分支。
      - name: 发布结构审查（runs/structure）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_BRANCH: ci-report
          REPORT_OS: structure
        run: |
          set -euo pipefail
          rm -rf target
          mkdir -p target/test-logs
          if [ -d "ci-artifacts/structure-report" ]; then
            cp -R "ci-artifacts/structure-report/." target/
          fi
          node tests/ci-publish.mjs

      - name: 发布文档审查（runs/docs）
        if: ${{ needs.docs.result != 'skipped' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_BRANCH: ci-report
          REPORT_OS: docs
        run: |
          set -euo pipefail
          rm -rf target
          mkdir -p target/test-logs
          if [ -d "ci-artifacts/docs-report" ]; then
            cp -R "ci-artifacts/docs-report/." target/
          fi
          node tests/ci-publish.mjs

      - name: 逐平台合并并发布（runs/<os>）
        if: ${{ needs.quality.result != 'skipped' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 每个平台把 quality 与 e2e 两份报告合并成该平台唯一的 test-report.json（tests/ci-merge.mjs），
          # 再由 ci-publish.mjs 写内容、失败证据与 Contents API。串行调用避免三平台同时覆盖 ci-report。
          for platform in windows-latest ubuntu-latest macos-latest; do
            rm -rf target
            mkdir -p target/test-logs

            if [ -d "ci-artifacts/test-report-${platform}" ]; then
              cp -R "ci-artifacts/test-report-${platform}/." target/
            fi
            if [ -d "ci-artifacts/e2e-report-${platform}" ]; then
              cp -R "ci-artifacts/e2e-report-${platform}/." target/
            fi
            # 上传根错了会落成 target/target/…：宁可让发布红，也别静默丢 L4。
            if [ -f "target/target/e2e-report.json" ]; then
              echo "e2e 产物布局不对：报告落在 target/target/ 下（检查 e2e job 的上传根）" >&2
              exit 1
            fi

            case "${platform}" in
              windows-latest) runner_os="Windows" ;;
              ubuntu-latest) runner_os="Linux" ;;
              macos-latest) runner_os="macOS" ;;
              *) echo "未知平台：${platform}" >&2; exit 1 ;;
            esac

            echo "合并并发布 ${platform} 的报告"
            node tests/ci-merge.mjs
            RUNNER_OS="${runner_os}" node tests/ci-publish.mjs
          done

  # push 到 main（合并 PR）时唯一跑的 job：把项目内工具链装进 main 的缓存，供后续 PR 恢复。
  # 只播工具链（含 cargo/bin 的 rustup 代理）、不播 cargo 依赖与 target：播种 run 里没有源码依赖图，存下去的是空 target，
  # 而缓存键不可覆盖——那会把后续 PR 的编译缓存永久毒化。依赖与编译产物缓存仍由手动派发到 main 的 quality 刷新。
  # 先 lookup-only 查一次：缓存已经在就只花几秒，不必为了「保存」再跑一遍安装。
  cache-seed:
    name: 播种工具链缓存（${{ matrix.os }}）
    # 只有 push 事件；其余触发方式走质量的正常恢复 / 保存路径（见各 job 的 save 步骤）。
    if: ${{ github.event_name == 'push' }}
    runs-on: ${{ matrix.os }}
    # 冷机全量引导一次工具链（与 quality 同一份清单、同一份缓存 key）。
    timeout-minutes: 60
    env:
      OS_KEY: ${{ matrix.oskey }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            oskey: windows
          - os: ubuntu-latest
            oskey: linux
          - os: macos-latest
            oskey: macos
    steps:
      # 只读 job：只装工具链进项目内目录，不写仓库。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      # 点火 node：与 quality 同一版本；env.js 只用内置模块，不需要 npm ci。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # lookup-only：命中就只置 cache-hit，不下载（命中时本 job 全程几秒）。
      - name: 查询项目内工具链缓存
        id: toolchain
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            platform/${{ env.OS_KEY }}/rustup
            platform/${{ env.OS_KEY }}/cargo/bin
            .tools/toolchains
            .tools/mingw64
            .tools/bin
          key: ${{ runner.os }}-${{ runner.arch }}-toolchains-${{ hashFiles('dependencies.yaml', 'links.yaml', 'dev-tools.js') }}
          lookup-only: true

      - name: 装齐项目内开发工具链（env.js + setup-dev）
        if: ${{ steps.toolchain.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          node env.js setup --yes
          node setup-dev.js --yes

      # 与 quality 的恢复 key 逐字一致：同一份清单哈希、同一批路径。
      - name: 保存项目内工具链缓存（仅未命中时）
        if: ${{ steps.toolchain.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            platform/${{ env.OS_KEY }}/rustup
            platform/${{ env.OS_KEY }}/cargo/bin
            .tools/toolchains
            .tools/mingw64
            .tools/bin
          key: ${{ steps.toolchain.outputs.cache-primary-key }}
