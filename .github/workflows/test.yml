# 三平台测试：GitHub 托管 runner 是一次性机器，「会改本机状态」的真机围栏测试只在这里开。
# 本地默认安全模式（见 TESTING.md）：会改本机状态的测试要显式 --fence-live。
#
# 触发：**PR（目标 main，且已 Ready for review）与手动 workflow_dispatch**；push 不触发。
# Draft PR 的 opened / synchronize 仍会创建 run，但所有 job 跳过（不耗 runner、不发布 ci-report）；
# 标 Ready（ready_for_review）才跑验收，之后的推送也重跑。PR 验收 PR head 提交（SOURCE_SHA），
# 报告的 sha 因此等于 PR 头；手动派发验收 github.sha。CI 的唯一价值是给出本机拿不到的结论（他平台编译、
# 真机围栏、TLS 出站）。inputs.clean=true 跳过缓存，用于「干净机器」验收。契约见 docs/testing/execution-ci.md。
#
# 契约：每个平台**恰好两个 job**——quality（T0 + 单元 + 平台探针 + 前端冒烟）与 e2e（L4 端到端）；
# 不得再拆。publish-report 下载两份报告、合并后发布 ci-report（成败都发）。
name: 测试

on:
  workflow_dispatch:
    inputs:
      clean:
        description: "跳过缓存，按干净机器跑（验收用）"
        type: boolean
        default: false
  pull_request:
    branches: [main]
    # ready_for_review 不在默认活动类型里：不加这一项，Draft 转 Ready 不会触发 CI。
    types: [opened, synchronize, reopened, ready_for_review]

# PR 触发时验收 PR head（不是 merge commit）；手动派发时就是 github.sha。报告与发布共用这一份；
# checkout 用 base 仓的 refs/pull/<N>/head，指向同一个 head 提交。
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read # 默认只读；仅 publish-report job 获得 ci-report 写权限。

# 同一 ref 同时只跑一次；不自动取消已开跑的那次（验收现场不能被中途掐掉，ci-report 不能被写坏）。
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: 质量与单元（${{ matrix.os }}）
    # Draft PR 不跑：Draft 的 opened / synchronize 会创建 run，但这里跳过（不耗 runner）。
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    # 比 e2e 宽：要额外预编译装 cargo-audit / cargo-deny（供应链门禁，见 docs/testing/levels.md 的 T0）。
    timeout-minutes: 45
    # 借用 runner 自带 Rust，但缓存/安装落项目内（见 docs/testing/execution-ci.md）。
    env:
      CARGO_HOME: ${{ github.workspace }}/platform/ci/cargo
      SOLOMNI_CARGO_HOME: ${{ github.workspace }}/platform/ci/cargo
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          # fork PR 的 head 分支在对方仓；用 base 仓为每个 PR 建的 refs/pull/<N>/head（同仓 PR 同样可用）。
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}

      # 最新稳定线：Node 的 lts/* = 当前 LTS（生产稳定线），随 LTS 迁移自动跟进，不用手工改版本号。
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      # 只借 runner 自带 Rust（探测可用即用），不装、不改它的 home；只读它的 toolchain。
      - name: 准备 Rust（借用 runner 自带工具链）
        run: |
          rustc --version
          cargo --version

      # 只缓存依赖与 debug 产物。不缓存 target/ 根：报告与日志来自本次运行，不能被上一次的缓存顶替。
      - name: 建项目内 CARGO_HOME（缓存要求目录先存在）
        if: ${{ !inputs.clean }}
        shell: bash
        run: mkdir -p platform/ci/cargo

      # 只缓存项目内路径：缓存身份含 path，改路径即新缓存项（旧项自动淘汰，见 docs/testing/execution-ci.md）。
      - name: 缓存依赖与编译产物（inputs.clean 时跳过）
        if: ${{ !inputs.clean }}
        uses: actions/cache@v6
        with:
          path: |
            platform/ci/cargo
            target/debug
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 仅 CI：预编译装供应链工具（快）。本地开发不引第三方，仍按 run-tests.js 的提示 cargo install 到项目内。
      # 安装用时经 SOLOMNI_CI_PREINSTALL_MS 带进门禁报告（见 docs/testing/execution-ci.md）。
      - name: 记录供应链工具安装起跑
        shell: bash
        run: echo "SOLOMNI_PREINSTALL_START_MS=$(node -e 'console.log(Date.now())')" >> "$GITHUB_ENV"

      - name: 安装供应链检查工具（预编译，仅 CI）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: 记录供应链工具安装耗时（进测试报告）
        shell: bash
        run: echo "SOLOMNI_CI_PREINSTALL_MS=$(( $(node -e 'console.log(Date.now())') - SOLOMNI_PREINSTALL_START_MS ))" >> "$GITHUB_ENV"

      - name: 质量门禁 + 单元 + 平台探针（跳过 L4，由 e2e job 承担）
        run: node run-tests.js --fence-live --skip-e2e

      - name: 抓 macOS 沙箱拒绝记录（无论成败都留；非 macOS 跳过）
        if: always() && runner.os == 'macOS'
        run: |
          mkdir -p target/test-logs
          # 内核把每次沙箱拒绝写进统一日志（"Sandbox: <进程> deny(1) <操作> <路径>"）。
          # 失败时它是"缺哪条放行"的原始证据；通过时它是"围栏确实生效并拦过越界读"的正面证据。
          sudo log show --last 10m --style compact --predicate 'eventMessage CONTAINS "Sandbox"' 2>/dev/null | tail -n 200 > target/test-logs/sandbox-denials.log || true
          echo "沙箱拒绝记录行数：$(wc -l < target/test-logs/sandbox-denials.log)"

      - name: 留产物（报告与日志，供人下载；无论成败）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.os }}
          path: |
            target/test-report.json
            target/test-logs/
          if-no-files-found: ignore

  e2e:
    name: 端到端（${{ matrix.os }}）
    # Draft PR 不跑（同 quality）：Ready 之后才产生验收结论。
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_HOME: ${{ github.workspace }}/platform/ci/cargo
      SOLOMNI_CARGO_HOME: ${{ github.workspace }}/platform/ci/cargo
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      # 只借 runner 自带 Rust（探测可用即用），不装、不改它的 home；只读它的 toolchain。
      - name: 准备 Rust（借用 runner 自带工具链）
        run: |
          rustc --version
          cargo --version

      - name: 建项目内 CARGO_HOME（缓存要求目录先存在）
        if: ${{ !inputs.clean }}
        shell: bash
        run: mkdir -p platform/ci/cargo

      # 只缓存项目内路径：缓存身份含 path，改路径即新缓存项（旧项自动淘汰，见 docs/testing/execution-ci.md）。
      - name: 缓存依赖与编译产物（inputs.clean 时跳过）
        if: ${{ !inputs.clean }}
        uses: actions/cache@v6
        with:
          path: |
            platform/ci/cargo
            target/debug
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 自己构建产品（不依赖 quality job 的产物，才能和它并行）：构建 + 编排 + 写 e2e-report.json。
      - name: 跑 L4 端到端
        run: node tests/ci-e2e.mjs

      - name: 留产物（e2e 报告与日志；无论成败）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            target/e2e-report.json
            target/test-logs/
          if-no-files-found: ignore

  publish-report:
    name: 合并并发布 ci-report
    needs: [quality, e2e]
    # fork PR 的 token 只读，发布必然失败；测试照跑，只跳过发布。
    # Draft 的 run 里两个依赖 job 都跳过：这里也跳过，免得发布出空报告。
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-report-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: 下载 quality 报告产物
        uses: actions/download-artifact@v8
        with:
          pattern: test-report-*
          path: ci-artifacts
          merge-multiple: false

      - name: 下载 e2e 报告产物
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-report-*
          path: ci-artifacts
          merge-multiple: false

      - name: 先把 ci-report 重建为空分支
        env:
          REPORT_BRANCH: ci-report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # artifacts 已完整下载后才清理并强推 ci-report；下载失败不会留下空报告分支。
          # git rm 只删除已跟踪源码，保留未跟踪的 ci-artifacts；不要使用 git clean。
          git checkout --orphan ci-report-clean
          git rm -rf . >/dev/null 2>&1 || true
          git commit --allow-empty -m "重建 ci-report 报告树（run ${GITHUB_RUN_NUMBER}）"
          git push origin "HEAD:refs/heads/${REPORT_BRANCH}" --force

      - name: 恢复源码工作树
        run: git checkout --detach "${SOURCE_SHA}"

      - name: 逐平台合并并写入干净的报告分支
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 每个平台把 quality 与 e2e 两份报告合并成该平台唯一的 test-report.json（tests/ci-merge.mjs），
          # 再由 ci-publish.mjs 写内容、失败证据与 Contents API。串行调用避免三平台同时覆盖 ci-report。
          for platform in windows-latest ubuntu-latest macos-latest; do
            rm -rf target
            mkdir -p target/test-logs

            if [ -d "ci-artifacts/test-report-${platform}" ]; then
              cp -R "ci-artifacts/test-report-${platform}/." target/
            fi
            if [ -d "ci-artifacts/e2e-report-${platform}" ]; then
              cp -R "ci-artifacts/e2e-report-${platform}/." target/
            fi

            case "${platform}" in
              windows-latest) runner_os="Windows" ;;
              ubuntu-latest) runner_os="Linux" ;;
              macos-latest) runner_os="macOS" ;;
              *) echo "未知平台：${platform}" >&2; exit 1 ;;
            esac

            echo "合并并发布 ${platform} 的报告"
            node tests/ci-merge.mjs
            RUNNER_OS="${runner_os}" node tests/ci-publish.mjs
          done
