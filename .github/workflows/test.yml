# 三平台测试：GitHub 托管 runner 是一次性机器，「会改本机状态」的真机围栏测试只在这里开。
# 本地默认安全模式（见 TESTING.md）：会改本机状态的测试要显式 --fence-live。
#
# 触发：**PR（目标 main，且已 Ready for review）与手动 workflow_dispatch**；push 不触发。
# Draft PR 的 opened / synchronize 仍会创建 run，但所有 job 跳过（不耗 runner、不发布 ci-report）；
# 标 Ready（ready_for_review）才跑验收，之后的推送也重跑。PR 验收 PR head 提交（SOURCE_SHA），
# 报告的 sha 因此等于 PR 头；手动派发验收 github.sha。代码验收的 CI 价值是给出本机拿不到的结论（他平台编译、
# 真机围栏、TLS 出站）；文档/结构审查在 CI 里跑是为了合并闸门，不是补平台结论。inputs.clean=true 跳过缓存，用于「干净机器」验收。契约见 docs/testing/execution-ci.md。
#
# job 结构：平台相关的是 quality（平台门禁 + 单元 + 探针 + 前端冒烟）与 e2e（L4 端到端）；
# 平台无关的是 changes（分流）、docs（文档审查）、structure（结构审查）、gate（验收闸门）与 publish-report（汇总发布）。
# 有代码变更 → quality / e2e；有文档变更 → docs；structure 始终跑（代码或文档变更都可能破坏代码↔文档结构）。
# gate 汇总四个 job 的结果，是规则集里唯一代表代码/文档验收的必填检查：quality / e2e 是矩阵 job，被 job 级 if 跳过时
# 矩阵不展开，只报一条名字带字面量 ${{ matrix.os }} 的 skipped，永远对不上按平台名配置的 required context。
# 报告统一到 ci-report：runs/structure、runs/docs、runs/<os>；gate 只做闸门，不产报告。
# changes 只是路由，不要设为 required（卡住不应阻塞合并）；也不要用 workflow 级 paths-ignore（required check 会永远 pending）。
name: 测试

on:
  workflow_dispatch:
    inputs:
      clean:
        description: "跳过缓存，按干净机器跑（验收用）"
        type: boolean
        default: false
  pull_request:
    branches: [main]
    # ready_for_review 不在默认活动类型里：不加这一项，Draft 转 Ready 不会触发 CI。
    types: [opened, synchronize, reopened, ready_for_review]

# PR 触发时验收 PR head（不是 merge commit）；手动派发时就是 github.sha。报告与发布共用这一份；
# checkout 用 base 仓的 refs/pull/<N>/head，指向同一个 head 提交。
# 分流由 changes job 做；不要改成 workflow 级 paths-ignore（required check 会 pending）。
env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read # 默认只读；仅 publish-report 获得 ci-report 的写权限。

# 同一 ref 同时只跑一次；不自动取消已开跑的那次（验收现场不能被中途掐掉，ci-report 不能被写坏）。
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: 变更分流
    # Draft 不跑：Draft 的 opened / synchronize 会创建 run，这里跳过（不耗 runner）。
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code_changed: ${{ steps.classify.outputs.code_changed }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 与三个重 job 同一份 head；分类只看 PR 的提交差异。
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      # 分类器自带样例自测与 include_str! 文档消费自检：自测失败 = job 失败，下游按全量兜底。
      # 从 base 取分类器副本再执行：PR 若改 tests/ci-changes.mjs 想把自己判成全文档，改的是 head 的脚本，
      # 而这里跑的是 base 的脚本（它会把该文件判成代码）；base 还没有分类器时直接用全量。
      # 分类字段缺失（例如 base 的分类器还没有该键）时，下游条件按「!= false」兜底为全量跑。
      - name: 判定代码 / 文档变更
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SOLOMNI_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA}" ]; then
            git fetch --no-tags --depth=1 origin "${BASE_SHA}" >/dev/null 2>&1 || true
          fi
          mkdir -p target
          if [ -n "${BASE_SHA}" ] && git show "${BASE_SHA}:tests/ci-changes.mjs" > target/ci-changes-trusted.mjs 2>/dev/null; then
            node target/ci-changes-trusted.mjs
          else
            echo "::warning title=变更分流::base 没有可信分类器，按全量 CI 处理"
            {
              echo "code_changed=true"
              echo "docs_changed=true"
            } >> "${GITHUB_OUTPUT}"
          fi

  docs:
    name: 文档审查
    needs: changes
    # 有文档变更才跑；纯代码 PR 跳过（代码不会碰门户、链接、根文档路由）。
    # 只有显式 false 才跳过：分类器缺失/分类失败一律按全量跑。
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.changes.result != 'success' || needs.changes.outputs.docs_changed != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      # 只跑文档自身的检查（门户/链接/根文档路由），不编译、不跑三平台。
      - name: 文档审查
        run: node run-tests.js --audit=docs

      - name: 留产物（文档审查报告；无论成败）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docs-report
          path: target/test-report.json
          if-no-files-found: ignore

  structure:
    name: 结构审查
    # 始终跑：代码↔文档结构两边都能破坏（新增 src 文件没进 unit-map；删 unit-map 一行 / 提示词键表一个键）。
    # 平台无关，只跑一次；不放进三平台 quality，避免每个平台各跑一遍。
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      # 只跑代码↔文档结构审查，不编译、不跑三平台。
      - name: 结构审查
        run: node run-tests.js --audit=structure

      - name: 留产物（结构审查报告；无论成败）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: structure-report
          path: target/test-report.json
          if-no-files-found: ignore

  quality:
    name: 质量与单元（${{ matrix.os }}）
    needs: changes
    # 有代码变更才跑；结构审查由独立 structure job 承担，这里用 --skip-audit。
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.changes.result != 'success' || needs.changes.outputs.code_changed != 'false') }}
    runs-on: ${{ matrix.os }}
    # 比 e2e 宽：要额外预编译装 cargo-audit / cargo-deny（供应链门禁，见 docs/testing/levels.md 的 T0）。
    timeout-minutes: 45
    # 借用 runner 自带 Rust，但缓存/安装落项目内（见 docs/testing/execution-ci.md）。
    env:
      CARGO_HOME: ${{ github.workspace }}/platform/ci/cargo
      SOLOMNI_CARGO_HOME: ${{ github.workspace }}/platform/ci/cargo
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          # fork PR 的 head 分支在对方仓；用 base 仓为每个 PR 建的 refs/pull/<N>/head（同仓 PR 同样可用）。
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}

      # 最新稳定线：Node 的 lts/* = 当前 LTS（生产稳定线），随 LTS 迁移自动跟进，不用手工改版本号。
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      # 只借 runner 自带 Rust（探测可用即用），不装、不改它的 home；只读它的 toolchain。
      - name: 准备 Rust（借用 runner 自带工具链）
        run: |
          rustc --version
          cargo --version

      # 只缓存依赖与 debug 产物。不缓存 target/ 根：报告与日志来自本次运行，不能被上一次的缓存顶替。
      - name: 建项目内 CARGO_HOME（缓存要求目录先存在）
        if: ${{ !inputs.clean }}
        shell: bash
        run: mkdir -p platform/ci/cargo

      # 只缓存项目内路径：缓存身份含 path，改路径即新缓存项（旧项自动淘汰，见 docs/testing/execution-ci.md）。
      - name: 缓存依赖与编译产物（inputs.clean 时跳过）
        if: ${{ !inputs.clean }}
        uses: actions/cache@v6
        with:
          path: |
            platform/ci/cargo
            target/debug
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 仅 CI：预编译装供应链工具（快）。本地开发不引第三方，仍按 run-tests.js 的提示 cargo install 到项目内。
      # 安装用时经 SOLOMNI_CI_PREINSTALL_MS 带进门禁报告（见 docs/testing/execution-ci.md）。
      - name: 记录供应链工具安装起跑
        shell: bash
        run: echo "SOLOMNI_PREINSTALL_START_MS=$(node -e 'console.log(Date.now())')" >> "$GITHUB_ENV"

      - name: 安装供应链检查工具（预编译，仅 CI）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      - name: 记录供应链工具安装耗时（进测试报告）
        shell: bash
        run: echo "SOLOMNI_CI_PREINSTALL_MS=$(( $(node -e 'console.log(Date.now())') - SOLOMNI_PREINSTALL_START_MS ))" >> "$GITHUB_ENV"

      # 结构审查已由 structure job 跑过；这里只跑平台相关门禁与测试（--skip-audit）。
      - name: 质量门禁 + 单元 + 平台探针（跳过 L4 与结构审查）
        run: node run-tests.js --fence-live --skip-e2e --skip-audit

      - name: 抓 macOS 沙箱拒绝记录（无论成败都留；非 macOS 跳过）
        if: always() && runner.os == 'macOS'
        run: |
          mkdir -p target/test-logs
          # 内核把每次沙箱拒绝写进统一日志（"Sandbox: <进程> deny(1) <操作> <路径>"）。
          # 失败时它是"缺哪条放行"的原始证据；通过时它是"围栏确实生效并拦过越界读"的正面证据。
          sudo log show --last 10m --style compact --predicate 'eventMessage CONTAINS "Sandbox"' 2>/dev/null | tail -n 200 > target/test-logs/sandbox-denials.log || true
          echo "沙箱拒绝记录行数：$(wc -l < target/test-logs/sandbox-denials.log)"

      - name: 留产物（报告与日志，供人下载；无论成败）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.os }}
          path: |
            target/test-report.json
            target/test-logs/
          if-no-files-found: ignore

  e2e:
    name: 端到端（${{ matrix.os }}）
    needs: changes
    # 有代码变更才跑；文档-only 时跳过。
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (needs.changes.result != 'success' || needs.changes.outputs.code_changed != 'false') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_HOME: ${{ github.workspace }}/platform/ci/cargo
      SOLOMNI_CARGO_HOME: ${{ github.workspace }}/platform/ci/cargo
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      # 只借 runner 自带 Rust（探测可用即用），不装、不改它的 home；只读它的 toolchain。
      - name: 准备 Rust（借用 runner 自带工具链）
        run: |
          rustc --version
          cargo --version

      - name: 建项目内 CARGO_HOME（缓存要求目录先存在）
        if: ${{ !inputs.clean }}
        shell: bash
        run: mkdir -p platform/ci/cargo

      # 只缓存项目内路径：缓存身份含 path，改路径即新缓存项（旧项自动淘汰，见 docs/testing/execution-ci.md）。
      - name: 缓存依赖与编译产物（inputs.clean 时跳过）
        if: ${{ !inputs.clean }}
        uses: actions/cache@v6
        with:
          path: |
            platform/ci/cargo
            target/debug
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # 自己构建产品（不依赖 quality job 的产物，才能和它并行）：构建 + 编排 + 写 e2e-report.json。
      - name: 跑 L4 端到端
        run: node tests/ci-e2e.mjs

      - name: 留产物（e2e 报告与日志；无论成败）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-${{ matrix.os }}
          path: |
            target/e2e-report.json
            target/test-logs/
          if-no-files-found: ignore

  gate:
    name: 验收闸门
    # 规则集里代表「代码/文档验收可合并」的必填检查：质量与单元 / 端到端是矩阵 job，被 job 级 if 跳过时矩阵不展开，
    # 只报一条名字带字面量 ${{ matrix.os }} 的 skipped，按平台名配置的 required context 永远不会上报。
    # 这里用固定名字汇总：跳过是否合法按变更分类判，不按「有没有跑」猜。
    # always()：依赖失败或被跳过也要给出结论；取消的 job 结果不是 success，同样判失败，不让 skipped 冒充通过。
    needs: [changes, docs, structure, quality, e2e]
    if: ${{ always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 按变更类型核对四个 job
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code_changed }}
          DOCS_CHANGED: ${{ needs.changes.outputs.docs_changed }}
          DOCS: ${{ needs.docs.result }}
          STRUCTURE: ${{ needs.structure.result }}
          QUALITY: ${{ needs.quality.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          failed=0
          # 只有「本次变更本来就不跑这个 lane」才允许 skipped；其余 skipped（取消、异常）都算失败。
          require() {
            echo "- $1：$2（允许跳过：$3）" >> "$GITHUB_STEP_SUMMARY"
            if [ "$2" = "success" ]; then return 0; fi
            if [ "$2" = "skipped" ] && [ "$3" = "yes" ]; then return 0; fi
            echo "::error::$1 未通过：result=$2"
            failed=1
          }
          # 分类字段缺失 / 取不到 diff 时按「有变更」处理，与 job 级兜底一致；changes 自身只是路由，不设闸。
          if [ "${CHANGES}" != "success" ]; then echo "::warning title=验收闸门::变更分流未成功，按全量兜底核对"; fi
          if [ "${DOCS_CHANGED}" = "false" ]; then allow_docs=yes; else allow_docs=no; fi
          if [ "${CODE_CHANGED}" = "false" ]; then allow_code=yes; else allow_code=no; fi
          require "文档审查" "${DOCS}" "${allow_docs}"
          require "结构审查" "${STRUCTURE}" no
          require "质量与单元" "${QUALITY}" "${allow_code}"
          require "端到端" "${E2E}" "${allow_code}"
          if [ "${failed}" -ne 0 ]; then exit 1; fi
          echo "GATE-OK"

  publish-report:
    name: 汇总并发布 ci-report
    needs: [changes, structure, docs, quality, e2e]
    # fork PR 的 token 只读，发布必然失败；测试照跑，只跳过发布。
    # Draft 的 run 里依赖 job 都跳过：这里也跳过，免得发布出空报告。
    # 分类失败时 structure / quality / e2e 已按全量兜底，这里照常发布。
    if: ${{ always() && !cancelled() && (github.event_name != 'pull_request' || (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)) }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ci-report-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      # 结构审查始终跑；报告缺失（更早失败）不阻塞发布：ci-publish 会记成失败证据。
      - name: 下载结构审查报告
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: structure-report
          path: ci-artifacts/structure-report

      - name: 下载文档审查报告
        if: ${{ needs.docs.result != 'skipped' }}
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: docs-report
          path: ci-artifacts/docs-report

      - name: 下载 quality 报告产物
        if: ${{ needs.quality.result != 'skipped' }}
        uses: actions/download-artifact@v8
        with:
          pattern: test-report-*
          path: ci-artifacts
          merge-multiple: false

      - name: 下载 e2e 报告产物
        if: ${{ needs.e2e.result != 'skipped' }}
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-report-*
          path: ci-artifacts
          merge-multiple: false

      - name: 先把 ci-report 重建为空分支
        env:
          REPORT_BRANCH: ci-report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # artifacts 已完整下载后才清理并强推；下载失败不会留下空报告分支。
          # git rm 只删除已跟踪源码，保留未跟踪的 ci-artifacts；不要使用 git clean。
          git checkout --orphan ci-report-clean
          git rm -rf . >/dev/null 2>&1 || true
          git commit --allow-empty -m "重建 ci-report 报告树（run ${GITHUB_RUN_NUMBER}）"
          git push origin "HEAD:refs/heads/${REPORT_BRANCH}" --force

      - name: 恢复源码工作树
        run: git checkout --detach "${SOURCE_SHA}"

      # 三个 lane 各写自己的 key：runs/structure、runs/docs、runs/<os>。顺序执行，避免同时覆盖分支。
      - name: 发布结构审查（runs/structure）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_BRANCH: ci-report
          REPORT_OS: structure
        run: |
          set -euo pipefail
          rm -rf target
          mkdir -p target/test-logs
          if [ -d "ci-artifacts/structure-report" ]; then
            cp -R "ci-artifacts/structure-report/." target/
          fi
          node tests/ci-publish.mjs

      - name: 发布文档审查（runs/docs）
        if: ${{ needs.docs.result != 'skipped' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_BRANCH: ci-report
          REPORT_OS: docs
        run: |
          set -euo pipefail
          rm -rf target
          mkdir -p target/test-logs
          if [ -d "ci-artifacts/docs-report" ]; then
            cp -R "ci-artifacts/docs-report/." target/
          fi
          node tests/ci-publish.mjs

      - name: 逐平台合并并发布（runs/<os>）
        if: ${{ needs.quality.result != 'skipped' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # 每个平台把 quality 与 e2e 两份报告合并成该平台唯一的 test-report.json（tests/ci-merge.mjs），
          # 再由 ci-publish.mjs 写内容、失败证据与 Contents API。串行调用避免三平台同时覆盖 ci-report。
          for platform in windows-latest ubuntu-latest macos-latest; do
            rm -rf target
            mkdir -p target/test-logs

            if [ -d "ci-artifacts/test-report-${platform}" ]; then
              cp -R "ci-artifacts/test-report-${platform}/." target/
            fi
            if [ -d "ci-artifacts/e2e-report-${platform}" ]; then
              cp -R "ci-artifacts/e2e-report-${platform}/." target/
            fi

            case "${platform}" in
              windows-latest) runner_os="Windows" ;;
              ubuntu-latest) runner_os="Linux" ;;
              macos-latest) runner_os="macOS" ;;
              *) echo "未知平台：${platform}" >&2; exit 1 ;;
            esac

            echo "合并并发布 ${platform} 的报告"
            node tests/ci-merge.mjs
            RUNNER_OS="${runner_os}" node tests/ci-publish.mjs
          done
