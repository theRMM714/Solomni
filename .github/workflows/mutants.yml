# 突变测试（手动）：只在需要时抽查「测试能不能发现 bug」，不参与验收（见 docs/testing/execution-ci.md）。
# 只有手动 workflow_dispatch；Linux 单平台——范围是平台无关的纯逻辑，三平台只是 3 倍成本。
# cargo-mutants 用 taiki-e/install-action 装预编译二进制：CI 是一次性临时环境，不改本机。
name: 突变测试

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "范围：core（小而精，先跑这个）或 module（单模块抽查）"
        type: choice
        options:
          - core
          - module
        default: core
      module:
        description: "scope=module 时测哪个模块（可选值见 tests/mutation-scope.json 的 modules；scope=core 时忽略）"
        type: string
        default: repair

permissions:
  contents: read

jobs:
  mutation:
    name: 突变测试
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"

      - name: 准备 Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: 装 cargo-mutants（预编译，一次性环境）
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: 缓存依赖与编译产物
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 跑突变测试
        env:
          MUTATION_SCOPE: ${{ inputs.scope }}
          MUTATION_MODULE: ${{ inputs.module }}
        run: node tests/ci-mutation.mjs

      - name: 留产物（报告与 mutants.out；无论成败）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: |
            target/mutation-report.json
            target/logs/mutation-*.log
            mutants.out/
            mutants.out.old/
          if-no-files-found: ignore

  publish:
    name: 发布到 ci-mutation
    needs: mutation
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: ci-mutation-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # 关键：把 ci-mutation 重建为**空分支**再写报告。否则 Contents API 建分支时会以默认分支 HEAD 为底座，
      # 把整棵源码树背进报告分支（ci-report 的 publish job 也是这么做的）。
      - name: 把 ci-mutation 重建为空分支
        env:
          REPORT_BRANCH: ci-mutation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-mutation-clean
          git rm -rf . >/dev/null 2>&1 || true
          git commit --allow-empty -m "重建 ci-mutation 报告树（run ${GITHUB_RUN_NUMBER}）"
          git push origin "HEAD:refs/heads/${REPORT_BRANCH}" --force

      - name: 恢复源码工作树
        run: git checkout --detach "${GITHUB_SHA}"

      - name: 取回突变产物
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: mutation-report
          path: .

      - name: 写入 ci-mutation 分支（小文本；完整现场在产物里）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tests/ci-mutation-publish.mjs
