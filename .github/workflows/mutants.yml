# 突变测试（手动抽查 + 每周一定时）：只在需要时抽查「测试能不能发现 bug」，不参与验收（见 docs/testing/execution-ci.md）。
# 定时只在默认分支（main）的最新提交上跑；同一提交已有结论就跳过，省 runner 也省时间。
# 只有 Linux 单平台：范围是平台无关的纯逻辑，三平台只是 3 倍成本。
# cargo-mutants 用 taiki-e/install-action 装预编译二进制：CI 是一次性临时环境，不改本机。
name: 突变测试

on:
  schedule:
    # 每周一 04:00 UTC = 北京时间 12:00。
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      scope:
        description: "范围：weekly（定时审计集）/ core（小而精，先跑这个）/ capability（单能力抽查）"
        type: choice
        options:
          - weekly
          - core
          - capability
        default: core
      capability:
        description: "scope=capability 时测哪个能力（可选值见 tests/mutation-scope.json 的 capabilities；其它范围忽略）"
        type: string
        default: repair

permissions:
  contents: read

# 手动与定时共用一组：不取消正在跑的那次，后来的排队等待。
concurrency:
  group: ci-mutation-run
  cancel-in-progress: false

jobs:
  preflight:
    name: 同提交跳过判定
    # 只有定时需要判定；手动派发永远执行。
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: 读 ci-mutation 上一次 weekly 结论
        id: check
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          body="$(curl -fsSL --retry 2 "https://raw.githubusercontent.com/${REPO}/ci-mutation/weekly/meta.json?t=$(date +%s)" || true)"
          if [ -z "$body" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "[突变] 没有上一次 weekly 报告，照常执行"
            exit 0
          fi
          BODY="$body" SHA="$SHA" node -e '
            const fs = require("node:fs");
            let skip = false;
            try {
              const m = JSON.parse(process.env.BODY || "{}");
              skip = m.sha === process.env.SHA && (m.status === "all-caught" || m.status === "missed");
              console.log("[突变] 上一次 weekly：sha=" + String(m.sha || "").slice(0, 12) + " status=" + String(m.status || ""));
            } catch (e) {
              console.log("[突变] 上一次 weekly 报告读不懂，照常执行：" + String(e.message || e));
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "skip=" + skip + "\n");
            console.log("[突变] 同提交跳过=" + skip);
          '

  mutation:
    name: 突变测试
    needs: preflight
    if: ${{ always() && !cancelled() && needs.preflight.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # 单 job 上限 6 小时；weekly 14 个文件比 core 大，先给足，首次跑完再按实测决定是否拆 shard。
    timeout-minutes: 360
    # 借用 runner 自带 Rust，但缓存/安装落项目内（见 docs/testing/execution-ci.md）。
    env:
      CARGO_HOME: ${{ github.workspace }}/platform/ci/cargo
      SOLOMNI_CARGO_HOME: ${{ github.workspace }}/platform/ci/cargo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 只读 job：突变调查不写仓库，关闭令牌持久化（zizmor artipacked）。
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"

      - name: 准备 Rust（借用 runner 自带工具链，不写它的 home）
        run: |
          rustc --version
          cargo --version

      - name: 建项目内 CARGO_HOME（装工具与缓存都落这里）
        run: mkdir -p platform/ci/cargo

      # 装到项目内 CARGO_HOME/bin（job env 已把 CARGO_HOME 指过去），不写 runner 的 home。
      - name: 装 cargo-mutants（预编译，一次性环境）
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-mutants

      # 恢复所有 ref；保存只在 main（任务分支的缓存只对同分支可见，存了只会挤掉主线缓存项）。
      - name: 恢复依赖与编译产物缓存
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            platform/ci/cargo
            target/debug
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 跑突变测试
        env:
          # 定时默认 weekly；手动按输入。
          MUTATION_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'weekly' }}
          MUTATION_CAPABILITY: ${{ github.event_name == 'workflow_dispatch' && inputs.capability || 'repair' }}
        run: node tests/ci-mutation.mjs

      # 保存只在 main：手动派发在 main 上跑一次才写缓存；save 失败不挡突变测试结论。
      - name: 保存依赖与编译产物缓存（仅 main）
        if: ${{ github.ref == 'refs/heads/main' }}
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            platform/ci/cargo
            target/debug
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: 留产物（报告与 mutants.out；无论成败）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: |
            target/mutation-report.json
            target/logs/mutation-*.log
            mutants.out/
            mutants.out.old/
          if-no-files-found: ignore

  publish:
    name: 发布到 ci-mutation
    needs: [preflight, mutation]
    # 只有突变步骤实际跑过才发布：同提交跳过时保留上一次 weekly 报告。
    if: ${{ always() && !cancelled() && needs.mutation.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: ci-mutation-publish
      cancel-in-progress: false
    steps:
      # actions/checkout v7.0.1：本 job 用 git push 重建 ci-mutation 滚动分支，需要 checkout 凭据；其余 checkout 均已关闭持久化。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # zizmor: ignore[artipacked] 本 job 需要凭据重建滚动分支

      # 关键：把 ci-mutation 重建为**空分支**再写报告。否则 Contents API 建分支时会以默认分支 HEAD 为底座，
      # 把整棵源码树背进报告分支（ci-report 的 publish job 也是这么做的）。
      - name: 把 ci-mutation 重建为空分支
        env:
          REPORT_BRANCH: ci-mutation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-mutation-clean
          git rm -rf . >/dev/null 2>&1 || true
          git commit --allow-empty -m "重建 ci-mutation 报告树（run ${GITHUB_RUN_NUMBER}）"
          git push origin "HEAD:refs/heads/${REPORT_BRANCH}" --force

      - name: 恢复源码工作树
        run: git checkout --detach "${GITHUB_SHA}"

      - name: 取回突变产物
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: mutation-report
          path: .

      - name: 写入 ci-mutation 分支（小文本；完整现场在产物里）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tests/ci-mutation-publish.mjs
