# 已确认但尚未实施的系统工具规划清单（**不限角色**：核心代理、执行席等都在内）。
# 领域门户：SYSTOOL.md；当前工具契约：docs/tools/tools-and-roles.md。
#
# 本文件只描述已确认但尚未实施的 systool 契约与验收条件：**条目存在 = 尚未实施**，
# 不代表这些工具当前已经可用，也不替代 tests/gaps.yaml（产品级缺口账）。
# 实施任一条目时，必须同步系统工具总表、角色表、提示词、对应能力实现、测试与相关专项文档；
# 完成并验收后删除对应条目，不保留完成历史。
# 本文件未接入 run-tests.js 的报告或自动销账。
# 所有机制均通过业务 API 编排并使用路径组件拼接，Windows、macOS、Linux 必须成立；
# 不引入机器路径、旧实现兼容层或独立于现有会话内核的第二套执行机制。（hygiene-ignore）
#
# 核心代理的工具面（见 systools/tools.yaml 与 systools/roles.yaml 的 core_proxy）与真实会话宿主已落地，
# 端到端旅程也已进 L4（tests/cross-platform/e2e/driver.js 的代理场景），所以这里没有它们的条目。

- id: systool.core-proxy.timer
  scope: global
  level: T5
  why: |
    代理派完活就让出回合，靠「子会话停下 / 到门」叫醒推进（机制段见 prompts/shared/mechanisms.yaml）。
    子会话长时间在跑时，代理收不到任何事件，也**没有「过一会儿再叫我」这件事**——它只能一直
    observe_session 轮询，既费 token 又占满回合。要解决的是这个：让代理自己安排一个到点唤醒的时间点。
  how: |
    新增一个代理工具（暂名 timer / wake_after），语义是**非阻塞定时唤醒**：
    记下「这个会话在 N 秒后醒来」后当次调用立刻返回；到点由机制起一个新的代理回合，
    并像「子会话停下」那样先写一条可回放通知（例如「[定时器] 你设的 2 分钟到了」）——正文仍靠倒查。
    实施前必须定死并写进文档的几件事：
    1) 走**现有叫醒路径**（notify → spawn_detached_proxy 这一类），不另起一套执行机制；
    2) 到点是否派发一律过现有运行态闸门（stopped / closed 拒绝并如实记录），stop 能取消；
    3) rewind 要把定时器清掉（与观察账本同一口径）；
    4) 同一会话是替换还是多个、最小 / 最大时长、到点时会话正在生成怎么处理；
    5) 定时器是短暂还是持久——若持久，进程重启后要重新排程；
    6) 落地时同步 systools/tools.yaml、systools/roles.yaml（core_proxy 的面）、
       docs/tools/tools-and-roles.md 的角色 / 工具表，并按端口矩阵补替身与契约测试。
  accept: |
    代理设定定时器后当次回合立即结束（不阻塞）；到点确实起了新回合并带一条可回放通知；
    stopped / closed 期间到点被拒；stop 会取消、rewind 会清掉；
    重启后行为与上面一致（持久）或如实丢失（短暂，且文档写明）；
    六个既有代理工具的行为不变。
  blocked_by: |
    有意推迟（不是缺条件）：先把「让出回合 + 停下叫醒」的机制提示词做对，
    再评估定时器还需要不需要——机制提示词不做，定时器只会变成轮询的新马甲。

- id: systool.shell
  scope: global
  level: T5
  why: |
    执行席现在只能用内置文件工具和模块工具；零模块 agent 无法构建 / 测试 / 跑脚本，
    模块作者也要为每个构建命令写一个工具。需要一个通用 shell，但必须复用现有
    ProcessRunner / 围栏 / guest，不新建第二套执行机制；且默认只能碰私有沙箱，
    越过沙箱必须走 ask / allow_turn。
  how: |
    1) systools/tools.yaml 加 shell：一次性命令；参数 command、scope（sandbox / external，默认 sandbox）、
       timeout_secs；cwd 固定私有沙箱；无 stdin / TTY；head + tail 截断；退出码回执。
    2) 不做 shell 专属权限模式：shell 读会话四档（仅可查看 / 工作区内修改 / 外部可达（逐次确认）/
       全可达（自动放行））授予的 reach；scope 是模型对每次调用的请求，不是用户每次选。
       档位是上限；requested ⊄ granted 直接拒绝；effective = granted ∩ 工具最大 reach ∩ requested。
    3) sandbox scope：reach = private + 系统 / 工具链只读；不碰共享 / 模块 / 主机 / 网络；
       在“工作区内修改”及以上自动执行，不问；在“仅可查看”档 shell 关闭。
       external scope：加 shared-read / module-read / host-read / network；在“外部可达（逐次确认）”下 ask，
       在“全可达（自动放行）”下不问；共享区永远只读，模块 userdata 不可写，不注入模块 secrets。
    4) sandbox scope 要求围栏真强制（allow_degraded=false），装不上就拒绝；rw 只含 private；net 强制 false。
       模型选错 scope 时，sandbox 请求被围栏拒绝，回执提示“需要 external 请重试（会先问）”；不自动升级。
    5) Windows 用 PowerShell：pwsh 7 优先、powershell 5.1 回退；
       -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass；命令走 stdin（-Command -）或 -EncodedCommand；
       输出 UTF-8；模块工具仍 cmd /C 不动。
    6) Linux / macOS 用 sh；VM Linux guest 用 /bin/sh，guest helper 支持 timeout_secs；
       guest 内立即取消本期不做，停止只到 timeout。Windows / macOS guest 本期不做，见 vm.windows-macos-guest。
    7) 角色：v1 显式 executor / solo；discussant 需先补 work_pull；core_proxy 需先有 proxy 私有沙箱。
       不做 all；需要全部角色就手动列全。
    8) 取消：host 取消旗杀整棵树；输出超限 head + tail；命令长度上限建议 8000 字符，
       更长命令让模型先 write 成沙箱脚本再执行。
  accept: |
    “仅可查看”档 shell 关闭；“工作区内修改”档 sandbox scope 只写私有沙箱、读不到共享/模块/主机只读根、
    网络不通、不弹确认；围栏降级时拒绝；
    “外部可达（逐次确认）”档 external scope 每命令 ask，sandbox scope 不问；
    “全可达（自动放行）”档 external scope 不问，但仍受全局 network / host_read_roots 上限，共享区仍只读；
    Windows PowerShell 7/5.1 真机跑通，中文与退出码正确；Linux/macOS sh 与 VM Linux guest 跑通；
    host 停止杀掉整棵树；既有模块工具/内置工具行为不变；node run-tests.js 全绿。
  blocked_by: |
    依赖 permission.reach-and-decision 与档位切换落地；Windows/macOS guest shell 暂不开发；
    guest 立即取消未实现。
