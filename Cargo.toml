# Solomni 核心编排者：产品里唯一的程序。
# 依赖刻意保持最小：serde 解析三种文本锚点，rand 供假模型测试。
[package]
name = "solomni"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
# Windows：TLS 走系统 schannel（native-tls），避开 ring 的 C 编译器依赖（GNU 工具链无 gcc 时构建失败）。
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
# Windows 围栏：Job Object（进程树围栏与资源上限）+ 容器/令牌（文件系统与网络围栏）。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[target.'cfg(not(windows))'.dependencies]
# 非 Windows：维持 rustls（内置工具链带 gcc，ring 可编译）。ureq 3 把这个功能名从 tls 改成了 rustls。
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
# Unix 围栏：进程组与信号（杀整棵树）、prctl（父死子亡）、Landlock/seatbelt 的系统调用。
libc = "0.2"

[[bin]]
name = "solomni"
path = "src/main.rs"

# 测试目标按平台分：tests/<平台>/ 放只有该平台能跑的探针（见 TESTING.md）。
# 平台目标的 main.rs 首行 #![cfg(target_os = "…")]：在别的平台上整目标为空，既不报错也不假装跑过。
[[test]]
name = "cross-platform"
path = "tests/cross-platform/main.rs"

[[test]]
name = "windows"
path = "tests/windows/main.rs"

[[test]]
name = "linux"
path = "tests/linux/main.rs"

[[test]]
name = "macos"
path = "tests/macos/main.rs"