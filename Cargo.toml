# Solomni 核心编排者：产品里唯一的程序。
# 依赖刻意保持最小：serde 解析三种文本锚点，yaml_serde 读写 yaml（serde_yaml 的官方续作，上游已归档）。
# 例外：LLM 出站流需要可取消的 HTTP 读与分层超时，故引入 tokio/reqwest；async 只存在于出站适配器。
[package]
name = "solomni"
version = "0.1.0"
edition = "2021"
# 最低工具链：跟随最新稳定版（CI 用 stable；本地用 platform/<os> 里的工具链）。
rust-version = "1.98"
# 许可证以根 LICENSE 为准（Apache-2.0）。供应链门禁 cargo-deny 会检查本包自身的许可声明。
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
yaml_serde = "0.10"
# 跨平台解包（provision 能力用它解归档；纯 Rust，不依赖用户装了什么解压工具）：tar 容器 + zstd / gzip 解码。
tar = "0.4"
ruzstd = "0.9"
flate2 = "1"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }
lzma-rs = "0.3.0"
# LLM 出站流：可取消的 HTTP 读 + 分层超时。只用 current-thread runtime，不把核心改成 async。
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "time", "macros"] }

[target.'cfg(windows)'.dependencies]
# Windows：TLS 走系统 schannel（native-tls），避开 ring 的 C 编译器依赖（GNU 工具链无 gcc 时构建失败）。
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
# LLM 流式出站：Windows 用 native-tls（系统证书库）；ureq 仍用于探针。
reqwest = { version = "0.13", default-features = false, features = ["stream", "native-tls", "gzip", "system-proxy"] }
# Windows 围栏：Job Object（进程树围栏与资源上限）+ 容器/令牌（文件系统与网络围栏）。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[target.'cfg(not(windows))'.dependencies]
# 非 Windows：维持 rustls（内置工具链带 gcc，ring 可编译）。ureq 3 把这个功能名从 tls 改成了 rustls。
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
# LLM 流式出站：非 Windows 用 rustls（与 ureq 的 TLS 后端一致）。
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider", "gzip", "system-proxy"] }
# 非 Windows 的 rustls 明确用 ring 提供者（不引入 aws-lc 的 CMake 构建），证书走系统验证器。
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-platform-verifier = "0.7"
# Unix 围栏：进程组与信号（杀整棵树）、Landlock/seatbelt 的系统调用；父死子亡 Linux 用 prctl、macOS 用 kqueue（本程序另起的守门进程盯核心）。
libc = "0.2"

[[bin]]
name = "solomni"
path = "src/main.rs"

# 测试目标按平台分：tests/<平台>/ 放只有该平台能跑的探针（见 TESTING.md）。
# 平台目标的 main.rs 首行 #![cfg(target_os = "…")]：在别的平台上整目标为空，既不报错也不假装跑过。
[[test]]
name = "cross-platform"
path = "tests/cross-platform/main.rs"

[[test]]
name = "windows"
path = "tests/windows/main.rs"

[[test]]
name = "linux"
path = "tests/linux/main.rs"

[[test]]
name = "macos"
path = "tests/macos/main.rs"
