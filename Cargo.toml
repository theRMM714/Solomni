# Solomni 核心编排者：产品里唯一的程序。
# 依赖刻意保持最小：serde 解析三种文本锚点，rand 供假模型测试。
[package]
name = "solomni"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
[target.'cfg(windows)'.dependencies]
# Windows：TLS 走系统 schannel（native-tls），避开 ring 的 C 编译器依赖（GNU 工具链无 gcc 时构建失败）。
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }

[target.'cfg(not(windows))'.dependencies]
# 非 Windows：维持 rustls（内置工具链带 gcc，ring 可编译）。
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
tiny_http = "0.12"

[[bin]]
name = "solomni"
path = "src/main.rs"