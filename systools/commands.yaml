# 目的：命令面——产品对外暴露的每一条命令的**唯一声明**（转录相 core 与启动相 boot 共用一张表）。
# 管：命令名、别名、分组、写法（usage）、一句话说明、确认门槛、命令自己的旗语。
# 不管：命令怎么执行（entry/args.rs 与 presentation/cli.rs 各自分派）、手册怎么排版（presentation/cli/catalog.rs）。
# 约束：名字与别名全局唯一；phase=boot 的命令用长旗语形式调用（--name），phase=core 的命令在转录中心里输入；
#   清单顺序即手册顺序（分组按首次出现排序）。
# 联动：解析与校验在 src/capabilities/tools/domain/commands.rs；覆盖门禁在 src/tests/commands.rs。

commands:
  # —— 转录相：在转录中心里输入 ——
  - name: single
    group: 会话
    phase: core
    usage: "<agent名…>"
    brief: 发起单 agent 会话，进入转录提示符

  - name: collab
    group: 会话
    phase: core
    usage: "<agent名…|?>"
    brief: 多 agent 协作，由同一个主持人收口

  - name: proxy
    group: 会话
    phase: core
    brief: 决定权整块交给核心（不看单席约束）

  - name: rewind
    group: 转录
    phase: core
    usage: "<会话> archive|delete <行id> | restore <标记id>"
    brief: 回档：留档、删除或恢复到某条标记

  - name: work
    group: 转录
    phase: core
    usage: "<会话> log|show|restore <提交号> [--yes]"
    brief: 共享区提交历史：看 head、看详情、非破坏性回滚

  - name: diagnose
    group: 转录
    phase: core
    usage: "<会话>"
    brief: 只读诊断一条虚拟机档会话（进程 / CPU / 内存 / 挂载）

  - name: provider
    group: 注册处
    phase: core
    usage: "list|add|rm|discover"
    brief: 供应商登记与连通性测试

  - name: model
    group: 注册处
    phase: core
    usage: "list|add|rm"
    brief: 模型登记与默认模型切换

  - name: core
    group: 注册处
    phase: core
    usage: "<模型id>"
    brief: 设置核心默认模型

  - name: module
    group: 模块
    phase: core
    usage: "<模块id.工具名> [json]"
    brief: 不经 AI 直接调用模块工具（动作 id 来自动作目录）

  - name: resident
    group: 后台
    phase: core
    usage: "list|start|stop|enable|disable|call <模块id> <服务名> [操作名] [json]"
    brief: 常驻服务：列清单、启停、调用操作

  - name: secret
    group: 后台
    phase: core
    brief: 列密钥声明（值不回显）

  - name: rescan
    group: 后台
    phase: core
    brief: 重扫模块与能力注册表

  - name: web
    group: 界面
    phase: core
    usage: "[端口]"
    brief: 转入 Web 转录中心（Ctrl+C 回到这里）

  - name: help
    group: 系统
    phase: core
    usage: "[命令|--all]"
    aliases: [/help, "?"]
    brief: 命令手册与旗语规范

  - name: version
    group: 系统
    phase: core
    brief: 版本与构建档位

  - name: exit
    group: 系统
    phase: core
    brief: 退出转录中心，回到系统 shell

  # —— 启动相：装配核心之前直接执行，跑完退出 ——
  - name: doctor
    group: 维护
    phase: boot
    brief: 自检：这台机器能承载哪些能力与测试（JSON）

  - name: provision
    group: 维护
    phase: boot
    brief: 依赖补齐状态与执行（不带写旗语只报状态）
    confirm: true
    flags:
      - name: "--reset"
        value: "<guest>"
        desc: 重置一个虚拟机档（写操作，需 --yes）
      - name: "--ensure"
        value: "[spec]"
        desc: 按需补齐工具链（写操作，需 --yes）

  - name: work-gc
    group: 维护
    phase: boot
    usage: "<工作名>"
    brief: 显式回收一个不再可达的内容对象（默认 dry-run）
    confirm: true
    flags:
      - name: "--yes"
        desc: 真的删（缺省只预览并给退出码 2）

  - name: storage
    group: 维护
    phase: boot
    brief: 存储空间报告（JSON）

  - name: gc
    group: 维护
    phase: boot
    usage: "[类别]"
    brief: 回收内容对象与构建缓存（默认 dry-run）
    confirm: true
    flags:
      - name: "--yes"
        desc: 真的删（缺省只预览并给退出码 2）
      - name: "--category"
        value: "<类别>"
        desc: 只回收这一类
      - name: "--guest"
        value: "<guest>"
        desc: 限定一个虚拟机档
      - name: "--module"
        value: "<模块>"
        desc: 限定一个模块的产物

  - name: build
    group: 维护
    phase: boot
    usage: "<模块id>"
    brief: 在目标环境里构建一个模块声明的产物
    flags:
      - name: "--guest"
        value: "<guest>"
        desc: 指定目标虚拟机档
