# 会话类型表：一个会话类型就是一串要跑的流程；每个流程要哪些身份、要几个人，由流程自己报
# （src/capabilities/conversation/session/domain/flow.rs 的 FLOWS）。
# id = 命令与落盘用（只写 ASCII，CLI 里好敲）；name = 界面渲染用（侧栏、向导直接显示它）。
# 装配期会校验：id 唯一且无空白、流程已注册且不重复、流程要的角色在册且席位放对、没有流程的类型要有静止身份。
# flows 为空 = 没有流程，直接轮循环（单机与代理就是这样），这时 roles 是它的静止身份。
# auto: true = 整块交给核心代理（没有名单、没有本次需求，核心在会话里自己决定做什么）；这类类型不能再有 flows。
profiles:
  - id: single
    name: 单机
    hint: 一个 agent 直接干活：选 1 个模块 = 直连式，选多个 = 组合式。
    roles: [solo]
    flows: []

  - id: collab
    name: 会议
    hint: 多个 agent 各自独立沙箱：先讨论收敛，核心写总结，再按任务链执行、统一验收。
    flows: [discuss, execute]

  - id: proxy
    name: 代理
    hint: 决定权整块交给核心：它自己挑人、建子工作并代你回答关卡。
    roles: [core_proxy]
    auto: true
    flows: []
