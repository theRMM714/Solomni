# 会话类型表：一个会话类型就是一串机制与它们用到的身份角色。
# 装配期会校验：与形态（single / collab / proxy）一一对应、机制已注册、产物按顺序接得上、角色在角色表里。
# agents: one = 只许一个 agent；many = 至少两个、必须有机制调度。
# mechanisms 为空 = 没有机制，直接轮循环；takes 接会话开场（text）或更早机制的 gives。
profiles:
  - id: single
    agents: one
    roles: [solo]
    mechanisms: []

  - id: collab
    agents: many
    roles: [discussant, executor, planner, orchestrator]
    mechanisms:
      - id: collab
        roles: [discussant, executor, planner, orchestrator]
        takes: text
        gives: TaskChain

  - id: proxy
    agents: one
    roles: [core_proxy]
    mechanisms: []
