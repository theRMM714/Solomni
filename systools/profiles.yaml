# 会话类型表：一个会话类型就是一串流程与它们用到的身份角色。
# 装配期会校验：与形态（single / collab / proxy）一一对应、流程已注册、每个流程有人出演、角色在册且席位放对。
# flows 为空 = 没有流程，直接轮循环（single 与 proxy 就是这样）。
# 每个流程：core = 核心通道出演的身份（不进成员表）；members = 成员席各要几员（角色: 最少人数）。
profiles:
  - id: single
    roles: [solo]
    flows: []

  - id: collab
    roles: [core_proxy, discussant, executor, planner, orchestrator]
    flows:
      # 讨论段：开会把需求谈清楚，由核心代理写一份总结（执行段的需求）。
      - id: discuss
        core: [core_proxy]
        members:
          discussant: 2
      # 执行段：核心拟计划与任务链，执行席逐个节点干，核心逐阶段验收后交付。
      - id: execute
        core: [planner, orchestrator]
        members:
          executor: 1

  - id: proxy
    roles: [core_proxy]
    flows: []
