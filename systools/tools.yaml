# 系统工具总表：工具**是什么**（唯一真相：说明、参数契约、能否并发）。
# 改工具的参数或说明只改这里；模型侧说明与调用校验都由这一份声明驱动。
# 与模块工具的区别：模块工具在各自 module.yaml（外部命令），系统工具的实现是核心能力。

tools:
  read:
    capability: fs-read        # 权限收口依据：碰文件系统的系统工具照样受沙箱/围栏约束
    desc: 读取文本文件（UTF-8）。
    parallel: true                    # 只读、无副作用：同一回复里的多个读取**真的并发跑**
    params:
      path:
        type: string
        required: true
        desc: 要读取的真实绝对路径
      offset:
        type: integer
        min: 1
        default: 1
        desc: 起始行号（从 1 数起）；省略即从第 1 行开始。超过总行数时核心会告诉你总行数
      limit:
        type: integer
        min: 1
        max: 2000
        default: 2000
        desc: 本次最多返回的行数；省略即尽量多读
  write:
    capability: fs-write        # 权限收口依据：碰文件系统的系统工具照样受沙箱/围栏约束
    desc: 整份写入文本文件（UTF-8）：文件不存在则新建；已存在则整份覆盖，但**要求你在本次会话里先完整读过它**（只改一处请用 edit）。
    params:
      path:
        type: string
        required: true
        desc: 要写入的真实绝对路径
      content:
        type: string
        required: true
        desc: 要写入的**完整**内容（会整份覆盖，不是追加、不是局部修改）
  edit:
    capability: fs-write        # 权限收口依据：碰文件系统的系统工具照样受沙箱/围栏约束
    desc: 对已存在的文本文件做一处精确替换（按字面匹配，不动别处）。
    params:
      path:
        type: string
        required: true
        desc: 要修改的真实绝对路径
      old_string:
        type: string
        required: true
        non_empty: true
        desc: 要被替换掉的原文（按字面匹配，含缩进与换行；默认必须唯一命中）
      new_string:
        type: string
        required: true
        desc: 替换成的新文本（空串 = 把这一段删掉）
      replace_all:
        type: boolean
        desc: 是否替换全部命中；省略 = 要求唯一命中（多处命中会报错并列出位置）
  patch:
    capability: fs-write        # 权限收口依据：碰文件系统的系统工具照样受沙箱/围栏约束
    desc: 用一段**自由格式**的补丁文本改文件（信封之后原样跟补丁；大段内容不要塞进 JSON）。语法见 patch_guide。
  list:
    capability: fs-read        # 权限收口依据：碰文件系统的系统工具照样受沙箱/围栏约束
    desc: 列一个目录（名字 / 是否目录 / 字节数，按名字排序）。**确认资料齐不齐、脚本在不在就用它**；read 只读文件，遇到目录会引导你用 list。
    parallel: true                    # 只读、无副作用
    params:
      path:
        type: string
        required: true
        desc: 要列的目录的真实绝对路径
  search:
    capability: fs-read        # 权限收口依据：碰文件系统的系统工具照样受沙箱/围栏约束
    desc: 在文本文件里查关键词，返回带行号的命中行。
    parallel: true                    # 只读、无副作用
    params:
      path:
        type: string
        required: true
        desc: 要搜索的真实绝对路径
      keyword:
        type: string
        required: true
        non_empty: true
        desc: 要查找的文本
      ignore_case:
        type: boolean
        desc: 是否忽略大小写；省略即区分大小写

  # —— 工具调用约定：两套**互斥**（一个通道只用一套，不能同时教，否则模型在正文里讲解参数会被当成调用）——

  compact:
    capability: none              # 不碰文件：改的是"发给模型什么"，不是"留下什么"
    desc: 压缩上下文：把此前的内容写成一份 summary（此后不再发给模型，但用户仍可查看）。**只在压缩回合由系统发起时使用**。
    params:
      summary:
        type: string
        required: true
        non_empty: true
        desc: 要留下的摘要：结论、决定、待办、关键路径——丢掉细节，留下"以后还要用的"。

  # —— 协作动词：讨论阶段的表态（声明式工具，不再是"从正文里解析手写信封"）——
  say:
    capability: none
    desc: 发表意见（讨论阶段的正常发言）。
    params:
      text:
        type: string
        required: true
        desc: 要说的话
  agree:
    capability: none
    desc: 同意当前方案。发过 agree 之后不再被追问，直到在场者全部同意。
    params:
      text:
        type: string
        required: true
        desc: 附一句同意理由（可短）
  leave:
    capability: none
    desc: 退出讨论（离开的人不计入"在场者全部同意"）。
    params:
      text:
        type: string
        required: true
        desc: 为什么不再参与
  ask:
    capability: none
    desc: 需要用户决定（讨论暂停，等用户回答后继续）。
    params:
      text:
        type: string
        required: true
        desc: 要问用户什么

