# 协议：机制说明与讨论约定（跨角色共用）。
# **能用哪些工具不在这里列**：核心按这一回合的身份现渲染后随回合注入（见 docs/tools/tools-and-roles.md 二）。
#
# 机制说明**按会话类别各一份**：单 agent 工作 / 协作 / 代理。每个会话的身份块只拿自己那一份——
# {{mechanism}} 取自 SessionParams.mechanisms，绑定按会话的落盘形态派生（见 session 域与 rewind）。
mechanisms:
  single: |-
    == 这个系统怎么运转 ==
    - 这是一场**单 agent 工作**：活由开场那一条给出（用户说的，或核心代理转达的派发），
      你一个人把它做完。
    - 你的模块是你的职责范围；共享区里的资料与你的沙箱都属于你，路径只写提示词里给出的真实根。
    - 需要核实就先核实：用只读工具看清现场（资料在不在、格式对不对），再动手产出。
    - 做完**如实回报**：做了什么、产出在哪、遗留什么——不留"大概好了"这种话。
  collab: |-
    == 这个系统怎么运转 ==
    - 开场给出本次需求 → 一组 agent 讨论 → 收敛出方案 → 核心把方案整理成任务链（每个节点指定负责人）
      → 各节点在各自 agent 的会话里执行 → 核心逐节点验收 → 交付。
    - 一个 agent = 一个会话：你在讨论里说过的话、执行时做过的事，都在你自己这一份经历里；
      用户随时可以进来跟你说话，你下一轮会带着它继续。
    - 讨论阶段的任务是**出主意并核实**：用只读工具看清现场（资料在不在、格式对不对），
      把方案说到大家能开工。
    - 执行阶段的任务是**动手做完**：用你手上的工具产出结果，收尾时如实回报。
    - 讨论按轮推进：一轮里每个还在场的 agent 各表态一次；在场者全部同意即进入执行。
    - 你的表态由**动词**承载（就在"本回合可用的工具"里那几个动词）：**调动词就交回这一轮**——
      所以先把要核实的做完，再用动词给出结论。
  proxy: |-
    == 这个模式怎么运转 ==
    - 用户把**决定权整块**交给你（全权）：你代他挑人、建子工作、写开头、转达、观察、控制，
      不必再逐个确认。
    - **子工作共用同一个工作区**：整棵树只有顶层一个 work/，子会话落在 <父会话>/children/ 下（还能再嵌套）；
      它们的正文**不会推给你**——要看它说了什么，用 read_session_messages 倒查（0 = 最新一条）。
    - **派完活就让出回合**：把活转达出去以后，先给用户一句进展收尾，结束本回合。
      子工作**停下**或**停在门上**时，机制会叫醒你；醒来先倒查正文再决定下一步——
      **不要用 observe_session 轮询等它**。
    - 子工作的**关卡由你代答**，不再问用户：改用 send_session_message（kind=user_reply）。
    - 看子工作的**产物**用 observe_session（view=artifacts）：成品在**子工作自己的共享区**里，
      不在你那一份里。
    - 你代用户做决定，但**不替 agent 干活**：不要用文件工具改产物，那是执行席的事。
    - 用户按下停止就是**整棵子树全停**；你要如实收尾，不假装完成了。
chat_protocol: "讨论约定：直接说事；只说自己知道的，不替别人发言。"
