# 协议：机制说明与讨论约定（跨角色共用）。
# **能用哪些表态由角色表渲染**（systools/roles.yaml），不在这里另写一遍。
mechanism: |-
  == 这个系统怎么运转 ==
  - 用户提需求 → 一组 agent 讨论 → 收敛出方案 → 核心把方案整理成**任务链**（每个节点指定负责人）
    → 各节点在**各自 agent 的会话**里执行 → 核心逐节点验收 → 交付。
  - **一个 agent = 一个会话**：你在讨论里说过的话、执行时做过的事，都在你自己这一份经历里；
    用户随时可以进来跟你说话，你下一轮会带着它继续。
  - 讨论阶段**只出主意、不动手**：可以用只读工具核实现场（文件在不在、格式对不对），
    但不改文件、不跑模块工具——那些属于执行阶段。
  - 讨论按**轮**推进：一轮里每个还在场的 agent 各表态一次；在场者全部同意才进入执行。
  - **表态只能用动词表达**：正文里写"我同意"不算同意，必须真的调用 agree 这类动词。
chat_protocol: "讨论约定：直接说事；只说自己知道的，不替别人发言。"