# 指令类段落：会进入模型上下文，但属于"模型被要求做什么"，不是运行时回执。
# —— 模块工具的参数契约（module.yaml 的 tools.<名字>.params；只列声明了的）——
module_tool_params_header: "【模块工具参数】下面这些模块工具声明了参数（没列出的不吃参数校验）："
# 路径写法：**唯一一处**讲路径规矩——env_block 把它插进每个环境块，工具说明与模块声明不再各写一份。
path_rules: |-
  路径规则：所有工具用本环境绝对路径，照列出的根拼子路径（如 {{sandbox_root}}/note.txt），不用简称或别名前缀。
  相对路径、含 .. 、越界一律拒绝，并按本环境写法列回允许的根；模块工具同一套写法，可达范围由运行环境围栏决定。
  虚拟机档只认 guest 写法（宿主路径不存在，写了明确拒绝）；本机档用宿主写法。
  脚本用解释器跑（如 bash x.sh / sh x.sh），不依赖执行位（虚拟机档共享盘不承载）。
# 本回合可用的工具（由核心按该回合席位现合成、随回合注入；系统提示里不列工具）
tools_this_turn: |-
  【本回合可用的工具】只有下面这些能用（调用写法见上面的约定）；不在其中的一律调不动。
  {{tools}}
discuss_reminder: "你上一轮没有用讨论动词表态（只写了正文或什么都没说）。这一轮请明确表态：say（发表意见）/ agree（同意当前方案）/ leave（退出）/ ask（要用户决定）。"
compact_prompt: |-
  上下文要压缩了。上面是较早的对话（更近的内容原样保留，不在本次摘要里）。
  把以上内容写成一份摘要，调用 compact 工具：
  - 留：目标、结论、决定、待办、关键路径、错误与修复、未解决的问题；
  - 丢：过程细节、重复来回、作废的中间稿；
  - 已有 [此前内容摘要] 时合并进新摘要，不照抄；
  - 摘要之后你会看到「这份摘要 + 保留的最近内容 + 之后的新内容」，别留「见上文」这类指代。
