# 指令类段落：会进入模型上下文，但属于“模型被要求做什么”，不是运行时回执。
# —— 模块工具的参数契约（module.yaml 的 tools.<名字>.params；只列声明了的）——
module_tool_params_header: "【模块工具参数】下面这些模块工具声明了参数（没列出的不吃参数校验）："
# 路径写法：**唯一一处**讲路径规矩——env_block 把它插进每个环境块，工具说明与模块声明不再各写一份。
path_rules: |-
  【路径写法】所有工具都用**本环境里的绝对路径**：照上面列出的根原样拼子路径（例如 {{sandbox_root}}/note.txt；不要用简称或别名前缀）。
  系统工具只认这些根：相对路径、含 .. 的路径、越界的路径一律拒绝，并把允许的根按本环境的写法列回来；模块工具用同一套写法，可达范围由运行环境的围栏决定。
  虚拟机档**只认 guest 写法**：宿主路径在这里不存在，写了会被明确拒绝；本机档就是宿主写法。
# 本回合可用的工具（由核心按该回合身份从角色表现渲染，随回合注入；系统提示里不列工具）
tools_this_turn: |-
  【本回合可用的工具】只有下面这些能用（怎么写调用见上面的约定）；不在其中的一律调不动。
  {{tools}}
discuss_reminder: "你上一轮**没有用讨论动词表态**（只写了正文或什么都没说）。这一轮请明确表态：say（发表意见）/ agree（同意当前方案）/ leave（退出）/ ask（要用户决定）。"
compact_prompt: |-
  上下文要压一压了。请把**以上全部内容**写成一份摘要，调用 compact 工具：
  - 留下：结论、决定、待办、关键路径、还没解决的问题；
  - 丢掉：过程细节、重复的来回、已经作废的中间稿；
  - 摘要之后你会只看到"这份摘要 + 之后的新内容"，所以别留下"见上文"这类指代。
