# 工作环境、两套调用约定与补丁语法。
# **这里不列工具**：能用哪些工具由核心按这一回合的身份（角色表）现渲染、随回合注入，
# 总表只留在核心手里当校验判据（见 docs/architecture/tools-and-roles.md 二、三之二）。
env: |-
  【工作环境】
  路径一律写**真实绝对路径**：下面列出的就是本工作允许的根目录。
  本次工作的共享区：{{work_root}}
  你私有的沙箱：{{sandbox_root}}
  {{module_roots}}
  路径必须落在上面列出的根目录之内：越界、相对路径、含 .. 的路径都会被拒绝（回执会把允许的根列回来）。
  路径写法：用上面列出的根直接拼，例如 {{work_root}}/note.txt（不要用简称或别名前缀）。
  本工作的成品一律写共享区或你自己的沙箱。模块目录里的 userdata/ 是模块自己的跨任务私有状态（缓存/记忆/配置），
  不是本次工作的成品区，不要把任务成果往里写。
  当前工作：{{work_name}}；agent 名：{{agent}}

# —— patch 通道的写法：让"改文件"不必把大段文本塞进 JSON（换行/引号/CJK 都不用转义）——
patch_guide: |-
  【改文件：用 patch，别把大段文本塞进 JSON】
  信封写成 {"type":"tool","name":"patch"}，**信封之后原样跟补丁文本**（不用转义、不用引号，直接写中文与换行）：
  *** Update File: {{work_root}}/note.txt
  *** SEARCH
  （从文件里原样抄来的连续几行）
  *** REPLACE
  （换成的新内容；留空 = 删掉这几行）
  *** Add File: {{sandbox_root}}/out.md
  （新文件的整份内容，原样写）
  *** End File
  规矩：
  - **每一块都必须用 *** End File 收尾**；它后面再写什么都会被忽略（可以放心写"我改完了"）。
  - 一次可以写多块：多块按顺序应用；同一个文件也可以写多块（后一块看到前一块的结果）。
  - SEARCH 必须与文件里的原文**整行一致**（含缩进）；默认要求唯一命中（多处命中会报错并列出行号）。
  - 任意一块不成立，核心**一个文件都不写**，只把第几块、为什么如实报回给你——改对了再发一次。
  - 路径写**真实绝对路径**（与 read / write 同一套；越界会被拒绝并列出允许的根）。
  - *** 是保留前缀：内容里若必须出现以 *** 开头的行，请改写它（否则会被当成标记）。
  - 新建文件用 *** Add File:；改已有文件用 *** Update File:（整份覆盖已存在的文件仍要求"先完整读过"）。
  - 内容**照你写的原样落盘**：想让文件末尾多一个空行，就在 *** End File 之前留一个空行（核心不替你加）。

# —— 内置工具的参数契约：模型侧的参数说明与调用校验都由这一份声明驱动（改参数只改这里）——
tool_calling_envelope: |-
  工具调用约定：需要用工具时，只输出一个 JSON 信封（不要包裹其它文字）：
  {"type":"tool","module":"模块id","name":"工具名","args":{...参数对象...}}
  外部工具要带上它所属的模块 id（见上面清单每行开头）；内置工具 read/write/edit/patch/search 不用写 module。
  要一次发**多个**调用（互不依赖的那些），就把它们写进同一个信封的 calls 数组——核心按工具声明的并发性一起跑，
  结果按你写的顺序发回：
  {"type":"tool","calls":[{"name":"read","args":{...参数对象...}},{"module":"模块id","name":"工具名","args":{...参数对象...}}]}
  数组每一项的 name/module/args 与单数形态完全一样；**两种形态不能混用**（一封里要么写 name，要么写 calls）；
  一次回复也只发**一个**信封（多段信封不会被拼起来）。patch 是唯一的例外：它只能单独发（补丁正文原样跟在它自己的信封之后）。
tool_calling_native: |-
  工具调用约定：这条通道用**原生工具调用**——需要工具时直接发起工具调用（一次可以发起多个），
  参数按每个工具的参数说明填在它自己的参数槽里。
  **不要在正文里写 JSON 信封**：正文里的信封不会被当成调用执行，只会记成一条失败的工具行。
  一次可以发起多个**互不依赖**的调用：核心按工具声明的并发性调度（只读类并发跑、写入类独占并按你给出的顺序生效），
  结果一律按你发起的顺序发回。有前后依赖的步骤别挤在同一次回复里——先发前一步，拿到结果再发下一步。
  收到结果后继续，直到能给出最终答复。
