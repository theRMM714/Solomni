# 工作环境、两套调用约定与补丁语法。
# **这里不列工具**：能用哪些工具由核心按这一回合的席位现合成、随回合注入，
# 总表只留在核心手里当校验判据（见 docs/tools/tools-and-roles.md 二、三之二）。
#
# 工作环境按**环境**分发：本机档按宿主平台选（env_hosts），虚拟机档按 guest 的 os 选（env_guests）。
# 每条只写 host 或 guest 之一；全表里每个值都必须有条目（装载时校验，不静默漏发一份环境）。
# 环境块只给事实（平台、根、身份）；工作流细节归 mechanisms 与 work_* 工具说明，不混进这里。
env_hosts: [linux, windows, macos]
env_guests: [linux, macos, windows]
envs:
  - host: linux
    text: |-
      【工作环境】
      system: linux
      共享工作区（只读主副本）：{{work_root}}
      你的沙箱（可写工作副本）：{{sandbox_root}}
      {{module_roots}}
      你的agent名：{{agent}}
      当前工作：{{work_name}}
      {{path_rules}}
      共享区只读：资料 work_pull 进沙箱，产物 work_commit + work_push 发布（细节见 work_* 工具说明）。
  - host: windows
    text: |-
      【工作环境】
      system: Windows 宿主
      共享工作区（只读主副本）：{{work_root}}
      你的沙箱（可写工作副本）：{{sandbox_root}}
      {{module_roots}}
      你的agent名：{{agent}}
      当前工作：{{work_name}}
      {{path_rules}}
      本机 shell：PowerShell（退出码写法见 shell 工具说明）。
      共享区只读：资料 work_pull 进沙箱，产物 work_commit + work_push 发布（细节见 work_* 工具说明）。
  - host: macos
    text: |-
      【工作环境】
      system: macOS 宿主
      共享工作区（只读主副本）：{{work_root}}
      你的沙箱（可写工作副本）：{{sandbox_root}}
      {{module_roots}}
      你的agent名：{{agent}}
      当前工作：{{work_name}}
      {{path_rules}}
      共享区只读：资料 work_pull 进沙箱，产物 work_commit + work_push 发布（细节见 work_* 工具说明）。
  - guest: linux
    text: |-
      【工作环境】
      system: Linux guest（虚拟机内；下列路径都是 guest 内 POSIX 写法，宿主路径不存在）
      路径桥：宿主 D:\a\b → guest /solomni-host/d/a/b
      共享工作区（只读主副本）：{{work_root}}
      你的沙箱（可写工作副本）：{{sandbox_root}}
      {{module_roots}}
      你的agent名：{{agent}}
      当前工作：{{work_name}}
      {{path_rules}}
      共享区只读：资料 work_pull 进沙箱，产物 work_commit + work_push 发布（细节见 work_* 工具说明）。
  - guest: macos
    text: |-
      【工作环境】
      system: macOS guest（虚拟机内；下列路径都是 guest 内 POSIX 写法，宿主路径不存在）
      路径桥：宿主文件按路径桥映射进 guest。
      共享工作区（只读主副本）：{{work_root}}
      你的沙箱（可写工作副本）：{{sandbox_root}}
      {{module_roots}}
      你的agent名：{{agent}}
      当前工作：{{work_name}}
      {{path_rules}}
      共享区只读：资料 work_pull 进沙箱，产物 work_commit + work_push 发布（细节见 work_* 工具说明）。
  - guest: windows
    text: |-
      【工作环境】
      system: Windows guest（虚拟机内；下列路径都是 guest 内 Windows 写法，宿主路径不存在）
      路径桥：宿主 /home/u/a → guest C:\solomni-host\home\u\a
      共享工作区（只读主副本）：{{work_root}}
      你的沙箱（可写工作副本）：{{sandbox_root}}
      {{module_roots}}
      你的agent名：{{agent}}
      当前工作：{{work_name}}
      {{path_rules}}
      共享区只读：资料 work_pull 进沙箱，产物 work_commit + work_push 发布（细节见 work_* 工具说明）。

# —— patch 通道的写法：让"改文件"不必把大段文本塞进 JSON（换行/引号/CJK 都不用转义）——
patch_guide: |-
  【改文件：用 patch，别把大段文本塞进 JSON】
  信封写成 {"type":"tool","name":"patch"}，信封之后原样跟补丁文本（不转义、不加引号，中文与换行直接写）：
  *** Update File: {{sandbox_root}}/note.txt
  *** SEARCH
  （从文件里原样抄来的连续几行）
  *** REPLACE
  （换成的新内容；留空 = 删掉这几行）
  *** Add File: {{sandbox_root}}/out.md
  （新文件的整份内容，原样写）
  *** End File
  规矩：
  - 每块以 *** End File 收尾；其后的文字被忽略。
  - 一次可多块，按顺序应用；同一文件可多块（后块看到前块的结果）。
  - SEARCH 与原文整行一致（含缩进），默认要求唯一命中（多处命中报错并列出行号）。
  - 任一块不成立则一个文件都不写，只报回第几块、为什么；改对再发。
  - *** 是保留前缀：内容里以 *** 开头的行必须改写。
  - 新建用 *** Add File:；改已有用 *** Update File:（整份覆盖受管文件仍要求当前上下文能完整看到这一版）。
  - 内容照写的原样落盘：要末尾空行就在 *** End File 前留一个空行（核心不替你加）。
  - 删文件用 delete 工具（删目录加 recursive=true）；patch 不认 *** Delete File。

# —— 调用约定：信封与原生两套互斥，由通道形态决定注入哪套 ——
tool_calling_envelope: |-
  工具调用约定：需要用工具时，只输出一个 JSON 信封（不包裹其它文字）：
  {"type":"tool","module":"模块id","name":"工具名","args":{...参数对象...}}
  模块工具带所属模块 id（见清单每行开头）；系统工具不写 module。
  一次发多个互不依赖的调用：写进同一信封的 calls 数组，核心按声明的并发性一起跑，结果按你写的顺序发回：
  {"type":"tool","calls":[{"name":"read","args":{...参数对象...}},{"module":"模块id","name":"工具名","args":{...参数对象...}}]}
  calls 每项的 name/module/args 与单数形态一样；两种形态不混用（一封里要么 name 要么 calls）；一次回复只发一个信封（多段不拼）。
  patch 例外：只能单独发，补丁正文原样跟在它自己的信封之后。
tool_calling_native: |-
  工具调用约定：本通道用原生工具调用——需要工具时直接发起调用（一次可多个），参数按各工具的参数说明填进参数槽。
  不要在正文里写 JSON 信封：正文信封不会被执行，只记成一条失败的工具行。
  互不依赖的调用可一次发起多个：核心按声明的并发性调度（只读并发跑、写入独占并按你给出的顺序生效），结果按发起顺序发回。
  有前后依赖的步骤分步发：先发前一步，拿到结果再发下一步。
