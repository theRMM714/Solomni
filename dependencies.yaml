# 依赖清单：**不预置、不分发**的大体积依赖的唯一真相（产品 Rust 侧编译期内嵌；脚本可直接读同一份）。
#
# 字段：
#   id       稳定短名（报告与缺口引用）
#   os       linux / windows / macos / any（按宿主平台筛）
#   arch     x86_64 / aarch64 / any
#   install  装到产品根下的哪个目录（相对路径，用 / 分段）
#   probe    判"在不在场"的那个路径（相对产品根；文件或目录存在即在位）
#   source   下载源：links.yaml 的键，或 release:<release-tag>/<资产名>（= links.yaml 的 release.base + tag + 资产名，项目自托管便携包）
#   kind     安装方式：archive（默认，解归档）/ appimage / file（单文件直下）/ guest-disk（单文件 + 画像）/ guest-rootfs（多步构造）/ guest-runtime（起 guest 自证运行能力）/ toolchain（基础工具链：装进 .tools/toolchains 并登记 active.json）
#   guest    虚拟机档的**虚拟根名**（只有 guest 类条目有；`install` 指它那一格目录，一个虚拟根可以由多条条目共同装）
#   toolchain 【可选】kind: toolchain 的载荷：tool（active.json 的工具 id）/ version（安装布局与 active.json 的版本）/
#            target（宿主目标名，与 install 路径同一套写法）/ bins（相对安装目录、写进 active.json 的 bin 目录）/
#            wrappers（可选，装完写 cc / gcc / g++ / clang 包装——Zig 包用）
#   family   【可选】Linux 虚拟根的发行版族（只有 guest-rootfs 有；构造配方按它取，当前只有 debian）
#   strip    解包时剥掉归档里的前 N 段目录（缺省 0）
#   size_mb  大致体积（提示与带宽预估）
#   sha256   【可选】归档 / 单文件的 sha256（64 位十六进制）。**校验值与它守护的那条连接写在同一条**：
#            自托管 release 资产（source: release:<tag>/<资产名>）写在本条目；source 是 links.yaml 的键的，
#            写在 links.yaml 的 `<键>.sha256`。来源写进该条目的 note 或 links.yaml 的注释。
#            自托管条目的值由 `node pins.js update` 从该 release 的 SHA256SUMS（缺失时 GitHub API digest）生成。
#            不写 = 没有校验（`latest` 这种会随上游滚动的源只能这样）：靠解包 / 解析成功判，不假装验过。
#   note     一句话
#
# 规则：这里只收"不预置、不分发、按需下载"的依赖；guest 镜像按已定方向**不自托管**（指上游 cdimage）。
# 自托管的便携包一律保持**原样**，并登记进 dependencies/THIRD-PARTY-NOTICES.md（许可证 + 对应源码）。
deps:
  # ---- 基础工具链：运行前提（模块工具与构建按它们跑），装进 .tools/toolchains 并写 active.json ----
  # 运行期由产品自己补齐（solomni --provision --ensure --yes）；版本与下载键来自 links.yaml。
  - id: toolchain.python.windows-x86_64
    os: windows
    arch: x86_64
    kind: toolchain
    install: .tools/toolchains/windows-x86_64/python/3.14.9
    probe: .tools/toolchains/windows-x86_64/python/3.14.9/python/python.exe
    source: toolchain.python.3.14.9.windows-x86_64
    size_mb: 48
    toolchain:
      tool: python
      version: 3.14.9
      target: windows-x86_64
      bins: [python, python/Scripts]
    note: 本机档模块工具的 Python（python-build-standalone，解包即用）
  - id: toolchain.node.windows-x86_64
    os: windows
    arch: x86_64
    kind: toolchain
    install: .tools/toolchains/windows-x86_64/node/24.11.0
    probe: .tools/toolchains/windows-x86_64/node/24.11.0/node-v24.11.0-win-x64/node.exe
    source: toolchain.node.24.11.0.windows-x86_64
    size_mb: 36
    toolchain:
      tool: node
      version: 24.11.0
      target: windows-x86_64
      bins: [node-v24.11.0-win-x64]
    note: 本机档模块工具的 Node（官方二进制，解包即用）
  - id: toolchain.cc.windows-x86_64
    os: windows
    arch: x86_64
    kind: toolchain
    install: .tools/mingw64
    probe: .tools/mingw64/bin/g++.exe
    source: winlibs.upstream.asset
    strip: 1
    size_mb: 260
    toolchain:
      tool: cc
      version: 16.2.0
      target: windows-x86_64
      bins: [bin]
    note: 本机档模块构建的 C/C++（MinGW-w64；Windows 不再另装一套，与链接 Rust 用的那份同一个安装目录）
  - id: toolchain.python.linux-x86_64
    os: linux
    arch: x86_64
    kind: toolchain
    install: .tools/toolchains/linux-x86_64/python/3.14.9
    probe: .tools/toolchains/linux-x86_64/python/3.14.9/python/bin/python3
    source: toolchain.python.3.14.9.linux-x86_64
    size_mb: 48
    toolchain:
      tool: python
      version: 3.14.9
      target: linux-x86_64
      bins: [python/bin, python]
    note: 本机档模块工具的 Python（python-build-standalone，解包即用）
  - id: toolchain.node.linux-x86_64
    os: linux
    arch: x86_64
    kind: toolchain
    install: .tools/toolchains/linux-x86_64/node/24.11.0
    probe: .tools/toolchains/linux-x86_64/node/24.11.0/node-v24.11.0-linux-x64/bin/node
    source: toolchain.node.24.11.0.linux-x86_64
    size_mb: 36
    toolchain:
      tool: node
      version: 24.11.0
      target: linux-x86_64
      bins: [node-v24.11.0-linux-x64/bin]
    note: 本机档模块工具的 Node（官方二进制，解包即用）
  - id: toolchain.cc.linux-x86_64
    os: linux
    arch: x86_64
    kind: toolchain
    install: .tools/toolchains/linux-x86_64/cc/0.15.2
    probe: .tools/toolchains/linux-x86_64/cc/0.15.2/bin/gcc
    source: toolchain.zig.0.15.2.linux-x86_64
    size_mb: 48
    toolchain:
      tool: cc
      version: 0.15.2
      target: linux-x86_64
      bins: [bin]
      wrappers: true
    note: 本机档模块构建的 C/C++（Zig 提供 cc / gcc / g++ / clang 包装）
  - id: toolchain.python.macos-x86_64
    os: macos
    arch: x86_64
    kind: toolchain
    install: .tools/toolchains/macos-x86_64/python/3.14.9
    probe: .tools/toolchains/macos-x86_64/python/3.14.9/python/bin/python3
    source: toolchain.python.3.14.9.macos-x86_64
    size_mb: 48
    toolchain:
      tool: python
      version: 3.14.9
      target: macos-x86_64
      bins: [python/bin, python]
    note: 本机档模块工具的 Python（python-build-standalone，解包即用）
  - id: toolchain.node.macos-x86_64
    os: macos
    arch: x86_64
    kind: toolchain
    install: .tools/toolchains/macos-x86_64/node/24.11.0
    probe: .tools/toolchains/macos-x86_64/node/24.11.0/node-v24.11.0-darwin-x64/bin/node
    source: toolchain.node.24.11.0.macos-x86_64
    size_mb: 36
    toolchain:
      tool: node
      version: 24.11.0
      target: macos-x86_64
      bins: [node-v24.11.0-darwin-x64/bin]
    note: 本机档模块工具的 Node（官方二进制，解包即用）
  - id: toolchain.cc.macos-x86_64
    os: macos
    arch: x86_64
    kind: toolchain
    install: .tools/toolchains/macos-x86_64/cc/0.15.2
    probe: .tools/toolchains/macos-x86_64/cc/0.15.2/bin/gcc
    source: toolchain.zig.0.15.2.macos-x86_64
    size_mb: 48
    toolchain:
      tool: cc
      version: 0.15.2
      target: macos-x86_64
      bins: [bin]
      wrappers: true
    note: 本机档模块构建的 C/C++（Zig 提供 cc / gcc / g++ / clang 包装）
  - id: toolchain.python.macos-aarch64
    os: macos
    arch: aarch64
    kind: toolchain
    install: .tools/toolchains/macos-aarch64/python/3.14.9
    probe: .tools/toolchains/macos-aarch64/python/3.14.9/python/bin/python3
    source: toolchain.python.3.14.9.macos-aarch64
    size_mb: 48
    toolchain:
      tool: python
      version: 3.14.9
      target: macos-aarch64
      bins: [python/bin, python]
    note: 本机档模块工具的 Python（python-build-standalone，解包即用）
  - id: toolchain.node.macos-aarch64
    os: macos
    arch: aarch64
    kind: toolchain
    install: .tools/toolchains/macos-aarch64/node/24.11.0
    probe: .tools/toolchains/macos-aarch64/node/24.11.0/node-v24.11.0-darwin-arm64/bin/node
    source: toolchain.node.24.11.0.macos-aarch64
    size_mb: 36
    toolchain:
      tool: node
      version: 24.11.0
      target: macos-aarch64
      bins: [node-v24.11.0-darwin-arm64/bin]
    note: 本机档模块工具的 Node（官方二进制，解包即用）
  - id: toolchain.cc.macos-aarch64
    os: macos
    arch: aarch64
    kind: toolchain
    install: .tools/toolchains/macos-aarch64/cc/0.15.2
    probe: .tools/toolchains/macos-aarch64/cc/0.15.2/bin/gcc
    source: toolchain.zig.0.15.2.macos-aarch64
    size_mb: 48
    toolchain:
      tool: cc
      version: 0.15.2
      target: macos-aarch64
      bins: [bin]
      wrappers: true
    note: 本机档模块构建的 C/C++（Zig 提供 cc / gcc / g++ / clang 包装）

  - id: vm.qemu.linux
    os: linux
    arch: x86_64
    kind: appimage
    install: .vm/qemu
    probe: .vm/qemu/bin/qemu-system-x86_64
    source: release:qemu/11.1.1-4/QEMU-11.1.1-4-anylinux-x86_64.AppImage
    size_mb: 165
    sha256: 61ab65257c2db116aa28489c725379ab147a3bd399535c823a10d485ebd70fbd
    note: Linux 虚拟机档的 QEMU（pkgforge Anylinux AppImage，自带 sharun 兼容层；`--appimage-extract` 解包后约 1.7 GB，含全部 guest 目标）
  - id: vm.virtiofsd.linux
    os: linux
    arch: x86_64
    install: .vm/virtiofsd
    probe: .vm/virtiofsd/virtiofsd
    source: release:virtiofsd/1.14.0/virtiofsd-4bfa7125.zip
    strip: 3
    size_mb: 3
    sha256: 32cec50a9500dc2303307eb4cd9ab5a1c5d24a3b9cab9c84d1e8f82c9d0499f5
    note: Linux 默认共享档的外部守护进程（Rust 版 virtiofsd，musl 静态；zip 里带 target/…/release 前缀，剥 3 段）
  - id: vm.qemu.windows
    os: windows
    arch: x86_64
    install: .vm/qemu
    probe: .vm/qemu/bin/qemu-system-x86_64.exe
    source: release:qemu/11.1.1-4/qemu-windows-x86_64-11.1.1.tar.zst
    strip: 1
    size_mb: 32
    sha256: e96ffa12bdea2feddd7091b4196f61c2ecd549f3db79fd9b792867c7c68e152c
    note: Windows 虚拟机档的 QEMU（官方源码在 MSYS2（mingw-w64）下自建的便携包，--enable-slirp；DLL 与固件都在包内，引擎按便携布局指 -L）

  # guest 镜像指上游 `latest`（会随上游滚动）：无法 pin，按"下载成功 + 解包/解析成功"判。
  - id: vm.guest.linux
    os: linux
    arch: x86_64
    kind: guest-rootfs
    guest: debian-13
    family: debian
    install: .vm/guest/debian-13
    probe: .vm/guest/debian-13/rootfs.ext4
    source: guest.debian.image
    size_mb: 400
    note: Debian 13 虚拟根（cloud 镜像 → rootfs → 装 qemu-guest-agent 与通用内核 → 打包成 rootfs.ext4 磁盘镜像并按源镜像回填特权位 / 属主，目录中间产物清掉）；需要 sfdisk / dd / debugfs / ar / tar / unshare / mke2fs
  - id: vm.guest-runtime.linux
    os: linux
    arch: x86_64
    kind: guest-runtime
    guest: debian-13
    install: .vm/guest/debian-13
    probe: .vm/guest/debian-13/.runtimes-ready
    source: guest.debian.image
    size_mb: 0
    note: Linux guest 的运行期编排（agent 已由 guest-rootfs 装进镜像，跳过首启；维护启动刷新 apt 并装 python3 与 C-C++，Node 用固定版本官方二进制，逐个自证后才写进 guest.yaml 的 runtimes）
  - id: vm.guest.windows
    os: windows
    arch: x86_64
    kind: guest-disk
    guest: debian-13
    install: .vm/guest/debian-13
    probe: .vm/guest/debian-13/rootfs.qcow2
    source: guest.debian.qcow2
    size_mb: 330
    note: Windows 宿主用的 Debian cloud qcow2（单文件直下 + 写 guest.yaml 画像）；agent 与运行包由 vm.guest-runtime.windows 的 Rust 编排装上
  - id: vm.guest-runtime.windows
    os: windows
    arch: x86_64
    kind: guest-runtime
    guest: debian-13
    install: .vm/guest/debian-13
    probe: .vm/guest/debian-13/.runtimes-ready
    source: guest.debian.qcow2
    size_mb: 0
    note: Windows guest 的运行期编排（首启 cloud-init 装 qemu-guest-agent → 维护启动先整份刷新 apt lists，再装必需的 python3 / cifs-utils / C-C++ 与固定版本 Node → 逐个自证 python -V / node --version / gcc 编译，只把自证过的写进 guest.yaml 的 runtimes）；镜像源与 vm.guest.windows 同一份 qcow2（走缓存）

  - id: vm.smbd.windows
    os: windows
    arch: x86_64
    kind: file
    install: .vm/smbd
    probe: .vm/smbd/smbd.exe
    source: smbd.windows
    size_mb: 1
    note: 宿主侧用户态 SMB 共享服务（独立 fork 仓 rust-smb-server 的 smbd-v* release，基线上游 v0.9.1；Windows 没有 9p / virtiofs，SMB 经 guestfwd 做实时共享）。Windows 用户档的**硬前置**：缺它虚拟机档不可用，先补齐，不降级；带自有 rooted 目录层（不用 cap-std），路径操作在父目录句柄上完成；共享拒绝 POSIX 删除标记时退回 delete-on-close，UNC 共享根的枚举 / 建 / 改名 / 删都可用；校验值在 links.yaml 的 `smbd.windows.sha256`（该 release 的 `.sha256` 资产，由 pins.js 刷新）
