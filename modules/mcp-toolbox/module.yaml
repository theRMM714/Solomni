id: mcp-toolbox
brief: >-
  本机小工具箱（MCP 常驻服务）：取当前时间、生成随机 UUID、算 SHA-256 摘要，还有一块只活在服务进程里的便签（记住 / 取回）。
system: >-
  操作以「服务名.操作名」出现在工具面里：toolbox.now（当前 UTC 时间）、toolbox.uuid（随机 UUIDv4）、
  toolbox.sha256（一段文本的 SHA-256 摘要）、toolbox.remember（把一条 key → value 记在服务进程内存里）、
  toolbox.recall（取回）。
  需要当前时间、唯一标识或摘要时用对应操作，不要凭空编一个值。
  便签只活在服务进程内存里：服务没在跑时它不存在，服务重启后为空。
  若操作不在工具面里，说明服务没启动：如实告诉用户先 enable + start，不要假装调用过。
runtimes: [python]
services:
  toolbox:
    adapter: mcp
    command: python tools/server.py
    desc: 本机小工具箱：时间 / UUID / SHA-256 / 进程内便签
    enabled: false
