id: indexer
brief: >-
  给语料建倒排索引、做毫秒级本地检索，顺带找近似重复。只吃 harvest 产出的 corpus.jsonl，
  全程本机计算，不联网、不采集、不写入知识库。
system: >-
  工具：build（建倒排索引）、query（查索引）、dups（找近似重复）。
  build：args {"corpus":"<corpus.jsonl 路径>","out":"<index.bin 输出路径>"}；
  query：args {"index":"<index.bin 路径>","q":"检索词","limit":10}，limit 为 1..50、缺省 10，只读、可并发；
  dups：args {"corpus":"<corpus.jsonl 路径>","threshold":0.6}，threshold 为 0..1、缺省 0.6，只读、可并发。
  输入是 harvest 产出的 corpus.jsonl：每行一个 JSON 对象，字段 rel / path / kind / bytes / chars /
  lines / headings / links / text。路径用【工作环境】给出的写法；corpus 先用 work_pull 拉到沙箱，
  产物写沙箱，收尾用 work_commit 提交回共享区；userdata/ 是模块自己的跨任务私有区（模块进程可写），不是本次成品区，不要把任务成果放进去。
  分词是 ASCII 词（长度 >= 2，转小写）+ 中文相邻二元组；中文查询给两个字以上的连续片段（例如「检索」）。
  indexer 是编译产物：首次使用前按 modules/indexer/README.md 构建一次（Windows 产出
  build/indexer.exe，Linux/macOS 产出 build/indexer）；构建失败就如实报告，不要假装检索过。
  工具失败一律是非零退出码 + stderr，看到失败照实说，不要用空结果兜底；query 没命中时工具会明说，照原样转述。
build:                  # 系统照它在**目标环境**里编出产物（solomni --build=indexer；toolchain 不进 agent 围栏）
  command: tools/build  # 平台各一份：tools/build（unix 脚本）+ tools/build.cmd（Windows），壳按 PATHEXT 找
  needs: [gcc]          # 构建期能力名 = 宿主 PATH 上的可执行名（本机档按它判；虚拟机档见 MODULE_SPEC）
tools:
  build:
    command: build/indexer build
    desc: 从 corpus.jsonl 建倒排索引，写出一个二进制 index.bin
    params:
      corpus:
        type: string
        required: true
        desc: corpus.jsonl 的路径（用【工作环境】的写法；work_pull 到沙箱里的副本）
      out:
        type: string
        required: true
        desc: 索引产物 index.bin 的路径（用【工作环境】的写法；写在你的沙箱里）
  query:
    command: build/indexer query
    parallel: true
    desc: 在 index.bin 上做关键词检索，按命中 token 数排序并给出摘要
    params:
      index:
        type: string
        required: true
        desc: build 产出的 index.bin 路径
      q:
        type: string
        required: true
        non_empty: true
        desc: 检索词；中文给两个字以上的连续片段
      limit:
        type: integer
        default: 10
        min: 1
        max: 50
        desc: 最多返回多少篇
  dups:
    command: build/indexer dups
    parallel: true
    desc: 在 corpus.jsonl 上找近似重复文档对，按相似度降序
    params:
      corpus:
        type: string
        required: true
        desc: corpus.jsonl 的路径（用【工作环境】的写法；work_pull 到沙箱里的副本）
      threshold:
        type: number
        default: 0.6
        min: 0
        max: 1
        desc: 相似度阈值，>= 该值的文档对才输出
