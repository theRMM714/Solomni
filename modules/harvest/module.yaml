id: harvest
brief: >-
  把工作共享区里的资料扫成一份可复用的语料清单：抽取正文、标题层级与链接，并统计字节、字符与行数。
system: >-
  scan 用法：args 的 root（要扫描的目录）与 out（corpus.jsonl 输出路径）必填；
  include 是可选扩展名白名单，缺省 md,markdown,htm,txt,html,json（.markdown 归 md，.htm 归 html）。
  路径按【工作环境】给出的写法；root 用 work_pull 拉到自己的沙箱副本，
  out 写沙箱，收尾用 work_commit 提交回共享区；userdata/ 是模块自己的跨任务私有区（模块进程可写），不是本次成品区，不要把任务成果放进去。
  scan 递归扫 root，跳过隐藏目录、userdata/、符号链接、扩展名不支持 / 不在白名单、超过 8 MB 或读不了的文件；
  回执只给统计与产物路径，不回显正文。
  失败是非零退出码 + stderr；没命中任何资料不是错误。
runtimes: [python]
tools:
  scan:
    command: python tools/scan.py
    desc: 扫描一个目录，把里面的文本资料抽成语料清单 corpus.jsonl（只读原件；产物写到 out）。
    params:
      root:
        type: string
        required: true
        non_empty: true
        desc: 要扫描的根目录（用【工作环境】的写法；通常是 work_pull 到你自己沙箱里的副本）
      out:
        type: string
        required: true
        non_empty: true
        desc: 语料清单写到哪个文件（用【工作环境】的写法；写在你的沙箱里，收尾用 work_commit 提交回共享区）
      include:
        type: string
        desc: 逗号分隔的扩展名白名单，缺省 md,markdown,htm,txt,html,json
