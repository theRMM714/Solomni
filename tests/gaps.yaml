# 全局测试与质量缺口（当前状态：条目存在 = 尚未完成；补上后删除条目）
#
# 这里放两类：**长期目标**（存量收敛、目录迁移）与**已确认但尚未实施的产品/机制缺口**。
# 已经能机器判定的门禁不入账。平台与跨平台层的缺口记在
# tests/cross-platform/gaps.yaml 与 tests/<平台>/gaps.yaml（它们决定 TEST-REPORT-ACCEPTED）。

- id: module.acp-adapter
  scope: global
  level: T3
  why: |
    「常驻服务」目前只实现了 MCP stdio 适配器（`residents/detail/mcp.rs`）：`module.yaml` 的
    `services.<名>.adapter` 写 `acp` 会被如实拒收（未知适配器）——ACP（Agent Client Protocol）这类
    按行 JSON-RPC 的 harness 拉不起来，MCP 之外的常驻服务对模块作者不可用。
  how: |
    1) 定 ACP 的握手 / 方法 / 回执映射：能共用长驻会话端口 `SessionHost` 与按行收发就共用，
       不另造机制；协议形状只进 `residents/detail/` 的适配器，kernel 与 service 不认识 ACP；
    2) 组合根注册该适配器（与 `mcp` 并列，`ServiceAdapter::id()` = `acp`）；
    3) 契约用例（脚本化会话端口）+ 真实服务端到端（自足 fixture，缺依赖时如实 env-skip）；
    4) 同步 docs/residents/README.md、docs/testing/doubles.md 端口矩阵、MODULE_SPEC。
  accept: |
    声明 `adapter: acp` 的模块能拉起、发现操作、调用并看回执；未知适配器仍如实列出可用名；
    `node run-tests.js` 全绿。
  blocked_by: 缺少实现

- id: work.large-asset-transfer
  scope: global
  level: T3
  why: |
    共享区已按字节资产、流式 IO 与 64 MiB 单文件上限收口：普通图片 / 视频 / 二进制能拉取、提交、
    看三方与显式选边；超过上限的单文件会被明确拒绝。但更大的资产（长视频、整包镜像、归档）
    仍没有存储级分块、可续传上传或分块校验；上传入口仍走 base64 一次性请求，峰值内存随文件线性上升。
    这部分要动提交树 / 对象格式 / 恢复事务与上传协议，不能靠调大常量解决，因此单独记为缺口。
  how: |
    1) 定分块资产格式：提交树里大文件用清单（chunk 列表）而不是单对象；对象仍内容寻址，GC / 恢复 / 物化
       按清单可达集合处理。
    2) 读路径：pull / versions / restore 按 chunk 流式拼装；versions 只读清单与预览窗口。
    3) 写路径：commit 支持按清单登记；上传改为流式 / 可续传（不再 base64 整包），并保留单文件与本次总量上限。
    4) 契约与验收：超大资产能进入共享区并被另一 agent 拉取、提交、显式选边；内存不随文件大小线性增长；
       补 T2 / T3 / T5 用例（含中断恢复与 GC 可达性）。
  accept: |
    超过当前单文件上限的资产有分块 / 可续传路径，能 pull、commit、显式选边并恢复；
    读写内存有界；上传中断可续传；node run-tests.js 全绿。
  blocked_by: 缺少实现（当前只有流式 IO 与 64 MiB 上限；分块存储 / 可续传上传未实现）

- id: testing.coverage-child-and-platform
  scope: global
  level: T3
  why: |
    node run-tests.js --coverage 只覆盖测试进程内的代码。产品二进制（守门进程 solomni --fence-run、
    L4 端到端）由本入口单独 cargo build，未插桩，作为子进程运行不会被计入；平台 #[cfg] 代码在
    别的平台根本不编译。任何一份覆盖率都只代表"当前平台 + 进程内那几层"，当全貌会误导。
  how: |
    1) 三平台各自跑一次（与 T4 平台探针同一矩阵）；
    2) 若要把子进程计入：产品构建也用同一插桩（-C instrument-coverage），LLVM_PROFILE_FILE 带 %p
       传播到子进程，收尾合并 profraw；
    3) 产出"未覆盖清单"后逐条决定补测或记缺口；补齐能力的"可用 / 缺件 / 补齐后可用"三态探针也按平台各覆盖一次
       （Linux 已有真机验证；Windows / macOS 待各自平台）。
  accept: |
    三平台各有一份覆盖率报告，且报告明确标注"仅进程内 / 仅当前平台"或已聚合子进程；
    未覆盖的生产路径逐条有补测或缺口结论。
  blocked_by: 缺少观察面（子进程插桩与合并尚未实现）

- id: vm.windows-macos-guest
  scope: global
  level: T4
  why: |
    当前 fenced guest 执行只承诺 Linux guest 的 /bin/sh；Windows guest 与 macOS guest 的
    guest 内工具 / shell、围栏、agent 通道本期都不开发。macOS 已有 fence.guest-tier-not-wired
    等平台缺口；Windows 没有对应能力。
  how: |
    本期不做；文档与产品状态如实写“不可用”，不把 Windows/macOS guest 当成已支持。
    将来做需要：Windows guest 镜像与 guest 内 agent / 围栏 / PowerShell 通道；macOS 按现有平台缺口补。
  accept: |
    文档、启动报告与界面都如实说 Windows/macOS guest 本期不可用；任何代码路径不声称支持；
    对应的平台缺口保留。将来补齐时另立验收。
  blocked_by: |
    本期不做（用户决定）；macOS 另有平台机制缺口，Windows guest 需要完整的新机制。

- id: permission.windows-concurrent-call-overlap
  scope: global
  level: T3
  why: |
    Windows 的容器 ACL 按 agent 容器 SID 生效。按次 lease + 跑完撤 ACE 已解决**串行**切换的残留
    （每次调用只撤自己的 owner），shell 的 sandbox / external 还走按次临时 profile；但**同一 agent
    的并发模块工具调用**仍共享同一个容器 SID/profile。两个不同 scope 的调用重叠时，窄调用在另一调用
    还活着的那段时间里仍可能看到对方临时加的根。这是 per-call ACL 与 per-agent profile 的边界，不是
    shell 的 sandbox 问题（shell 有独立 profile）。
  how: |
    两个方向：
    1) 模块工具也按次临时容器 profile（独立 SID）；代价是每次调用建/删 profile，并发多时成本高；
    2) 保持 agent profile，但按调用把 ACL 收窄到「本调用可见的并集」——需要跨调用引用计数/门控，
       并明确重叠窗口的语义；不能只靠 lease 撤权（撤的是自己的 owner，不阻止对方活着时的授权）。
    先定并发语义（允许重叠可见 vs 严格隔离），再按端口矩阵补 Windows 真机并发用例。
  accept: |
    同一 agent 的两个不同 scope 调用重叠时，窄调用读不到另一调用的额外根；并发撤销互不影响；
    调用结束/崩溃回收不留孤儿 ACL；其它平台行为不变；node run-tests.js 全绿。
  blocked_by: 缺少模块工具的按次容器 profile 或跨调用 ACL 隔离（当前只在调用结束时按 lease 撤自己的 ACE）

- id: vm.guest-run-cancel-live
  scope: global
  level: T3
  why: |
    guest 取消机制已实现（Vm/GuestChannel 可取消、QGA SIGTERM、helper killpg、VM live 用例断言），
    但本机与当前 CI 没有 QEMU / guest 真机环境，未开 SOLOMNI_VM_LIVE；真实 QGA 往返、helper 信号处理、
    进程树清理与 15 秒上限只在代码/契约层验证，尚未有一份真机通过证据。
  how: |
    在 Linux 宿主安装/指向 QEMU 与 guest 虚拟根，设 SOLOMNI_VM_LIVE=1、SOLOMNI_VM_QEMU、可选
    SOLOMNI_VM_GUEST，跑 vm_live_guest_runs_command_inside_guest（其中已含 sleep 30 + 取消断言）；
    记录取消耗时、helper stderr、孤儿进程检查与 timeout 仍生效。
  accept: |
    真机上 guest 内 sleep 30 在 host 停止后 15 秒内被杀；回执含「用户停止」；timeout 30 仍照常收口；
    没有残留 guest 进程；三平台（当前 Linux guest）契约一致；node run-tests.js 全绿。
  blocked_by: 本机/CI 无 QEMU 与 guest 真机（未开 SOLOMNI_VM_LIVE）；不是缺实现



