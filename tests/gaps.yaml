# 全局测试与质量缺口（当前状态：条目存在 = 尚未完成；补上后删除条目）
#
# 这里放两类：**长期目标**（存量收敛、目录迁移）与**已确认但尚未实施的产品/机制缺口**。
# 已经能机器判定的门禁不入账。平台与跨平台层的缺口记在
# tests/cross-platform/gaps.yaml 与 tests/<平台>/gaps.yaml（它们决定 TEST-REPORT-ACCEPTED）。

- id: fence.guest-tier-not-wired
  scope: global
  level: T4
  why: |
    虚拟机档的选型、诊断、装配计划与**逐项前置检测**都已就位，但 guest 本体未接入：ExecPlan.packages
    全仓没有任何执行消费点（create_work 只把它打进日志），选 vm 档实际仍按本机档跑。这意味着当前产品
    **不存在**"用户不授权本机写权限也能拿到强隔离"的路径——未授权时文件系统与断网围栏都是关的。
    因为 guest 本体是**所有机器**共同缺的一项，虚拟机档现在一律不可选（exec::tier_readiness），
    界面逐项列出缺什么、每项怎么补。
  how: |
    方向已定（不再讨论）：走**平台原生虚拟化**（Windows 虚拟机平台 / Linux KVM / macOS 虚拟化框架），
    **不内置 QEMU、不随仓库分发镜像**——QEMU 与镜像用户自备，产品只检测与指路
    （设置项 qemu_path 与 base；这样不背 GPL 源码分发义务、仓库也不膨胀）。
    要做的事，按顺序：
    1) 把 guest 抽象成端口（core/ports.rs，与 ToolRunner / FenceHost 同层）：start / exec / stop，
       由适配层按平台实现；core 依旧无 IO。FenceSpec 的 rw / ro 在 guest 内变成挂载，net 变成"给不给网卡"。
    2) 三平台后端各一套：Linux QEMU+KVM；macOS Virtualization.framework；Windows 虚拟机平台 / HCS。
    3) 装配接线：消费 exec::plan 的 packages（prefix 只读共享、system 叠层），会话级一个 guest，
       会话删除时销毁 guest 与它的磁盘（与 --fence-clean 同哲学）。
  accept: |
    在真机上选 vm 档跑一次工具：进程确实跑在 guest 内（可达范围与宿主隔离）；会话删除后 guest 与其磁盘被销毁；
    三平台探针覆盖"guest 可用 / 不可用"两种结论；届时删除本条并同步 PRODUCT.md / RUNTIME_SPEC.md 的当前状态。
  blocked_by: |
    有意推迟（不是缺条件）：guest 相对现有围栏的独特价值只有"不授权本机写权限也能拿到强隔离"一条，
    而代价是三套原生 API、每平台真机验证，且 CI 起不了 hypervisor（只能真机验 + env-skip）。
    项目成熟、需求更清楚时再做。


- id: web.external-file-delete-not-reflected
  scope: global
  level: T5
  why: |
    用户在会话的共享区/沙箱里**手工删掉**文件后，@ 菜单还会把它列出来：前端按会话缓存文件清单，
    只有应用内的上传/编辑/删除才让缓存失效。用户会照着菜单去引用一个已经不存在的文件。
  how: |
    给文件清单一个明确的过期判据：每次打开 @ 菜单重拉一次（不跨打开缓存），或随状态刷新按 mtime 失效。
    不引入目录 watcher——本机、跨平台，代价不值。
  accept: |
    在会外删掉一个文件后，再打开 @ 菜单列不出它；应用内上传/编辑后**立刻**仍能列出来。
  blocked_by: |
    待排期：本轮先收口会话流与行渲染的统一，这条是观察到的界面同步问题，尚未动手。

- id: session.delete-without-file-check
  scope: global
  level: T5
  why: |
    「删除会话」只确认"记录将被永久删除"，不看共享区与各 agent 沙箱里**还有没有文件**（产物可能还没被拿走）。
    用户以为只是删记录，实际把工作区一起带走了。
  how: |
    删除前统计共享区与各沙箱里的文件（数量 + 总字节）；非空就如实列出来，让用户明确选择"连文件一起删"。
  accept: |
    工作区非空时删除会先列出文件并要求确认；工作区为空保持一步删除。
  blocked_by: |
    待排期（同上）：删除语义要一并定"记录与文件分开删"的话术，属于产品口径变更。

- id: session.create-has-no-tier-choice
  scope: global
  level: T5
  why: |
    执行档位（本机档 / 虚拟机档）只能在会话建好之后的「编辑」里改，创建向导里没有这一项
    （WorkSpec 只有 name/mode/agents/task/delegate）——建完再改是多余的一步。
  how: |
    创建向导加档位选择（默认本机档）；不可用的档位按现有 tier_readiness 逐项说明缺什么并禁用，
    选定值随 WorkSpec 进 create_work。
  accept: |
    创建向导能选档位；选不可用档位时逐项说明缺什么；建出来的会话 meta 档位与所选一致。
  blocked_by: |
    待排期：档位可用性判定（exec::tier_readiness）已就位，缺的只是向导里那一格与 WorkSpec 的字段。

- id: cli.webui-ctrl-c-exits-process
  scope: global
  level: T5
  why: |
    从 CLI 进 Web 转录中心后，Ctrl+C 直接结束整个进程，而不是退回 CLI（用户得重启程序）。
  how: |
    给 Web 服务器一个可中断的等待：收到 Ctrl+C / SIGINT 后正常关闭服务器并回到 CLI 主循环。
  accept: |
    Ctrl+C 后回到 CLI 提示符、进程仍在；再输入 webui 能重新起服务器。
  blocked_by: |
    待排期：要把 Web 服务器从"阻塞到出错"改成可中断等待（收 SIGINT 后正常关闭再回 CLI 主循环）。

- id: session.children-not-deleted-with-parent
  scope: global
  level: T1
  why: |
    删主会话只删它自己（`Conductor::history_delete` 只处理一个目录），子会话（`<父>--<agent>`）留在盘上
    变成孤儿：用户得一个个删。反过来，子会话本来就不该由用户单独删（它是核心按节点派生的），
    但界面给每个子会话都渲染了删除按钮，删除它会让父子关系断掉。**既漏删又错开**。
  how: |
    ① 面向用户的删除面（`HistoryOps::delete` → `Conductor::history_delete`）**拒绝子会话**：
    `meta.parent` 非空即报错，理由说清（"由核心管理，删父会话会一起删掉"）；
    ② 删主会话时按 `meta.parent` 收集整棵子树（后序：先子后父），逐个撤围栏授权 → 移出内存 → 删目录；
    ③ 子树里任一节点在生成中就整体拒绝（不能删到一半留下半个状态）；
    ④ 前端：子会话不渲染删除按钮，父会话的删除按钮 title 写明"连子会话一起删"。
    内部的 `session::History::delete`（纯存储机制）不受影响——系统路径还需要它。
  accept: |
    删主会话后：它的所有子会话一并消失（列表与目录都不再有）；直接删子会话被拒、理由明确且子会话仍在；
    子树里有会话在生成时删除被拒；前端冒烟断言"子会话没有删除按钮、父会话的按钮接线"。
  blocked_by: |
    与 `session.children-stored-as-siblings` 同一批做（落盘位置改到主会话目录内部之后，"连带删除"
    就是"删一个目录"；两处分开做等于改两遍）。删除口径还要与 `session.delete-without-file-check`
    对齐（记录与文件分开删）。

- id: session.children-stored-as-siblings
  scope: global
  level: T1
  why: |
    子会话现在是 `sessions/` 下**与主会话并列**的独立目录（名为 `<父>--<agent>`），父子关系只靠
    `meta.parent` 这个字段维系。这让"删父带子"必须自己走一遍树，也让目录布局与语义脱节：
    子会话在主会话目录之外，任何按目录做的操作（清理、统计、迁移、删父）都得先读全部 meta 才知道谁是谁的儿子。
  how: |
    子会话放进**主会话目录内部**（例如 `sessions/<主会话>/children/<agent>/`），`meta.parent` 保留为
    事实与校验（看位置就知道归属）。落到代码：
    ① session 的 `HistoryStore` 端口（`detail/fs_history.rs`）改布局与"名字 → 路径"的解析；
    ② 列出 / 打开 / 删除按新布局递归，`history_list` 的树序与 `meta.parent` 保持一致（位置与字段同源）；
    ③ 重建会话（`rebuild_session` / `ensure_session`）按新路径取子会话流水；
    ④ GREEN FIELD，不留旧布局的读兼容：旧目录按"未迁移"对待，不静默当成新布局。
  accept: |
    建一个会派生节点的协作会话后：磁盘上只有 `sessions/<主会话>/children/<agent>/`（`sessions/` 下不再
    与主会话并列出现子会话目录）；打开 / 列表 / 回档照常；删主会话 = 删一个目录，子会话随之消失。
  blocked_by: |
    与 `session.children-not-deleted-with-parent` 同一批（这条是它的前提）。等用户把问题说完再定实现细节
    （sid 命名是否仍用 `<父>--<agent>`、children 的目录名取 agent 名还是节点名）。

- id: fence.per-agent-write-roots
  scope: global
  level: T4
  why: |
    「垂直分工开发」要求一个 agent 只写自己负责的目录，但当前围栏的可写范围是**整个本次工作共享区**
    `work/`（加该 agent 的私有沙箱与它自己的模块目录），所有 agent 对共享区都可写——"谁改哪一块"
    因此只是约定，不是机制保证。PRODUCT.md 已把它写成开发方向，所以需要可判定的验收路径。
  how: |
    1) `.home/settings.yaml` 为每个 agent 增加一组可写路径（缺省 = `work/`）；
    2) 平台后端按这份清单授权（Windows 走 `confine::grant_targets` 的目录 ACL，Linux/macOS 走规则文本）；
    3) `tests/windows/`、`tests/linux/`、`tests/macos/` 各加一条探针：A agent 写自己目录成功、
       写 B 的目录**被机制拒绝**（不是工具层拒绝）。
  accept: 三平台探针各一条"跨 agent 目录写被机制拒绝"通过；不给该清单时行为与今天一致。
  blocked_by: 缺少实现

- id: module.external-harness-fence-reach
  scope: global
  level: T3
  why: |
    MODULE_SPEC 允许把外部 harness 当模块的一个工具（`tools.<名>.command` 指向它的命令行）。
    围栏目前只按运行包放行解释器目录，系统里已安装的 harness 可执行文件是否落在可达范围内
    **没有验证过**；文档已按"开发方向"标注，不能停在"大概能跑"。
  how: |
    1) 写一个把外部命令行 harness 当工具的测试模块（命令落在模块目录内）；
    2) 在授权围栏（`--fence-live`）下跑 T3 真实边界用例，记录可执行文件的可达性结论；
    3) 若不可达，把可执行文件纳入运行包登记或围栏可达范围，再复跑。
  accept: 授权围栏下该模块的工具跑通一次完整往返；或如实写明"必须把可执行文件放进模块目录"并落到文档与登记处。
  blocked_by: 缺少观察面

- id: fence.leftover-grant-hides-parent
  scope: global
  level: T4
  why: |
    围栏给"数据边界叶子的直接父目录"授只读属性位（RIGHTS_STAT）时用的是**显式、非继承**的 ACE。
    实测：`tests/` 上留着一条 `S-1-15-2-1128246502-…:(OI)(CI)(S)`（rights = Synchronize，IsInherited=False），
    后果是**整个 `tests/` 子树在受限（沙箱）进程里不可读**——列目录、stat 子项、读文件一律拒绝访问，
    而普通用户身份读得到；`git status` 因此把 `tests/` 下所有已跟踪文件报成"已删除"。
    一条"只为了让容器判断存在性"的残留授权，反过来把父目录对整个沙箱隐藏：撤权没带走它。
  how: |
    1) 复现：在 `--fence-live` 下跑一次会建数据边界叶子的用例（或直接调 `confine::prepare_fence`），
       然后 `icacls <叶子父目录> /findsid <容器SID> /T` 应命中；受限进程读该父目录应失败。
    2) 先查撤权路径为什么没带走它：`grant_targets` 与撤销共用一份落点清单（见 ARCHITECTURE 六），
       父目录那条 RIGHTS_STAT 是否在那份清单里、`--fence-clean` 的扫描是否覆盖它——查清再改。
    3) `tests/<平台>/` 加一条探针：授权→撤权后父目录不再留有该 SID 的显式 ACE，且受限进程能列该目录。
  accept: 撤权后父目录 `/findsid` 无命中、受限进程能列目录、`git status` 不再出现幻影删除。
  blocked_by: 缺少实现
