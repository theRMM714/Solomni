# 全局测试与质量缺口（当前状态：条目存在 = 尚未完成；补上后删除条目）
#
# 这里放两类：**长期目标**（存量收敛、目录迁移）与**已确认但尚未实施的产品/机制缺口**。
# 已经能机器判定的门禁不入账。平台与跨平台层的缺口记在
# tests/cross-platform/gaps.yaml 与 tests/<平台>/gaps.yaml（它们决定 TEST-REPORT-ACCEPTED）。

- id: module.acp-adapter
  scope: global
  level: T3
  why: |
    「常驻服务」目前只实现了 MCP stdio 适配器（`residents/detail/mcp.rs`）：`module.yaml` 的
    `services.<名>.adapter` 写 `acp` 会被如实拒收（未知适配器）——ACP（Agent Client Protocol）这类
    按行 JSON-RPC 的 harness 拉不起来，MCP 之外的常驻服务对模块作者不可用。
  how: |
    1) 定 ACP 的握手 / 方法 / 回执映射：能共用长驻会话端口 `SessionHost` 与按行收发就共用，
       不另造机制；协议形状只进 `residents/detail/` 的适配器，kernel 与 service 不认识 ACP；
    2) 组合根注册该适配器（与 `mcp` 并列，`ServiceAdapter::id()` = `acp`）；
    3) 契约用例（脚本化会话端口）+ 真实服务端到端（自足 fixture，缺依赖时如实 env-skip）；
    4) 同步 docs/residents/README.md、docs/testing/doubles.md 端口矩阵、MODULE_SPEC。
  accept: |
    声明 `adapter: acp` 的模块能拉起、发现操作、调用并看回执；未知适配器仍如实列出可用名；
    `node run-tests.js` 全绿。
  blocked_by: 缺少实现

- id: work.large-asset-transfer
  scope: global
  level: T3
  why: |
    共享区已按字节资产、流式 IO 与 64 MiB 单文件上限收口：普通图片 / 视频 / 二进制能拉取、提交、
    看三方与显式选边；超过上限的单文件会被明确拒绝。但更大的资产（长视频、整包镜像、归档）
    仍没有存储级分块、可续传上传或分块校验；上传入口仍走 base64 一次性请求，峰值内存随文件线性上升。
    这部分要动提交树 / 对象格式 / 恢复事务与上传协议，不能靠调大常量解决，因此单独记为缺口。
  how: |
    1) 定分块资产格式：提交树里大文件用清单（chunk 列表）而不是单对象；对象仍内容寻址，GC / 恢复 / 物化
       按清单可达集合处理。
    2) 读路径：pull / versions / restore 按 chunk 流式拼装；versions 只读清单与预览窗口。
    3) 写路径：commit 支持按清单登记；上传改为流式 / 可续传（不再 base64 整包），并保留单文件与本次总量上限。
    4) 契约与验收：超大资产能进入共享区并被另一 agent 拉取、提交、显式选边；内存不随文件大小线性增长；
       补 T2 / T3 / T5 用例（含中断恢复与 GC 可达性）。
  accept: |
    超过当前单文件上限的资产有分块 / 可续传路径，能 pull、commit、显式选边并恢复；
    读写内存有界；上传中断可续传；node run-tests.js 全绿。
  blocked_by: 缺少实现（当前只有流式 IO 与 64 MiB 上限；分块存储 / 可续传上传未实现）

- id: testing.coverage-child-and-platform
  scope: global
  level: T3
  why: |
    node run-tests.js --coverage 只覆盖测试进程内的代码。产品二进制（守门进程 solomni --fence-run、
    L4 端到端）由本入口单独 cargo build，未插桩，作为子进程运行不会被计入；平台 #[cfg] 代码在
    别的平台根本不编译。任何一份覆盖率都只代表"当前平台 + 进程内那几层"，当全貌会误导。
  how: |
    1) 三平台各自跑一次（与 T4 平台探针同一矩阵）；
    2) 若要把子进程计入：产品构建也用同一插桩（-C instrument-coverage），LLVM_PROFILE_FILE 带 %p
       传播到子进程，收尾合并 profraw；
    3) 产出"未覆盖清单"后逐条决定补测或记缺口；补齐能力的"可用 / 缺件 / 补齐后可用"三态探针也按平台各覆盖一次
       （Linux 已有真机验证；Windows / macOS 待各自平台）。
  accept: |
    三平台各有一份覆盖率报告，且报告明确标注"仅进程内 / 仅当前平台"或已聚合子进程；
    未覆盖的生产路径逐条有补测或缺口结论。
  blocked_by: 缺少观察面（子进程插桩与合并尚未实现）

- id: permission.reach-and-decision
  scope: global
  level: T3
  why: |
    当前权限只有会话级 granularity（ask/full）+ ask 工具名单：逐工具只能决定“要不要问”，
    不能决定“能到哪”。路径白名单/黑名单只作用于共享区；网络、主机只读根是全局开关；
    工具声明的 capability 只是标签，不参与授权。围栏由 FenceSpec::from_sandbox 一刀切，
    模块 userdata 写、共享区只读、私有沙箱全权这些差异都硬编码在派生里。
    结果：执行类工具（尤其 shell）无法表达“默认只在自己的私有沙箱里跑、越过沙箱才问人”；
    卡片 full 同时表示“会话不确认”和“本轮不再问”，语义重载；ask 在没有可回答前端时直接放行（fail-open）。
    当前继承事实也不是“根一份”：协作成员与代理子会话在创建时复制父会话的 sandbox 权限
    （spawn_agent_session 与 prepare_work 都复制 pmeta.sandbox），父编辑会向子树传播；
    但子会话直接 edit 时只把 agents / modules 写回 owner，sandbox.permissions 不写回，
    于是子会话可以出现与父 / 根不一致的权限，且可能更宽。代理自己的 runtime Sandbox 还在
    proxy.rs 里硬编码了 granularity=Full（不落 meta）：代理子会话继承的是用户档位，不是这个 full。
    这些都是“子会话不得超过父会话”必须一起收口的问题。
    正确口径不是“根一份”，而是“**根 ceiling + 子会话只收窄**”：多 agent 各写共享区一个文件夹
    是合法需求；错的是“子会话可以比根更宽”和“父编辑覆盖子收窄”。
    shell 要安全，必须先把这套权限模型升级；这也是后续所有执行类工具的共同前提。
  how: |
    1) 权限拆成 reach × decision：
       reach = private / shared-read / shared-write / module-read / module-write / host-read / network / secrets；
       decision = allow / ask / deny。
       工具声明最大 reach 与默认 decision；会话在最大 reach 内覆盖；全局 sandbox.policy 是硬上限。
       工具声明的最大 reach 是第二道闸：shell 不声明 shared-write / module-write，
       所以即使档位“全可达”，shell 也写不进共享区与模块 userdata。
    2) 用户可切换的会话权限档位（名称暂定；最高档按 reach 命名，不叫“完全权限”）：
       - 仅可查看：reach = private + shared-read + module-read；读类 allow、写类 deny；shell 关闭；
       - 工作区内修改：reach = private + shared-read + shared-write（仅 work_commit）+ module-read；
         decision = allow；shell 只允许 sandbox scope；
       - 外部可达（逐次确认）：上一档 + host-read + network；
         sandbox scope 的 decision = allow，external scope 的 decision = ask；
       - 全可达（自动放行）：上一档的全部 reach；decision = allow。
         它与上一档的 reach 相同，差别只在 decision；它表示“reach 有多宽就授予多宽”，
         不表示“绕过围栏 / 全局策略”，也不扩大 shell 的工具最大 reach。
       档位只由 user 经呈现层切换；agent、子会话、core_proxy 不能自我提权；
       子会话不得超过父会话的档位上限。
       切换在**下一次权限判定**生效；已经在执行的调用不追溯，UI 要如实说明。
    3) 每次执行类调用可请求 scope（shell 为 sandbox / external）：
       effective_reach = 档位授予的 reach ∩ 工具声明的最大 reach ∩ 请求的 scope；
       requested ⊄ granted = 拒绝（不是问）；requested ⊆ sandbox-only = allow；
       超出 sandbox 时按有效 decision 处理：allow 直接跑、ask 问、deny 拒绝。
       scope 是模型请求，不是用户每次选；用户选的是档位，ask 卡只展示这一次的 scope 与命令。
    4) 围栏由 effective_reach 派生（rw / ro / ro_tree / net / env），替代 FenceSpec::from_sandbox 的单一路径；
       模块 userdata 写、shell 私有沙箱、主机只读根、网络都成为 reach 的派生结果。
    5) 卡片上的 full 改名为 allow_turn：只表示“本轮不再问”，不改 reach；
       没有可回答前端时 ask 一律 deny；档位与会话的 decision=allow 不改变围栏，只改变 decision。
    6) 角色面不做 all：需要哪些角色就在角色表里显式列全；core_proxy 现在没有真实私有沙箱
       （private 指向 shared、shared_writable=true），要给它执行能力，先设计 proxy 私有沙箱与取产物路径；
       discussant 有私有沙箱但没有 work_pull，shell 只能跑自包含命令，要验证共享文件先补 work_pull。
    7) 权限采用“**根 ceiling + 子会话只收窄**”：
       - 根会话持有上限：四档 profile、reach 集合、decision、共享区路径范围
         （allow_read / allow_write / deny）；
       - 每个子会话可以有一层**收窄覆盖**（路径范围、reach、decision 只能更窄 / 更严）；
         effective = 根 ceiling ∩ 子覆盖；子会话永远不能比根更宽；
       - 路径范围（allow_read / allow_write / deny）只作用于**共享区**
         （work_pull / work_commit / 读共享）；私有沙箱永远全权，构建与临时文件不受子文件夹限制；
       - 典型用法：根“工作区内修改”、allow_write 为空（整棵工作区），
         子 A 覆盖 allow_write=["src/foo"]、子 B 覆盖 ["src/bar"]，work_commit 各拒对方的路径；
       - 子覆盖的“空集合”必须表示“不收窄”或“显式无权限”，不能沿用根的空集合 = 整棵工作区；
         None（不覆盖）与 Some(empty)（显式无权限）要分开，否则子会话会把父级收窄撤销；
       - 父级编辑只更新 ceiling，再与子覆盖求交，**不能覆盖掉子会话的收窄**；
         不拒绝父级编辑；如果父级收窄到与子覆盖无交集，子会话按 no access 处理并如实提示；
       - 子会话 edit 只允许“收窄”；要放宽必须改根 ceiling。当前 edit_session 子会话路径
         只写子会话 sandbox、不回写 owner，且不校验是否收窄；这条要改成“只允许收窄 + 求交”。
    8) 代理的档位要**显式、落盘、可显示**：
       - 建代理时由 user 选四档之一（或专门的“代理”预设），写进 meta；
       - proxy.rs 不再硬编码 granularity=Full；代理会话状态栏 / 配置页显示它实际用的档位；
       - 代理子工作继承根 ceiling；子工作可再收窄；代理自己的私有沙箱在给 shell 前必须先做，
         现在 private=shared、shared_writable=true 不能直接跑 shell。
    9) 档位切换是根级动作，原子传播到整棵子树；有会话在生成时排队到下一次或拒绝，正在执行的调用不追溯。
       审计要记录档位变化（当前 record_config 不含 permissions，要补）。
    10) 同步 settings/meta schema、Web 设置、edit_session、permission API、文档与测试；
        旧字段替换而非叠加；档位切换、子会话继承与 fail-closed 都要有可判定的用例。
  accept: |
    逐工具能表达 reach × decision；四档可切换，且最高档按 reach 命名；
    权限采用“根 ceiling + 子会话只收窄”：子会话不能比根更宽，可表达“每个 agent 只能改共享区某个文件夹”；
    父级编辑与子收窄求交，不覆盖子收窄；子覆盖空集合的语义明确；
    路径范围只作用于共享区，私有沙箱全权；父级收窄到无交集时子会话无权限并提示；
    代理档位显式落盘、状态栏可见，不再硬编码 full；代理子工作继承根 ceiling；
    多 agent 协作共享根 ceiling，各自可再收窄；切换原子传播到整棵子树；
    没有可回答前端时 ask 一律拒绝；正在执行的调用不因切换被追溯改写；
    shell 的 sandbox scope 在“工作区内修改”及以上可自动执行且只可达私有沙箱；
    external scope 在“外部可达（逐次确认）”下每命令 ask，在“全可达（自动放行）”下不问；
    “全可达”仍受全局 network / host_read_roots / deny / 围栏强制等级上限，且 shell 不能写共享区/模块 userdata；
    档位切换、子会话继承、围栏降级、没有前端、工具最大 reach 这几条都有 T1/T2/T3/T5 用例；
    node run-tests.js 全绿。
  blocked_by: |
    缺少实现；reach 集合、四档命名、settings/meta schema 与迁移顺序需在实施时冻结。

- id: vm.windows-macos-guest
  scope: global
  level: T4
  why: |
    当前 fenced guest 执行只承诺 Linux guest 的 /bin/sh；Windows guest 与 macOS guest 的
    guest 内工具 / shell、围栏、agent 通道本期都不开发。macOS 已有 fence.guest-tier-not-wired
    等平台缺口；Windows 没有对应能力。
  how: |
    本期不做；文档与产品状态如实写“不可用”，不把 Windows/macOS guest 当成已支持。
    将来做需要：Windows guest 镜像与 guest 内 agent / 围栏 / PowerShell 通道；macOS 按现有平台缺口补。
  accept: |
    文档、启动报告与界面都如实说 Windows/macOS guest 本期不可用；任何代码路径不声称支持；
    对应的平台缺口保留。将来补齐时另立验收。
  blocked_by: |
    本期不做（用户决定）；macOS 另有平台机制缺口，Windows guest 需要完整的新机制。

