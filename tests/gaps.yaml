# 全局测试与质量缺口（当前状态：条目存在 = 尚未完成；补上后删除条目）
#
# 这里放两类：**长期目标**（存量收敛、目录迁移）与**已确认但尚未实施的产品/机制缺口**。
# 已经能机器判定的门禁不入账。平台与跨平台层的缺口记在
# tests/cross-platform/gaps.yaml 与 tests/<平台>/gaps.yaml（它们决定 TEST-REPORT-ACCEPTED）。

- id: fence.guest-tier-not-wired
  scope: global
  level: T4
  why: |
    虚拟机档的选型、诊断、装配计划与**逐项前置检测**都已就位，但 guest 本体未接入：ExecPlan.packages
    全仓没有任何执行消费点（create_work 只把它打进日志），选 vm 档实际仍按本机档跑。这意味着当前产品
    **不存在**"用户不授权本机写权限也能拿到强隔离"的路径——未授权时文件系统与断网围栏都是关的。
    因为 guest 本体是**所有机器**共同缺的一项，虚拟机档现在一律不可选（exec::tier_readiness），
    界面逐项列出缺什么、每项怎么补。
  how: |
    方向已定（不再讨论）：走**平台原生虚拟化**（Windows 虚拟机平台 / Linux KVM / macOS 虚拟化框架），
    **不内置 QEMU、不随仓库分发镜像**——QEMU 与镜像用户自备，产品只检测与指路
    （设置项 qemu_path 与 base；这样不背 GPL 源码分发义务、仓库也不膨胀）。
    要做的事，按顺序：
    1) 把 guest 抽象成端口（core/ports.rs，与 ToolRunner / FenceHost 同层）：start / exec / stop，
       由适配层按平台实现；core 依旧无 IO。FenceSpec 的 rw / ro 在 guest 内变成挂载，net 变成"给不给网卡"。
    2) 三平台后端各一套：Linux QEMU+KVM；macOS Virtualization.framework；Windows 虚拟机平台 / HCS。
    3) 装配接线：消费 exec::plan 的 packages（prefix 只读共享、system 叠层），会话级一个 guest，
       会话删除时销毁 guest 与它的磁盘（与 --fence-clean 同哲学）。
  accept: |
    在真机上选 vm 档跑一次工具：进程确实跑在 guest 内（可达范围与宿主隔离）；会话删除后 guest 与其磁盘被销毁；
    三平台探针覆盖"guest 可用 / 不可用"两种结论；届时删除本条并同步 PRODUCT.md / RUNTIME_SPEC.md 的当前状态。
  blocked_by: |
    有意推迟（不是缺条件）：guest 相对现有围栏的独特价值只有"不授权本机写权限也能拿到强隔离"一条，
    而代价是三套原生 API、每平台真机验证，且 CI 起不了 hypervisor（只能真机验 + env-skip）。
    项目成熟、需求更清楚时再做。


- id: fence.container-dir-listing-denied
  scope: global
  level: T4
  why: |
    CI run 158 的 windows 上，容器里**列自己的授权落点**被拒：`dir /b`（cwd = 授权叶子）报
    `Access is denied.`（exit 1），而同一个目录里**写文件成功**（`echo x > out.txt` 写下了、报错还被重定向
    进它），`whoami /priv` 显示 `SeChangeNotifyPrivilege` Enabled，叶子上的 ACE 是 `0x1701FF`（含
    FILE_LIST_DIRECTORY）。本机（Windows 11，普通会话）同样操作正常。所以"托管 runner 的容器里列目录走不通"
    是个真实现象，但**根因没有结论**：是 AppContainer 令牌少了什么、还是 cmd 的 `dir` 这类列举在这类环境里
    另走一条路，得再探。影响面：工具要在自己的边界里列产物（`dir`、Python 的 `os.listdir`）就会撞上。
  how: |
    1) 换列举机制再探一次（`for %f in (*)` 这类 FindFirstFile 枚举、或真 python 的 `os.listdir`），
       把"令牌/权限少了什么"与"cmd 的 dir 自身"分开；
    2) 结论若指向缺失的权限或 ACE，就在授权阶段补；否则写进能力报告如实说明；
    3) 结论出来再把 Windows 的往返探针补一条"列自己的产物"的断言。
  accept: 容器里能列出自己授权落点里的产物；或如实说明本环境不支持并列进能力报告。
  blocked_by: 缺少观察面（要换列举机制再探一次）
- id: fence.module-without-userdata-disables-it
  scope: global
  level: T4
  why: |
    模块目录里没有 `userdata/` 时，Windows 的授权阶段读它的 DACL 得 `error 2`，`prepare_fence`
    返回 Err → 产品**整次按无围栏执行**。CI 的 Windows L4 日志逐条可见：
    `[围栏] 授权未完成：读 DACL 失败（…\modules\research\userdata）：错误码 2` → `本次按无围栏执行`，
    真工具那几行的 stderr 也写着"容器围栏不可用，按如实降级继续执行"。
    后果：Windows 上"真工具链在围栏里跑通"的 E2E 结论其实是**无围栏**跑出来的；而围栏派生把
    `<module>/userdata` 无条件放进 `rw`，于是任何没有该目录的模块都会让这次执行失去围栏。
  how: |
    1) 先定契约：`<module>/userdata` 不存在时是"按需建"（它是模块自己的状态区）还是"没有可授的落点，跳过"；
    2) 一个落点授不上不该让整次执行失去围栏——现在 `prepare_fence` 的"不整体失败"注释与
       `if result.is_ok() { result = Err(e) }` 自相矛盾，要一起理清；
    3) 补一条真机用例：模块目录没有 `userdata/` 时工具仍在围栏里跑（或如实说明该模块不可围栏）。
  accept: 模块目录没有 `userdata/` 时，Windows 上工具仍在围栏里跑（或如实说明为何不能），
    E2E 的真工具行不再出现"按无围栏执行"。
  blocked_by: 缺少实现（先定契约）

- id: module.external-harness-fence-reach
  scope: global
  level: T3
  why: |
    MODULE_SPEC 允许把外部 harness 当模块的一个工具（`tools.<名>.command` 指向它的命令行）。
    围栏目前只按运行包放行解释器目录，系统里已安装的 harness 可执行文件是否落在可达范围内
    **没有验证过**；文档已按"开发方向"标注，不能停在"大概能跑"。
  how: |
    1) 写一个把外部命令行 harness 当工具的测试模块（命令落在模块目录内）；
    2) 在授权围栏（`--fence-live`）下跑 T3 真实边界用例，记录可执行文件的可达性结论；
    3) 若不可达，把可执行文件纳入运行包登记或围栏可达范围，再复跑。
  accept: 授权围栏下该模块的工具跑通一次完整往返；或如实写明"必须把可执行文件放进模块目录"并落到文档与登记处。
  blocked_by: 缺少观察面

- id: module.standalone-entry
  scope: global
  level: T5
  why: |
    模块的工具本来就是真命令，用户**完全不经过 AI** 也能自己跑它；但模块**没有声明自己的独立入口**，
    产品也没有把"直接用模块"摆出来——现在模块只经 agent 会话被使用，这条路径没有入口、也没有验收判据。
  how: |
    1) 定契约：模块怎么声明自己的独立入口（`module.yaml` 加一节，例如命令行入口与参数；GUI 同理）；
    2) CLI 加一条"直接用模块"的命令：列出可独立运行的模块并跑它的入口；
    3) GUI 加对应入口（列表 + 运行 + 看回执），与 CLI 共用同一份事实（清单是目录扫描的纯函数）；
    4) T5 走一遍：不开 AI 会话，直接用模块跑一次，产物落在用户指定目录。
  accept: 声明了独立入口的模块能不经 AI 直接跑通一次；没声明的模块在列表里如实标注"只能经 AI 使用"。
  blocked_by: 缺少实现

- id: work.commit-history-ui
  scope: global
  level: T5
  why: |
    共享区的提交记录与"任一提交点可还原"的机制已就位（`work_status` 能看到最近提交），但用户没有入口
    去浏览提交历史或把共享区回滚到某个提交点——只能在会话里由 agent 看到状态。
  how: |
    1) CLI / Web 各加一个入口：列出某工作的提交（id / 作者 / 时间 / message / 改动清单）；
    2) 选中一个提交点给出"回滚共享区到此处"的动作（调 `Workspace::work_restore`，走现有入站契约）；
    3) 回滚要留可回放的记录，并与回档标记模型对齐（提交锚见 docs/session/session-model.md 的五）。
  accept: 用户能在界面上看到提交历史，并把共享区回滚到任一提交点；回滚后新开的 agent 拉取到的是那一点的内容。
  blocked_by: 缺少实现（呈现面未接入）

- id: actions.single-call-language
  scope: global
  level: T5
  why: |
    项目承诺「双门同源」（PHILOSOPHY.md 的目标承诺 2 与判据）：一个能力，人直接执行它、
    agent 经契约调用它，用的是同一份声明。该承诺目前只在**模块**上成立；核心自己的动作
    （建会话、确认关卡、停止/继续、回档、改需求、设置）仍是两套词汇与两处授权——用户侧是
    Action / Ops 与前端按钮，agent 侧是 systools/tools.yaml 的系统工具，同一语义因此有两条实现
    （例如建会话的 create_work 与 proxy_create）。
  how: |
    1) 把工具总表推广成**动作表**：每条动作同时声明参数契约与 callers（user / 角色）；
    2) 动作分发归 conductor（它已拥有 Action）；模型侧 ToolHandler 与呈现侧 Ops 命令各做一个适配器；
    3) 参数校验、授权（带 caller 身份）、执行、审计各只有一处；
    4) 一个声明两种呈现：模型侧文本、UI 侧结构化；读取/视图与事件流保持独立，不塞进动作；
    5) 以 module.standalone-entry 作为第一个验收场景：用户不经 AI 直接调用模块工具。
  accept: |
    至少「建会话」与「一个模块工具」两个动作，在 CLI 与 Web 上由用户调用、在会话里由 agent 调用，
    走同一份声明、同一处授权、同一条审计记录；两侧呈现不同而事实同源；用户不经 AI 能直接用模块工具。
  blocked_by: 缺少实现
