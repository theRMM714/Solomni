# 全局测试与质量缺口（当前状态：条目存在 = 尚未完成；补上后删除条目）
#
# 这里放两类：**长期目标**（存量收敛、目录迁移）与**已确认但尚未实施的产品/机制缺口**。
# 已经能机器判定的门禁不入账。平台与跨平台层的缺口记在
# tests/cross-platform/gaps.yaml 与 tests/<平台>/gaps.yaml（它们决定 TEST-REPORT-ACCEPTED）。

- id: fence.guest-tier-not-wired
  scope: global
  level: T4
  why: |
    虚拟机档的选型、诊断、装配计划与**逐项前置检测**都已就位，但 guest 本体未接入：ExecPlan.packages
    全仓没有任何执行消费点（create_work 只把它打进日志），选 vm 档实际仍按本机档跑。这意味着当前产品
    **不存在**"用户不授权本机写权限也能拿到强隔离"的路径——未授权时文件系统与断网围栏都是关的。
    因为 guest 本体是**所有机器**共同缺的一项，虚拟机档现在一律不可选（exec::tier_readiness），
    界面逐项列出缺什么、每项怎么补。
  how: |
    方向已定（不再讨论）：走**平台原生虚拟化**（Windows 虚拟机平台 / Linux KVM / macOS 虚拟化框架），
    **不内置 QEMU、不随仓库分发镜像**——QEMU 与镜像用户自备，产品只检测与指路
    （设置项 qemu_path 与 base；这样不背 GPL 源码分发义务、仓库也不膨胀）。
    要做的事，按顺序：
    1) 把 guest 抽象成端口（core/ports.rs，与 ToolRunner / FenceHost 同层）：start / exec / stop，
       由适配层按平台实现；core 依旧无 IO。FenceSpec 的 rw / ro 在 guest 内变成挂载，net 变成"给不给网卡"。
    2) 三平台后端各一套：Linux QEMU+KVM；macOS Virtualization.framework；Windows 虚拟机平台 / HCS。
    3) 装配接线：消费 exec::plan 的 packages（prefix 只读共享、system 叠层），会话级一个 guest，
       会话删除时销毁 guest 与它的磁盘（与 --fence-clean 同哲学）。
  accept: |
    在真机上选 vm 档跑一次工具：进程确实跑在 guest 内（可达范围与宿主隔离）；会话删除后 guest 与其磁盘被销毁；
    三平台探针覆盖"guest 可用 / 不可用"两种结论；届时删除本条并同步 PRODUCT.md / RUNTIME_SPEC.md 的当前状态。
  blocked_by: |
    有意推迟（不是缺条件）：guest 相对现有围栏的独特价值只有"不授权本机写权限也能拿到强隔离"一条，
    而代价是三套原生 API、每平台真机验证，且 CI 起不了 hypervisor（只能真机验 + env-skip）。
    项目成熟、需求更清楚时再做。

- id: module.external-harness-fence-reach
  scope: global
  level: T3
  why: |
    MODULE_SPEC 允许把外部 harness 当模块的一个工具（`tools.<名>.command` 指向它的命令行）。
    围栏目前只按运行包放行解释器目录，系统里已安装的 harness 可执行文件是否落在可达范围内
    **没有验证过**；文档已按"开发方向"标注，不能停在"大概能跑"。
  how: |
    1) 写一个把外部命令行 harness 当工具的测试模块（命令落在模块目录内）；
    2) 在授权围栏（`--fence-live`）下跑 T3 真实边界用例，记录可执行文件的可达性结论；
    3) 若不可达，把可执行文件纳入运行包登记或围栏可达范围，再复跑。
  accept: 授权围栏下该模块的工具跑通一次完整往返；或如实写明"必须把可执行文件放进模块目录"并落到文档与登记处。
  blocked_by: 缺少观察面

- id: module.standalone-entry
  scope: global
  level: T5
  why: |
    **模块工具现在可以直接跑**（动作 id = `module.<模块id>.<工具名>`：CLI `module …`、Web `POST /api/actions/…`），
    但那只是**工具级**入口：只写 `system`、不声明 `tools` 的模块仍没有独立入口，界面也没有"直接用模块"的清单与回执。
    缺的是**模块级**契约（谁可独立运行、跑什么）与呈现面（列表 + 运行 + 看回执）。
  how: |
    1) 定契约：模块怎么声明自己的独立入口（`module.yaml` 加一节：不写 tools 的模块也能被直接跑）；
    2) CLI 补模块级入口（工具级已有）；
    3) GUI 加对应入口（列表 + 运行 + 看回执），与 CLI 共用同一份事实（清单是目录扫描的纯函数）；
    4) T5 走一遍：不开 AI 会话，直接用模块跑一次，产物落在用户指定目录。
  accept: 声明了独立入口的模块能不经 AI 直接跑通一次；没声明的模块在列表里如实标注"只能经 AI 使用"。
  blocked_by: 缺少实现

- id: work.commit-history-ui
  scope: global
  level: T5
  why: |
    共享区的提交记录与"任一提交点可还原"的机制已就位（`work_status` 能看到最近提交），但用户没有入口
    去浏览提交历史或把共享区回滚到某个提交点——只能在会话里由 agent 看到状态。
  how: |
    1) CLI / Web 各加一个入口：列出某工作的提交（id / 作者 / 时间 / message / 改动清单）；
    2) 选中一个提交点给出"回滚共享区到此处"的动作（调 `Workspace::work_restore`，走现有入站契约）；
    3) 回滚要留可回放的记录，并与回档标记模型对齐（提交锚见 docs/session/session-model.md 的五）。
  accept: 用户能在界面上看到提交历史，并把共享区回滚到任一提交点；回滚后新开的 agent 拉取到的是那一点的内容。
  blocked_by: 缺少实现（呈现面未接入）

- id: fence.no-silent-fence-degradation
  scope: global
  level: T4
  why: |
    围栏授权只要有一处落点写不进（`prepare_fence` 返错），这次工具调用就按**无围栏**执行——不拒绝、
    也不问用户，回执里只有一行提示。真机触发点：把 node 装在系统目录下的机器（nvm4w 把解释器放在
    `C:\nvm4w\nodejs`，属主 Administrators、只给 Authenticated Users Modify），解释器目录的 ACE 写不进，
    于是**任何** node 工具都静默变成无围栏跑。这是"一个环节有问题就整体降级"，而且用户无感知。
  how: |
    1) 先定判据：哪些落点是**必要**的（解释器目录、模块目录、cwd、私有沙箱——缺了这次命令跑不了或围栏不成立），
       哪些是**可选**的（用户显式授权的只读根、不存在的 userdata 等）。可选落点授不上只记事实，不牵动整次执行。
    2) 必要落点授不上时不许降级：接入统一裁决通道（见 `session.unified-decision-channel`），
       推一条"这一环装不上、原因是什么"的消息 + 选项 {本轮无围栏跑一次 / 放弃这次调用}；没有回答或拒绝 = 不执行。
       必要落点缺的是**解释器**时，"无围栏跑一次"要如实说明这次会连容器都不装。
    3) 回执把"这一环为什么装不上"写成可操作的一句（哪个目录、缺什么前提、怎么补），并按需经
       `SessionEvent::Notice` 送达用户面，而不是只给模型看。
  accept: |
    真机构造一次必要落点授不上：工具调用必须被**拒绝**或**弹裁决**，绝不静默无围栏执行；用户选"本轮无围栏"时才跑，
    且这次执行在转录与回执里如实标为无围栏；可选落点授不上不影响围栏成立。届时删除本条并同步文档。
  blocked_by: 缺少实现（要先定"必要落点"判据与裁决卡文案契约，跨 kernel / tools / 呈现三处）

- id: fence.node-entry-scope-unreachable
  scope: global
  level: T4
  why: |
    跳过 realpath 只解决 node 启动的第一段。主模块**格式判定**还会逐级向上找最近的作用域配置
    （`shouldUseESMLoader` → 就近 package.json），容器里够不到的祖先会让它直接判死：
    `ERR_INVALID_PACKAGE_CONFIG: Cannot read package config <祖先>/package.json: operation not permitted`，
    进程照样起不来。真机实测：模块根不带 package.json 的 .js 入口一路向上，到用户主目录那一级就报错；
    模块根带一份 `package.json`（或入口用 .cjs/.mjs）时它走到模块根就停，往返就通。
    **CI 现在绿不代表这条不存在**：runner 的祖先目录恰好不拒绝——换机器、换工作区布局就会翻出来。
  how: |
    1) 定契约：node 模块的入口作用域要能被容器读到（模块根带 package.json，或入口用 .cjs/.mjs）——
       写进 MODULE_SPEC 与模块模板，并在 e2e 的真模块（render）上落实。
    2) 加 T4 探针两种形态：带 package.json（预期跑通）与不带的 .js 入口（预期给出可读、可据以改模块的失败结论），
       两边的结论都进能力报告——别把"布局恰好能过"当成"容器里 node 能用"。
    3) 再评估"少一层契约"是否可行：入口作用域能不能进围栏的授权面（例如把模块根的 package.json 当运行基线），
       或由产品在沙箱里兜一份只读的包作用域——两条都要先量真机。
  accept: |
    真机上两种形态都有结论：带 package.json（或 .cjs/.mjs）的 node 模块工具在容器里跑通一次完整往返；
    不带的给出可读原因（而不是 ERR_INVALID_PACKAGE_CONFIG 原话）；契约与文档同步。
  blocked_by: 缺少实现（先定模块契约：入口作用域由模块自带，还是由围栏兜住）

- id: session.unified-decision-channel
  scope: global
  level: T2
  why: |
    现在"要问用户"有三套并存：kernel 的 `ApprovalRegistry`（内存、只服务工具确认）、session 的 `Pending`
    （请教 / 代拟确认 / 开工确认 / 方案待审 / 验收没过）、以及**底层想问问不了**的一类（围栏、以及今后任何
    需要 yes/no 的机制）。工具确认的 pending 与 `Pending` 只是"约定同一份事实"（硬编码 kind 字符串），
    取数口（`sessions.pending()` 与 `sessions.pending_approval()`）与回答动作（`answer`/`decide` 与
    `approve_tool`）各一套。抽象该收口：任何需要用户裁决的 yes/no 都走同一条通道，而且**必须阻塞**。
  how: |
    通道的形状（端口只管推、不管内容）：`ask(信封, 消息, 选项集) -> 选项 id`。
    - **端口**只负责：登记一条 pending、把消息与选项**原样**送出、阻塞等待、把用户选中的**选项 id** 还给调用方。
    - **前端**只按"标题 / 正文 / 选项 / 详情"渲染，不认识内容，也不解释选项含义。
    - **具体问什么、有几个选项、每个选项做什么，由调用方（底层）实现**：调用方按拿到的 id 自己执行行为。
    落地要点（缺一条这条通道就不成立）：
    1) 选项带**稳定 id**（行为靠 id 映射，文案只用于渲染）；选项可带 `recommended` 与 `disabled + reason`，
       且**不允许出现"唯一可选项被禁用"**的假选择。
    2) 回答**落盘成转录事件**（谁答的、何时、选了哪个 id、附言），重启后从转录重建 pending、答案幂等；
       已答过的不得重问。
    3) 终止只有三件：用户回答 / 用户按停止（解成**拒绝**，不是放行）/ 会话被删除。**不设超时**——不点不继续。
    4) 同一会话的 pending 语义要定清：今天是一个会话一格（`collab_pending` 返回 `Option`），协作里两席
       同时要问会互相覆盖；改成队列并让"谁在等"在界面上可见。
    5) 无回答者的场景（CLI 非交互、e2e、代理链）要有明确收场：默认 **fail-closed（拒绝）**，允许调用方
       显式声明策略；e2e 的假供应商按新 kind 作答。
    6) 回答要**校验选项 id 属于当时那张卡的选项集**（防旧卡的答案被用来放行新的请求）。
    7) 保持 `Pending::decision_parts` 的"唯一派生"：它升级为产出"消息 + 选项"，推的 `Decision` 事件与快照
       都仍只从这一处来，不做第二真相。
  accept: |
    工具确认、方案待审、围栏必要落点不可用三类都用同一条通道提问并阻塞；重启后卡与答案不丢（不重问已答的）；
    非交互场景按声明策略收场且默认拒绝；回答 id 越界会被拒；旧的两套取数口与回答动作删除，Web 与 CLI 同形。
    届时删除本条并同步 docs/session/session-model.md 与 docs/permission/README.md。
  blocked_by: 缺少实现（跨 kernel / session / tools / 呈现四处，先定契约再落地）

- id: fence.manual-ledger-restore
  scope: global
  level: T4
  why: |
    台账（`.home/fence-grants.json`）里存着两类可还原的东西：产品**根内**路径的原始安全描述符快照、
    **根外**落点的授权摘要。但用户手上只有一个"一把梭"的隐藏模式 `--fence-clean`：它按台账整体还原、
    精确撤销、再扫孤儿与 profile，**没有"先看清单"和"只还原其中一条"**。所以想单独还原某一处、其余不动，
    或只想核一眼现在挂着什么，都只能整体执行——代价与风险都由用户承担。
    更硬的一处：**根外、且台账已丢的残留没有入口**（孤儿清扫明文只扫产品根内）——本次真机就撞到过一条，
    只能手工用系统工具撤。
  how: |
    1) 加查看入口（机器可读优先）：列出台账现值——快照（路径 + 时间）、根外授权条目（SID/路径/权限位）、
       容器 profile，以及"当前实际 ACE 与台账对不对得上"的差异。
    2) 加按条还原入口：按**路径**还原快照、按**条目**撤销根外授权、按名删 profile；未指定的条目不受影响。
    3) 给"无台账的根外残留"一个**显式**入口（按 SID + 路径撤一条 ACE），并如实报告它不在台账里。
    4) 与 `--fence-clean` 的关系写清：那个是"整体收尾"，新入口是"按条处置"；两者共用同一份台账与同一套
       ACE 读法（`acl.rs` 的 `ace_parts`），不许各写一份。
  accept: |
    真机上留一处快照与一条根外授权：用户只用命令行就能看到清单，并把其中**任意一条**还原/撤销，
    其余条目与整份 DACL 不受影响（事后 ACE 集合与备份一致）；无台账的根外残留也能按 SID+路径撤掉并如实标注。
  blocked_by: 缺少实现（先定"按条处置"的入站契约与呈现形状）

- id: fence.no-startup-reconcile
  scope: global
  level: T4
  why: |
    授权只在两处释放：会话释放/删除（`conductor/service/history.rs` 与 `work.rs` 各一处），以及用户手动跑
    `--fence-clean`。**启动时不按台账对账**：进程被杀、或释放前崩溃，残留就挂在那里——根内还有一层反向兜底
    （按本程序建过的 profile SID 与显式 `S-1-15-2-*` 允许 ACE 扫），**根外只能靠台账，而没人去读它**。
    这与"授权都能还原"的承诺之间差一段：账在、能力在，缺的是启动时那一次对账。
  how: |
    1) 装配期（产品根已知、会话尚未开工）按 `.home/fence-grants.json` 对账一次：根内快照还原、根外精确撤销、
       清掉本程序建过的 profile。
    2) 先解决"哪些条目算陈旧"：台账条目要能带上**归属**（会话 / 进程标识 / 时间戳），否则多实例或并发会话
       正在用的授权会被误回收。这一条定不下来就不要做自动回收。
    3) 对账结果与失败都要如实报（不能静默），失败时给"重试 / 稍后"的选择——走统一裁决通道（见上一条）。
  accept: |
    真机上把一次运行杀在释放之前：下次启动必须自动回收那些陈旧授权（或如实报出并提供手动入口），
    且**不影响**同时在跑的会话的授权；对账前后 DACL 与备份一致。
  blocked_by: 缺少实现（先定"条目归属"字段，避免误回收在用的授权）
