# 全局测试与质量缺口（当前状态：条目存在 = 尚未完成；补上后删除条目）
#
# 这里放两类：**长期目标**（存量收敛、目录迁移）与**已确认但尚未实施的产品/机制缺口**。
# 已经能机器判定的门禁不入账。平台与跨平台层的缺口记在
# tests/cross-platform/gaps.yaml 与 tests/<平台>/gaps.yaml（它们决定 TEST-REPORT-ACCEPTED）。

- id: module.acp-adapter
  scope: global
  level: T3
  why: |
    「常驻服务」目前只实现了 MCP stdio 适配器（`residents/detail/mcp.rs`）：`module.yaml` 的
    `services.<名>.adapter` 写 `acp` 会被如实拒收（未知适配器）——ACP（Agent Client Protocol）这类
    按行 JSON-RPC 的 harness 拉不起来，MCP 之外的常驻服务对模块作者不可用。
  how: |
    1) 定 ACP 的握手 / 方法 / 回执映射：能共用长驻会话端口 `SessionHost` 与按行收发就共用，
       不另造机制；协议形状只进 `residents/detail/` 的适配器，kernel 与 service 不认识 ACP；
    2) 组合根注册该适配器（与 `mcp` 并列，`ServiceAdapter::id()` = `acp`）；
    3) 契约用例（脚本化会话端口）+ 真实服务端到端（自足 fixture，缺依赖时如实 env-skip）；
    4) 同步 docs/residents/README.md、docs/testing/doubles.md 端口矩阵、MODULE_SPEC。
  accept: |
    声明 `adapter: acp` 的模块能拉起、发现操作、调用并看回执；未知适配器仍如实列出可用名；
    `node run-tests.js` 全绿。
  blocked_by: 缺少实现

- id: work.large-asset-transfer
  scope: global
  level: T3
  why: |
    共享区已按字节资产、流式 IO 与 64 MiB 单文件上限收口：普通图片 / 视频 / 二进制能拉取、提交、
    看三方与显式选边；超过上限的单文件会被明确拒绝。但更大的资产（长视频、整包镜像、归档）
    仍没有存储级分块、可续传上传或分块校验；上传入口仍走 base64 一次性请求，峰值内存随文件线性上升。
    这部分要动提交树 / 对象格式 / 恢复事务与上传协议，不能靠调大常量解决，因此单独记为缺口。
  how: |
    1) 定分块资产格式：提交树里大文件用清单（chunk 列表）而不是单对象；对象仍内容寻址，GC / 恢复 / 物化
       按清单可达集合处理。
    2) 读路径：pull / versions / restore 按 chunk 流式拼装；versions 只读清单与预览窗口。
    3) 写路径：commit 支持按清单登记；上传改为流式 / 可续传（不再 base64 整包），并保留单文件与本次总量上限。
    4) 契约与验收：超大资产能进入共享区并被另一 agent 拉取、提交、显式选边；内存不随文件大小线性增长；
       补 T2 / T3 / T5 用例（含中断恢复与 GC 可达性）。
  accept: |
    超过当前单文件上限的资产有分块 / 可续传路径，能 pull、commit、显式选边并恢复；
    读写内存有界；上传中断可续传；node run-tests.js 全绿。
  blocked_by: 缺少实现（当前只有流式 IO 与 64 MiB 上限；分块存储 / 可续传上传未实现）

- id: work.tests-in-shared
  scope: global
  level: T3
  why: |
    共享区是主副本，权限模型里沙箱是唯一可写面（私有沙箱 rw、模块目录 ro、共享区不授 ACL），
    因此 agent 在共享区上跑测试现在做不到：测试要在共享区就地读到**未提交**的依赖，shell 的
    围栏只有私有沙箱（外加只读的模块目录与主机只读根），看不到共享区。
    把共享区整个拷进沙箱再测与"让 agent 把共享区拉下来"等价，没有意义，所以否决该路径。
    结论是不给共享区授 ACL，改由「容器内回环中继」解决：Windows 侧已落地并真机通过
    （`tests/windows/probes/container.rs` 的 `container_reaches_listed_host_ports_through_the_relay`），
    但 `test_shell`（在共享区就地跑测试的入口）与 Linux / macOS 的回环中继仍未实现，记为缺口。
  how: |
    1) Windows 中继已实现（`src/kernel/detail/container/windows/relay.rs`）：容器内 bind `127.0.0.2:<端口>`，
       宿主按端口清单 dial `127.0.0.1:<端口>`，两侧用继承的匿名管道传帧，不走网络。
    2) 端口清单在**宿主侧**校验；产品自己的端口按「监听者 pid 在本产品进程树里」判、不靠端口表
       （转录中心 3081、QGA 随机端口、SMB 助手 45678 由此自动覆盖），容器里表现为连接被关。
    3) 边界：先只做 TCP + 127.0.0.1；UDP 与 ::1 需各自再加中继。
    4) 下一步：Linux / macOS 各自的端口级回环（netns 能只留 lo 且精确到端口，seatbelt 没有端口维度）。
    5) 新增 `test_shell` 工具作为共享区测试入口（跑「不改被跟踪文件」的测试；
       改 tracked 文件走写后校验 + 回滚 + 回执）。
  accept: |
    在共享区目录上能跑起一个需要本地端口的测试（自起服务自连经中继），且共享区不产生任何按会话 ACL；
    产品端口与 QGA / SMB 端口在容器内仍不可达；node run-tests.js 全绿。
  blocked_by: 缺少实现（test_shell；Linux / macOS 的回环中继；Windows 中继已落地）

- id: vm.windows-macos-guest
  scope: global
  level: T4
  why: |
    当前 fenced guest 执行只承诺 Linux guest 的 /bin/sh；Windows guest 与 macOS guest 的
    guest 内工具 / shell、围栏、agent 通道本期都不开发。macOS 已有 fence.guest-tier-not-wired
    等平台缺口；Windows 没有对应能力。
  how: |
    本期不做；文档与产品状态如实写“不可用”，不把 Windows/macOS guest 当成已支持。
    将来做需要：Windows guest 镜像与 guest 内 agent / 围栏 / PowerShell 通道；macOS 按现有平台缺口补。
  accept: |
    文档、启动报告与界面都如实说 Windows/macOS guest 本期不可用；任何代码路径不声称支持；
    对应的平台缺口保留。将来补齐时另立验收。
  blocked_by: |
    本期不做（用户决定）；macOS 另有平台机制缺口，Windows guest 需要完整的新机制。

- id: vm.guest-root-image-shared-artifact
  scope: global
  level: T4
  why: |
    两平台的 guest 虚拟根目前是两条独立链路：Linux 走 `guest-rootfs` 多步构造（cloud 镜像 tar → sfdisk/dd
    切 rootfs.ext4 → debugfs rdump → 按需装通用内核（cloud 内核没编 CONFIG_NET_9P）→ 装 qemu-guest-agent →
    清 fstab 与 remount 单元、补 9p/virtio 模块 → 生成 initrd → unshare -r + mke2fs -d 打包）；Windows 走
    `guest-disk` 单文件直下 Debian cloud qcow2，首启靠 cloud-init 联网装 qemu-guest-agent，再在维护启动里
    刷 apt 装 python3 / cifs-utils / C-C++ 与固定版本 Node，逐个自证后写回 `guest.yaml`。
    后果：Windows 首启依赖网络与 cloud-init 时序（失败即整档不可用）；两份产物无法互相验证；镜像基线按
    2.3 GB 构造、used 约 800 MB，其中完整 Debian 里产品用不到的部分约 300–500 MB。`debian:13-slim`
    （78 包，无内核 / 无 init 本体 / 无 systemd / 无 qemu-guest-agent）能减掉这部分，但它本身当不了 VM 根，
    只能作构建输入。
  how: |
    1) 去 cloud-init：仍以 cloud 镜像为构建输入，chroot 装 qemu-guest-agent 并 disable cloud-init 单元，
       首启不再联网、不再走 cloud-init 时序。这一步与换 slim 正交，收益最大。
    2) CI 构建一次、两平台消费同一产物：Linux runner 产出 rootfs.ext4 + 通用内核 + initrd 并发布为发布资产；
       Windows 侧改用 `-kernel` 直启消费同一份，删除 `guest-disk` 单文件 qcow2 与"首启装 qga + 刷 apt 装
       运行时"整条链；`dependencies.yaml` 的 probe 与 `docs/provision/README.md` 的基线同次改。
    3) 换 `debian:13-slim` 作构建输入单独度量：内核、init、qga、cifs-utils、python3、node 仍要装，只减少
       base 里用不到的部分（预期镜像 2.3 GB → 约 1.9 GB，非量级变化），先量后定，不先换基线。
    4) Windows 本地不造 ext4（无 unshare / mke2fs，且发行版是纯 Rust 不装环境），构造只在 CI 的 Linux 侧。
  accept: |
    两平台用同一份 guest 产物（同一 sha256）起 VM；Windows 首启不联网、不跑 cloud-init，guest 内 python3 /
    node / gcc / cifs-utils 均可用并自证写回 `guest.yaml`；镜像与 used 体积有量化对比；`node run-tests.js`
    全绿，guest 相关 T4 探针在 Linux 与 Windows 上都通过。
  blocked_by: |
    需要 CI 产物发布通道与 Windows 侧 `-kernel` 直启路径（当前均未实现）；slim 的净收益要等内核 / init /
    qga 补齐后实测。

- id: release.binary-distribution
  scope: global
  level: T5
  why: |
    产品承诺"发行版二进制为纯 Rust，用户开箱即用，不装环境"，但仓库里没有任何发布链路：没有 release 工作流
    （`.github/workflows` 只有 test / pins / mutants），没有打包脚本，也没有"拿到二进制怎么跑"的说明。现实里唯一的
    入口是 `node start.js`——它要先有 Rust 才能构建核心，所以"用户"目前等于开发者。
    还有一件未决的事是**构建口味**：CI 借 Windows runner 自带的 msvc 工具链，而项目内安装的（`env.js` 的
    `installRust`、`setup-dev.js`）统一是 GNU。若发行产物由 msvc 产出，"本机绿"与发行版就不是同一套编译器 /
    CRT / 链接器行为（raw-dylib、FFI 与 CRT 交互都在其中）；反过来 GNU 产物需要实测不依赖 MinGW 运行时 DLL。
  how: |
    1) 定发行口味并让 CI 与本地一致：选 msvc 则发行构建机必须有 VS C++（开发者不必装），选 GNU 则 Windows 构建机
       要备 GNU 工具链 + winlibs，并实测产物不依赖 libgcc_s_seh-1.dll / libwinpthread-1.dll，核对默认 CRT 静态性；
    2) 加 release 工作流：三平台 `cargo build --release` + 打包（二进制 + `modules/` 布局）+ 校验和；
    3) 写"二进制用户"文档（不需要 Node / Rust / `start.js`），与 README 现在的"运行环境 / 开发环境"两层对齐或替换；
    4) 验收：在一台**没有** Node、Rust、VS 的干净机器上解包即跑。
  accept: |
    三平台各有可下载的发行产物与校验和；干净机器（无 Node、无 Rust、无 VS）解包即能启动；
    构建口味与 CI 一致且有记录；README 的安装与运行一章只描述真实存在的两条路径。
  blocked_by: |
    本期不做（用户决定：仍在开发阶段）。发行链路与口味统一需要新建 CI 工作流与打包脚本，另立任务。

- id: portable-setup.posix
  scope: global
  level: T3
  why: |
    `--setup=path` 本批只在 Windows 上改用户 PATH（HKCU\Environment）并生成 `bin/solomni.cmd`；
    POSIX 上只打印「把 <产品根>/bin 加进 shell 的 PATH」的指引，不写 shim、不改 shell rc，
    因此 Linux / macOS 用户仍需手工配置便携入口。
  how: |
    1) 生成 POSIX shim（`bin/solomni`，固定 `--root <规范化绝对根>`，带可执行位）；
    2) 按 shell 探测写 rc 片段（bash / zsh / fish 分别处理：写前备份、分段去重、可 undo），
       或只打印一段可复制的 export 指引并让用户确认；
    3) 状态与退出码与 Windows 对齐（path / unset / undo / status）；
    4) 补 T3 用例：rc 片段幂等、备份还原、非交互 shell 不误报。
  accept: |
    非 Windows 上 `--setup=path` 能生成可执行的 `bin/solomni` 并按用户确认写入或提示 rc；
    `--setup=status` 如实报告 shim 与 PATH 事实；`unset` / `undo` 幂等且可还原。
  blocked_by: 本批范围决定（POSIX 只打印指引，见 PR #80 的「明确不做」）

- id: test.real-machine-behavior
  scope: global
  level: T4
  why: |
    Windows 宿主的真机面已收进旅程：`vm` 段覆盖 guest 内工具与 shell、外部工作区往返（含 UNC 共享根）、
    guest 诊断列出 guest 里的后台进程、按「停止」后 guest 不留残留进程、删会话销毁 guest 不动外部根；
    `parent-death` 段覆盖核心被强杀后常驻服务跟着消失。
    剩下三件只有 Linux 宿主能验，Windows 侧落的是 `rootfs.qcow2`，看不到 `rootfs.ext4`：
    4K 块镜像、特权位与属主回填、virtiofs / 9p 两种挂载变体。
  how: |
    1) 4K 块与属性：Linux 上先 `reset_guest`，再读 `rootfs.ext4` 的超级块
       （magic `0xEF53` 在 1024+0x38，块大小 `1024 << log_block_size` 在 0x18，必须 == 4096），
       用 `debugfs` 查 `mode/uid/gid`（`/usr/bin/sudo` 4755、`/usr/bin/ssh-agent` 2755、
       `/etc/shadow` 640 gid 42、`/tmp` 1777、`/var/mail` 2775 gid 8）。
    2) 挂载变体：Linux 宿主上带 `SOLOMNI_VM_VIRTIOFSD` 与 9p 共享根各跑一次 `--journey=vm`。
    3) 缺环境一律记 `env-skip`，不写成通过（`docs/testing/execution-ci.md` 的「虚拟机档与真机行为（本地 opt-in）」）。
  accept: |
    上述三件各有一条 Linux 宿主上的可重跑证据（记在 PR 或平台账里）；
    `node run-tests.js --audit=structure` 与 `--docs` 全绿。
  blocked_by: 需 Linux 宿主的 KVM 与 e2fsprogs（debugfs），CI 不具备

- id: tools.fence-boundary-note-trigger
  scope: global
  level: T3
  why: |
    回执不再声称失败原因：围栏拒绝发生在工具子进程内部（ACL / Landlock / seatbelt / 容器 SID），
    守门进程只看得到退出码与被本地化的 OS 文案，任何平台都没有「本次确被围栏拒绝」的机器可读事实，
    因此回执只交退出码与信号（`shell.exit` / `shell.signal` 等稳定码），可达范围与网络状态只进
    工具行的结构化事实（`ShellFacts`，`src/capabilities/tools/domain/shell.rs`），界面可见、模型不可见。
    代价是**模型侧没有可靠信号**：围栏里的越界失败与普通失败在模型眼里一样，
    模型不会知道「可达哪里」；直接补固定提示会退回「任何非零退出都像越界」的老问题。
  how: |
    1) 找平台侧的带外信号：Linux 的 seccomp user notification / fanotify / audit，Windows 的 ETW ACL 拒绝事件，
       macOS 的 seatbelt 拒绝日志（`log stream` 的 sandbox 子系统）；只取「本次 pid 的拒绝」这一事实；
    2) 守门进程把它表达成回执说明的稳定码（例如 `fence.denied`，参数只放路径类别，不放人读句子）；
    3) 只有拿到该码时才在生产回执里附「可达范围」说明，普通非零退出保持现状；
    4) 补用例：普通非零退出不带该说明、真越界带该说明；平台证据记在 `tests/<平台>/gaps.yaml`。
  accept: |
    沙箱里一次真实的范围外读写被拒时，模型回执带 `fence.denied` 说明（含可达范围）；
    普通非零退出不带该说明；`cargo test --bin solomni` 与 `node run-tests.js` 全绿。
  blocked_by: |
    需要平台带外信号（seccomp notif / ETW / seatbelt 日志）；当前机制层只有退出码与输出

- id: tools.unix-fence-degrade-text-only
  scope: global
  level: T3
  why: |
    Windows 的「本轮无围栏跑」由外层 `platform::prepare` 判定，外层看得到，回执能把轻重提成 warning
    并带上裁决文案（`src/kernel/detail/process.rs` 的 `unfenced_note`）。Linux / macOS 的如实降级发生在
    守门进程内部（`src/kernel/detail/confine/linux.rs` 的 `run_fenced` 只往 stderr 打一行
    「[围栏] …：按如实降级继续执行」），外层拿不到结构化事实：退出码为 0 时回执是 `shell.exit` 的 info，
    界面上看不出这次是降级跑的，那行中文也只混在正文里。
  how: |
    1) 守门进程在降级执行时输出机器标记（与 `FENCE_FAILED` 同族的固定退出码或固定 ASCII 前缀），标明缺哪一项；
    2) 外层装配回执时把它翻成稳定码（例如 `fence.degraded`），轻重提成 warning，正文不再混入守门进程的散文；
    3) 用例：强制策略且机制可装时不带该码；允许降级且机制不可用时带该码（平台用例进 `tests/<平台>/`）。
  accept: |
    unix 上降级执行的回执带 `fence.degraded` 说明且轻重为 warning；未降级时不带；
    守门进程不再往正文里写散文；`node run-tests.js` 全绿。
  blocked_by: 缺少守门进程侧的信号（当前只回退出码与输出）

- id: receipt.business-text
  scope: global
  level: T3
  why: |
    只有 shell 与围栏的结束说明迁成了稳定码（`src/kernel/contracts/note.rs` 的 `codes` + `locales/zh-CN.ftl`）。
    其余会进模型上下文或界面的文案仍是硬编码中文：能力层的业务句（`core_rows` 的「工具 X → 成功/失败」、
    信封修复的 `[信封修复] …`、VM 传输护栏的「[截断] 输出共 N 字符」、共享区拒绝与各工具的错误句）、
    内核的机制句（`SandboxMode::check` 的错误、`FenceVerdict` 的裁决文案、PowerShell 包装脚本的定位失败提示）
    与守卫进程的 `eprintln!` 日志。换语言时这些不会变。
  how: |
    1) 按域补码：能力层用 `tools.*` / `work.*` / `collab.*`，机制用 `sandbox.unavailable` / `fence.refused`；
    2) 文案进 `locales/<lang>.ftl`，代码只留码与类型化参数（内核受 R6 约束，本就不该构造业务文案）；
    3) 日志走开发者通道：固定源语言或只留码与结构化字段，不进语言目录；
    4) 逐域补用例：码有目录、参数类型化、渲染形状稳定（沿用 `src/kernel/detail/i18n.rs` 的 `catalog_covers_every_code` 判据）。
  accept: |
    上述位置不再有硬编码中文；模型通道按源语言、界面按当前语言渲染同一组码；日志只有码与字段；
    `node run-tests.js` 全绿。
  blocked_by: |
    本轮范围决定（先收口回执分级与 shell/fence 说明；业务与内核文案按域分批）

- id: ui.text-catalog
  scope: global
  level: T2
  why: |
    回执说明已按稳定码走 `locales/<lang>.ftl`（`src/kernel/detail/i18n.rs`），Web 只按 `/api/state` 的
    `i18n.messages` 做参数替换。但界面文案仍写死在各自的 `copy.js` 与组件里
    （`src/presentation/web/assets/app/features/*/copy.js`），CLI 的提示句也仍是中文——换语言时只有工具卡的说明会变。
  how: |
    1) 定词表键：按功能域给稳定码（`ui.<域>.<键>`），与 `locales/<lang>.ftl` 同源，构建期生成前端映射；
    2) `copy.js` 改为按键取值（保留 lead / detail / safety 三段结构），组件不内联中文；
    3) 加门禁：扫 `src/presentation/web/assets/app/**/*.js` 与 `src/presentation/cli/` 的中文字面量，白名单只留注释与调试输出；
    4) 语言切换入口接到设置项 `settings.lang`（形状已就位）。
  accept: |
    切换 `settings.lang` 后界面与 CLI 文案随之变化；目录缺键时按 `[code]` 如实显示；
    源码里没有未登记的中文字面量（门禁可判）；`node run-tests.js` 全绿。
  blocked_by: |
    本轮范围决定（用户明确 P1 只在本次留好形状，不做全站迁移）

- id: i18n.second-language
  scope: global
  level: T2
  why: |
    协商形状已就位（`settings.lang` → `SOLOMNI_LANG` → `zh-CN`，`src/kernel/detail/i18n.rs` 的 `pick`），
    但可用语言只有一项（`AVAILABLE = ["zh-CN"]`，`locales/` 只有 `zh-CN.ftl`）。
    没有第二种语言的目录，"可切换"这条契约就没有真实验证过：前缀协商、缺键回退、界面词表导出都只有一条路径可走。
  how: |
    1) 加 `locales/en-US.ftl`，按 `codes::ALL` 全部补齐；`AVAILABLE` 加 `en-US`；
    2) `catalog_for(lang)` 按语言选目录，`messages(lang)` 导出对应语言；
    3) 用例：`catalog_covers_every_code` 对每个可用语言各跑一遍（缺键即失败），并按 `en-US` 断言一次渲染；
    4) 设置校验（`settings.lang` 必须在可用语言内）随 `AVAILABLE` 自动成立。
  accept: |
    `settings.lang: en-US` 时界面词表与 CLI 标签为英文（模型通道仍按源语言渲染）；任一可用语言缺码则测试失败；
    `node run-tests.js` 全绿。
  blocked_by: |
    用户范围决定（英文放到之后统一做；本次只交付可切换形状与中文目录）



