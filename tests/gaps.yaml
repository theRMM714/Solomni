# 全局测试与质量缺口（当前状态：条目存在 = 尚未完成；补上后删除条目）
#
# 这里放两类：**长期目标**（存量收敛、目录迁移）与**已确认但尚未实施的产品/机制缺口**。
# 已经能机器判定的门禁不入账。平台与跨平台层的缺口记在
# tests/cross-platform/gaps.yaml 与 tests/<平台>/gaps.yaml（它们决定 TEST-REPORT-ACCEPTED）。

- id: fence.guest-tier-not-wired
  scope: global
  level: T4
  why: |
    虚拟机档的选型、诊断、装配计划、逐项前置检测、guest 端口、QEMU 后端与执行分派都已收进独立能力 vm；
    但整条链路**尚未在真机验证**，因此就绪检测的 guest 一项暂判否、虚拟机档仍不可选（vm::tier_readiness）。
    也就是说：现在产品还不存在“用户不授权本机写权限也能拿到强隔离”的可用路径——未验证前不放开，
    避免造出“隔离没多、能力反少”的会话。界面照旧逐项列出缺什么、每项怎么补。
  how: |
    方向已定：guest 在**所有平台统一为同一个 Linux 发行版**，默认基线是**官方最新 stable**
    （当前 Debian 13.7 / trixie；amd64 先行、arm64 记缺口）。后端默认 QEMU（用户自备），
    不内置 QEMU、不随仓库分发镜像——产品只检测与指路；项目另给一键补齐本地环境的手段 `setup-vm.js`
    （只写项目内 `.vm/`，下载源在 links.yaml 的 guest.*，需用户同意）。已完成的接线：
    1) vm 内部的 guest 端口（GuestBase / GuestMount / GuestSpec / GuestRun + GuestHost：start / exec / stop）
       与 QEMU 后端（qemu-system-* + QGA），镜像只读不转换；登记的 qemu_path 已接到实际启动（空则兜底 PATH）；
    2) 装配：prefix 包按来源目录只读挂到 /<prefix>，围栏根按宿主原路径挂；会话级一个 guest；
    3) 分派：会话在 vm 档把模块命令交给 guest；建会话时装配并拉起，会话删除时销毁。
    Linux 侧已用 `setup-vm.js` 装出的基础根在 TCG 下跑通整条 guest 机制（guest 启动 + QGA `guest-exec` 成功）：
    基础根必须预处理（fstab 去掉 PARTUUID 条目、mask systemd-remount-fs、装 qemu-guest-agent、用带 9p 的通用内核与 initrd），
    否则 cloud 镜像会掉进 emergency。
    剩余：/dev/kvm 真机验收（本机 WSL2 重启后 /dev/kvm 才出现）、Windows / macOS 真机、产品级会话流程；
    system 叠层、qcow2 → rootfs 转换、arm64 记后续缺口；真机通过后把就绪检测的 guest 项放开并删除本条。
  accept: |
    在一台有 /dev/kvm 的机器上选 vm 档跑一次工具：进程确实跑在 guest 内（可达范围与宿主隔离）；
    会话删除后 guest 与其磁盘被销毁；三平台探针覆盖“guest 可用 / 不可用”两种结论；
    届时删除本条并同步 PRODUCT.md / RUNTIME_SPEC.md / docs/vm/ 的当前状态。
  blocked_by: |
    本机（WSL2 / Arch）没有 /dev/kvm：嵌套虚拟化已开，但 WSL 未重启（重启当前会话会中断）所以 /dev/kvm 还没出现，
    产品就绪检测因此仍判否。QEMU 与 Debian 13 基础根已由 `node setup-vm.js` 装到项目内 `.vm/`（只写项目内、下载源在 links.yaml），
    Linux 机制已在 TCG 下验证通过。要销本条还差：重启 WSL 后 /dev/kvm 出现并在 vm 档跑一次产品级会话；Windows / macOS 各自真机验证。
- id: module.acp-adapter
  scope: global
  level: T3
  why: |
    「常驻服务」目前只实现了 MCP stdio 适配器（`residents/detail/mcp.rs`）：`module.yaml` 的
    `services.<名>.adapter` 写 `acp` 会被如实拒收（未知适配器）——ACP（Agent Client Protocol）这类
    按行 JSON-RPC 的 harness 拉不起来，MCP 之外的常驻服务对模块作者不可用。
  how: |
    1) 定 ACP 的握手 / 方法 / 回执映射：能共用长驻会话端口 `SessionHost` 与按行收发就共用，
       不另造机制；协议形状只进 `residents/detail/` 的适配器，kernel 与 service 不认识 ACP；
    2) 组合根注册该适配器（与 `mcp` 并列，`ServiceAdapter::id()` = `acp`）；
    3) 契约用例（脚本化会话端口）+ 真实服务端到端（自足 fixture，缺依赖时如实 env-skip）；
    4) 同步 docs/residents/README.md、docs/testing/doubles.md 端口矩阵、MODULE_SPEC。
  accept: |
    声明 `adapter: acp` 的模块能拉起、发现操作、调用并看回执；未知适配器仍如实列出可用名；
    `node run-tests.js` 全绿。
  blocked_by: 缺少实现

- id: work.commit-history-ui
  scope: global
  level: T5
  why: |
    共享区的提交记录与"任一提交点可还原"的机制已就位（`work_status` 能看到最近提交），但用户没有入口
    去浏览提交历史或把共享区回滚到某个提交点——只能在会话里由 agent 看到状态。
  how: |
    1) CLI / Web 各加一个入口：列出某工作的提交（id / 作者 / 时间 / message / 改动清单）；
    2) 选中一个提交点给出"回滚共享区到此处"的动作（调 `Workspace::work_restore`，走现有入站契约）；
    3) 回滚要留可回放的记录，并与回档标记模型对齐（提交锚见 docs/session/session-model.md 的五）。
  accept: 用户能在界面上看到提交历史，并把共享区回滚到任一提交点；回滚后新开的 agent 拉取到的是那一点的内容。
  blocked_by: 缺少实现（呈现面未接入）

- id: testing.coverage-child-and-platform
  scope: global
  level: T3
  why: |
    node run-tests.js --coverage 只覆盖测试进程内的代码。产品二进制（守门进程 solomni --guard、
    L4 端到端）由本入口单独 cargo build，未插桩，作为子进程运行不会被计入；平台 #[cfg] 代码在
    别的平台根本不编译。任何一份覆盖率都只代表"当前平台 + 进程内那几层"，当全貌会误导。
  how: |
    1) 三平台各自跑一次（与 T4 平台探针同一矩阵）；
    2) 若要把子进程计入：产品构建也用同一插桩（-C instrument-coverage），LLVM_PROFILE_FILE 带 %p
       传播到子进程，收尾合并 profraw；
    3) 产出"未覆盖清单"后逐条决定补测或记缺口。
  accept: |
    三平台各有一份覆盖率报告，且报告明确标注"仅进程内 / 仅当前平台"或已聚合子进程；
    未覆盖的生产路径逐条有补测或缺口结论。
  blocked_by: 缺少观察面（子进程插桩与合并尚未实现）

