# 全局测试与质量缺口（当前状态：条目存在 = 尚未完成；补上后删除条目）
#
# 这里放两类：**长期目标**（存量收敛、目录迁移）与**已确认但尚未实施的产品/机制缺口**。
# 已经能机器判定的门禁不入账。平台与跨平台层的缺口记在
# tests/cross-platform/gaps.yaml 与 tests/<平台>/gaps.yaml（它们决定 TEST-REPORT-ACCEPTED）。

- id: fence.guest-tier-not-wired
  scope: global
  level: T4
  why: |
    虚拟机档的选型、诊断、装配计划与**逐项前置检测**都已就位，但 guest 本体未接入：ExecPlan.packages
    全仓没有任何执行消费点（create_work 只把它打进日志），选 vm 档实际仍按本机档跑。这意味着当前产品
    **不存在**"用户不授权本机写权限也能拿到强隔离"的路径——未授权时文件系统与断网围栏都是关的。
    因为 guest 本体是**所有机器**共同缺的一项，虚拟机档现在一律不可选（exec::tier_readiness），
    界面逐项列出缺什么、每项怎么补。
  how: |
    方向已定（不再讨论）：走**平台原生虚拟化**（Windows 虚拟机平台 / Linux KVM / macOS 虚拟化框架），
    **不内置 QEMU、不随仓库分发镜像**——QEMU 与镜像用户自备，产品只检测与指路
    （设置项 qemu_path 与 base；这样不背 GPL 源码分发义务、仓库也不膨胀）。
    要做的事，按顺序：
    1) 把 guest 抽象成端口（core/ports.rs，与 ToolRunner / FenceHost 同层）：start / exec / stop，
       由适配层按平台实现；core 依旧无 IO。FenceSpec 的 rw / ro 在 guest 内变成挂载，net 变成"给不给网卡"。
    2) 三平台后端各一套：Linux QEMU+KVM；macOS Virtualization.framework；Windows 虚拟机平台 / HCS。
    3) 装配接线：消费 exec::plan 的 packages（prefix 只读共享、system 叠层），会话级一个 guest，
       会话删除时销毁 guest 与它的磁盘（与 --fence-clean 同哲学）。
  accept: |
    在真机上选 vm 档跑一次工具：进程确实跑在 guest 内（可达范围与宿主隔离）；会话删除后 guest 与其磁盘被销毁；
    三平台探针覆盖"guest 可用 / 不可用"两种结论；届时删除本条并同步 PRODUCT.md / RUNTIME_SPEC.md 的当前状态。
  blocked_by: |
    有意推迟（不是缺条件）：guest 相对现有围栏的独特价值只有"不授权本机写权限也能拿到强隔离"一条，
    而代价是三套原生 API、每平台真机验证，且 CI 起不了 hypervisor（只能真机验 + env-skip）。
    项目成熟、需求更清楚时再做。

- id: prompt.tool-book-rendered-instead-of-role-face
  scope: global
  level: T2
  why: |
    工具的**发放**只有两处按角色走（讨论回合的原生声明用 tool_face、两处的执行时校验用角色面），
    另外两处**发的是整本工具总表**：
    ① 提示词正文：systool::guide 把 Sandbox.builtin_tools（装的是 prompts.core.builtin_tools 全量）
       整体交给 render_book——信封模式下这是模型唯一看得到的工具清单，于是会话被明确告知一批它必然
       被拒的工具（说话回合的提示词里写着 write/edit/patch/submit_report，跑节点时写着四个讨论动词，
       两边都写着 plan/node_verdict/checklist/slate/suggest/compact 这些核心席专属工具）；
    ② 执行回合的原生声明槽：tool_decls(ctx) 遍历整本总表 + patch，不按 MemberTools.allowed 过滤
       （讨论回合的声明槽用了 tool_face，只有这条漏了）。
    两处都不是“执行了不该执行的”——越权调用会在执行时被如实拒绝；问题是模型被**邀请**去调一个必然被拒的工具。
    另有一个连带后果：任何按提示词措辞判断请求类型的代码都会被工具说明里的词误伤——真实发生过：
    成员提示词里出现 node_verdict 的说明“逐节点核对”后，e2e 的假供应商把它当成了核心的节点验收请求。
  how: |
    两处都按角色面收口：提示词按角色过滤 builtin_tools 后再 render_book；执行回合的声明槽按 allowed 过滤。
    难点只有一个：一个 agent 会话**同时**有说话与执行两种身份（用户跟它说话走 turn_with(discussant)，
    跑节点走 converse_with(executor)），而系统提示只有一份、且重建必须产出同一份消息。所以要选：
    A. 按**角色并集**渲染（说话席 ∪ 执行席 = 11 个内置工具；核心席专属的不再出现）——改动最小、回放与重建不变，
       代价是单次回合里仍会列出几个当回合会被拒的（说话回合列着写类工具，跑节点列着讨论动词）；
    B. 按回合所属角色渲染（说话回合给说话席那份、跑节点给执行席那份）——列出的与能调的完全一致，
       代价是同一会话的系统消息随回合变，回放/重建要能判定每个历史回合当时用的是哪一份。
    契约在 docs/architecture/tools-and-roles.md 二与四（“该角色能用的信封清单要渲染进提示词”）。
  accept: |
    提示词里不再出现**该会话两种身份都用不到**的工具（六个核心席专属工具）；
    执行回合的原生声明与 allowed 一致（席位外的不声明）；说话回合与跑节点各自列出的工具都有测试断言。
  blocked_by: |
    等用户在上面的 A / B 里选一个：A 是并集（改动最小），B 是每阶段一份（语义最干净、要动回放形态）。

- id: web.static-assets-cache-policy-unstated
  scope: global
  level: T5
  why: |
    静态资源（app.js 等）没有声明缓存策略：改了前端后浏览器可能仍在用旧文件。本轮"忙碌态/同步/流式"
    三处改动是否因此未生效尚未确认——若确实如此，这条就是根因；即使不是，缺显式策略也会反复咬人。
  how: |
    给静态资源明确策略（开发期 no-cache，或按内容摘要生成 URL）。先确认是否真是它。
  accept: |
    改前端后刷新即生效（无需硬刷新）；或在文档里写明必须硬刷新及其原因。
  blocked_by: |
    待确认：需要用户硬刷新一次，看那三处是否生效。