# 全局测试与质量缺口（当前状态：条目存在 = 尚未完成；补上后删除条目）
#
# 这里放两类：**长期目标**（存量收敛、目录迁移）与**已确认但尚未实施的产品/机制缺口**。
# 已经能机器判定的门禁不入账。平台与跨平台层的缺口记在
# tests/cross-platform/gaps.yaml 与 tests/<平台>/gaps.yaml（它们决定 TEST-REPORT-ACCEPTED）。

- id: fence.guest-tier-not-wired
  scope: global
  level: T4
  why: |
    虚拟机档的选型、诊断、装配计划与**逐项前置检测**都已就位，但 guest 本体未接入：ExecPlan.packages
    全仓没有任何执行消费点（create_work 只把它打进日志），选 vm 档实际仍按本机档跑。这意味着当前产品
    **不存在**"用户不授权本机写权限也能拿到强隔离"的路径——未授权时文件系统与断网围栏都是关的。
    因为 guest 本体是**所有机器**共同缺的一项，虚拟机档现在一律不可选（exec::tier_readiness），
    界面逐项列出缺什么、每项怎么补。
  how: |
    方向已定（不再讨论）：走**平台原生虚拟化**（Windows 虚拟机平台 / Linux KVM / macOS 虚拟化框架），
    **不内置 QEMU、不随仓库分发镜像**——QEMU 与镜像用户自备，产品只检测与指路
    （设置项 qemu_path 与 base；这样不背 GPL 源码分发义务、仓库也不膨胀）。
    要做的事，按顺序：
    1) 把 guest 抽象成端口（core/ports.rs，与 ToolRunner / FenceHost 同层）：start / exec / stop，
       由适配层按平台实现；core 依旧无 IO。FenceSpec 的 rw / ro 在 guest 内变成挂载，net 变成"给不给网卡"。
    2) 三平台后端各一套：Linux QEMU+KVM；macOS Virtualization.framework；Windows 虚拟机平台 / HCS。
    3) 装配接线：消费 exec::plan 的 packages（prefix 只读共享、system 叠层），会话级一个 guest，
       会话删除时销毁 guest 与它的磁盘（与 --fence-clean 同哲学）。
  accept: |
    在真机上选 vm 档跑一次工具：进程确实跑在 guest 内（可达范围与宿主隔离）；会话删除后 guest 与其磁盘被销毁；
    三平台探针覆盖"guest 可用 / 不可用"两种结论；届时删除本条并同步 PRODUCT.md / RUNTIME_SPEC.md 的当前状态。
  blocked_by: |
    有意推迟（不是缺条件）：guest 相对现有围栏的独特价值只有"不授权本机写权限也能拿到强隔离"一条，
    而代价是三套原生 API、每平台真机验证，且 CI 起不了 hypervisor（只能真机验 + env-skip）。
    项目成熟、需求更清楚时再做。


- id: web.external-file-delete-not-reflected
  scope: global
  level: T5
  why: |
    用户在会话的共享区/沙箱里**手工删掉**文件后，@ 菜单还会把它列出来：前端按会话缓存文件清单，
    只有应用内的上传/编辑/删除才让缓存失效。用户会照着菜单去引用一个已经不存在的文件。
  how: |
    给文件清单一个明确的过期判据：每次打开 @ 菜单重拉一次（不跨打开缓存），或随状态刷新按 mtime 失效。
    不引入目录 watcher——本机、跨平台，代价不值。
  accept: |
    在会外删掉一个文件后，再打开 @ 菜单列不出它；应用内上传/编辑后**立刻**仍能列出来。
  blocked_by: |
    待排期：本轮先收口会话流与行渲染的统一，这条是观察到的界面同步问题，尚未动手。

- id: session.delete-without-file-check
  scope: global
  level: T5
  why: |
    「删除会话」只确认"记录将被永久删除"，不看共享区与各 agent 沙箱里**还有没有文件**（产物可能还没被拿走）。
    用户以为只是删记录，实际把工作区一起带走了。
  how: |
    删除前统计共享区与各沙箱里的文件（数量 + 总字节）；非空就如实列出来，让用户明确选择"连文件一起删"。
  accept: |
    工作区非空时删除会先列出文件并要求确认；工作区为空保持一步删除。
  blocked_by: |
    待排期（同上）：删除语义要一并定"记录与文件分开删"的话术，属于产品口径变更。

- id: session.create-has-no-tier-choice
  scope: global
  level: T5
  why: |
    执行档位（本机档 / 虚拟机档）只能在会话建好之后的「编辑」里改，创建向导里没有这一项
    （WorkSpec 只有 name/mode/agents/task/delegate）——建完再改是多余的一步。
  how: |
    创建向导加档位选择（默认本机档）；不可用的档位按现有 tier_readiness 逐项说明缺什么并禁用，
    选定值随 WorkSpec 进 create_work。
  accept: |
    创建向导能选档位；选不可用档位时逐项说明缺什么；建出来的会话 meta 档位与所选一致。
  blocked_by: |
    待排期：档位可用性判定（exec::tier_readiness）已就位，缺的只是向导里那一格与 WorkSpec 的字段。

- id: cli.webui-ctrl-c-exits-process
  scope: global
  level: T5
  why: |
    从 CLI 进 Web 转录中心后，Ctrl+C 直接结束整个进程，而不是退回 CLI（用户得重启程序）。
  how: |
    给 Web 服务器一个可中断的等待：收到 Ctrl+C / SIGINT 后正常关闭服务器并回到 CLI 主循环。
  accept: |
    Ctrl+C 后回到 CLI 提示符、进程仍在；再输入 webui 能重新起服务器。
  blocked_by: |
    待排期：要把 Web 服务器从"阻塞到出错"改成可中断等待（收 SIGINT 后正常关闭再回 CLI 主循环）。

- id: session.compaction-send-view-not-truncated
  scope: global
  level: T1
  why: |
    压缩的语义是"改的是发给模型什么，不是留下什么"：摘要覆盖以上全部内容（含上一份摘要），
    所以压缩后发送视图应当只剩这一份摘要。当前 AgentSession::compact 用的是 dialogue.truncate(hist)
    （**保留前缀**），方向反了——应当**移出**被总结掉的那一段。两个触发点传的 up_to 又不同，
    恰好互相掩盖：手动 /compact 因取用顺序意外得 up_to=0（truncate(0) = 清空，看起来对），
    自动（maybe_compact 传 next_line）得 hist = marks.last() = 对话全长，truncate 是 no-op，
    **一条都没移出**。后果：超预算时每轮再压一次，摘要在发送视图里累积，上下文反而更长。
    现有自动压缩测试只断言"摘要出现"，抓不到这一点。
    另：手动 /compact 的压缩回合身份块是空串——CoreHandle::compact 先 take_single 把会话移出
    sessions，再调 compact_plan，后者落到 _ => (0, String::new())。
  how: |
    ① 让 compact_plan 在会话被取走**之前**读到该会话的身份块与压缩点（同一个取用顺序问题）；
    ② 把 compact 的截断从"保留前缀"改成"移出前缀"（cut 由 up_to 决定），并同步处理 marks 的整体偏移；
    ③ 两条触发点必须**同时**成立——只修一半必然坏事：只修①会让手动也退化成"只加摘要不删内容"，
       只修②会让手动 up_to=0 变成"什么都不移出"；
    ④ 补一条断言"被总结的内容确实消失"的测试（现有自动压缩测试只断言摘要出现）。
    方案与批次见 docs/architecture/session-model.md。
  accept: |
    手动 /compact 与自动阈值两条触发点都成立：压缩后发送视图里**只有一份摘要**、被总结的内容不再出现；
    压缩回合的身份块非空且等于该会话的身份块；连压两次后发送视图仍只有一份摘要。
  blocked_by: |
    与 session 分区重构同一批处理：压缩的落档与回放要一起改（摘要改成真正的转录行），
    现在单独修等于改两遍。见 docs/architecture/session-model.md。

- id: session.compaction-not-replayed
  scope: global
  level: T1
  why: |
    压缩只在当前这次运行内有效。压缩落了两样东西：内存里把摘要插进对话，转录里落一条
    {"type":"compacted", up_to, summary} 事件；但**摘要本身不是转录行**（compact() 只改 dialogue，
    不调 line()）。而 rebuild_session 重放时只读 type == "transcript" 的事件，**跳过 compacted**，
    全仓再无第二个读取方（Compacted 不在短暂事件名单里，所以它确实写进了 transcript.jsonl——写了没人读）。
    后果：重启程序或回档触发重建后，发送视图从转录重放，只看得见原始的用户/助手/工具行，
    **摘要与被压掉的内容都会回来**，等于没压过。
    而 docs/architecture/session-model.md §六 写着"重启/回档按 compacted 事件重建发送视图"，与实现不一致。
  how: |
    按 docs/architecture/session-model.md 的结论一起改：
    ① 摘要按 note_task 的形状落档——**转录里是系统行、发给模型的上下文里是 user 角色**
       （新增结构化标记，不复用 task: true，它的语义是"派发行"）；
    ② rebuild_session 认这个标记：重建出 Msg::user(摘要)，并且它之前的对话不再重建；
    ③ 回档**跨越压缩点**时走重建路径（rebuild_session），不走内存精确截断（AgentSession::rewind）
       ——压缩已经把对话内容销毁，内存里补不回来。
  accept: |
    压缩后重启程序（或回档到压缩点之后），发送视图仍是"摘要 + 之后的行"，摘要不丢、被压掉的内容不回来；
    回档跨越压缩点时发送视图回到压缩前；实时与重建逐条相同。
  blocked_by: |
    与 session 分区重构同一批处理（摘要变成转录行 + rebuild 认标记 + 回档按压缩点分流）。
    见 docs/architecture/session-model.md。

- id: deps.serde-yaml-unmaintained
  scope: global
  level: T1
  why: |
    `serde_yaml 0.9.34+deprecated` 的上游已归档（RUSTSEC 的「unmaintained」结论），本仓用它的完整 API
    （`from_str` / `to_string` / `from_value` / `Value` / `Mapping`，35 处）。它功能完备、当前没有已知漏洞，
    但长期不再收修复。
  how: |
    换成 yaml-serde 0.10（The YAML Organization 接手的 serde_yaml 续作：MIT OR Apache-2.0、纯 Rust、
    只多 indexmap / itoa / libyaml-rs / ryu）。步骤：① 在能联网的 shell 里 `cargo fetch`（本仓当前环境取不到
    crates.io）；② `Cargo.toml` 的 `serde_yaml = "0.9"` 改成 `yaml-serde = "0.10"`；③ 代码里 35 处
    `serde_yaml::` 改成 `yaml_serde::`；④ 跑 `node run-tests.js`。
  accept: |
    `cargo tree` 里不再有 serde_yaml；yaml-serde 进入依赖树且 `cargo tree --duplicates` 仍为空；
    全量门禁绿；届时删除本条。
  blocked_by: |
    只有一件事：拉取新 crate 需要网络（本仓的开发环境里 cargo 取不到 crates.io，TLS 凭证不可用）。
