# 全局测试与质量缺口（当前状态：条目存在 = 尚未完成；补上后删除条目）
#
# 这里放两类：**长期目标**（存量收敛、目录迁移）与**已确认但尚未实施的产品/机制缺口**。
# 已经能机器判定的门禁不入账。平台与跨平台层的缺口记在
# tests/cross-platform/gaps.yaml 与 tests/<平台>/gaps.yaml（它们决定 TEST-REPORT-ACCEPTED）。

- id: module.acp-adapter
  scope: global
  level: T3
  why: |
    「常驻服务」目前只实现了 MCP stdio 适配器（`residents/detail/mcp.rs`）：`module.yaml` 的
    `services.<名>.adapter` 写 `acp` 会被如实拒收（未知适配器）——ACP（Agent Client Protocol）这类
    按行 JSON-RPC 的 harness 拉不起来，MCP 之外的常驻服务对模块作者不可用。
  how: |
    1) 定 ACP 的握手 / 方法 / 回执映射：能共用长驻会话端口 `SessionHost` 与按行收发就共用，
       不另造机制；协议形状只进 `residents/detail/` 的适配器，kernel 与 service 不认识 ACP；
    2) 组合根注册该适配器（与 `mcp` 并列，`ServiceAdapter::id()` = `acp`）；
    3) 契约用例（脚本化会话端口）+ 真实服务端到端（自足 fixture，缺依赖时如实 env-skip）；
    4) 同步 docs/residents/README.md、docs/testing/doubles.md 端口矩阵、MODULE_SPEC。
  accept: |
    声明 `adapter: acp` 的模块能拉起、发现操作、调用并看回执；未知适配器仍如实列出可用名；
    `node run-tests.js` 全绿。
  blocked_by: 缺少实现

- id: work.commit-history-ui
  scope: global
  level: T5
  why: |
    共享区的提交记录与"任一提交点可还原"的机制已就位（`work_status` 能看到最近提交），但用户没有入口
    去浏览提交历史或把共享区回滚到某个提交点——只能在会话里由 agent 看到状态。
  how: |
    1) CLI / Web 各加一个入口：列出某工作的提交（id / 作者 / 时间 / message / 改动清单）；
    2) 选中一个提交点给出"回滚共享区到此处"的动作（调 `Workspace::work_restore`，走现有入站契约）；
    3) 回滚要留可回放的记录，并与回档标记模型对齐（提交锚见 docs/session/session-model.md 的五）。
  accept: 用户能在界面上看到提交历史，并把共享区回滚到任一提交点；回滚后新开的 agent 拉取到的是那一点的内容。
  blocked_by: 缺少实现（呈现面未接入）

- id: work.general-assets
  scope: global
  level: T2
  why: |
    共享区版本化按字节存取，能承载图片、视频等非文本文件；但当前工具与回执仍以文本 / 文档为主要场景：
    三方视图只给文本预览，没有媒体类型 / 尺寸 / 预览约定；pull / commit / versions 都把整份文件读进内存，
    大视频没有分块、上限或明确拒绝；二进制冲突只能选边（这是对的），但没有面向通用资产的契约说明。
    版本控制是通用能力（不直接使用 git 正是因为它偏代码 / 文档），通用文件需要单独把边界写清。
  how: |
    1) 定通用资产契约：二进制 / 非 UTF-8 只给指纹、大小与（可选）类型，不冒充文本；文本预览有上限。
    2) 大文件：pull / commit / versions 的读写与指纹支持分块或明确大小上限，超限如实拒绝并给出替代路径，
       不把整块内容灌进内存 / 上下文。
    3) 二进制冲突只允许显式选边（work_resolve take=upstream / local），不做自动合并；回执说明这一点。
    4) 更新提示词与工具说明（文本 / 图片 / 视频 / 二进制同一套规则），补 T1 / T2 / T5 用例与图片、视频、二进制 fixture。
  accept: |
    图片 / 视频 / 二进制可以 pull、commit，冲突时能显式选边解决；超上限的文件有明确拒绝或分块路径；
    工具说明与回执不再假定文本；node run-tests.js 全绿。
  blocked_by: 缺少实现（当前只有字节存取；大文件与媒体契约未定）

- id: work.commit-durability
  scope: global
  level: T2
  why: |
    work_commit 的成功路径依次写对象、主副本、提交记录、head、index；head / index / 提交记录都是直接覆盖写，
    没有临时文件 + rename，也没有提交日志。崩溃或掉电可能留下"主副本已变、head 未变"或半个 JSON，
    下一次读取会把这种状态当成正常版本库。
  how: |
    1) 元数据（head / index / 提交记录）改成同目录临时文件 + rename，保证不出现半个 JSON。
    2) 提交做成可恢复事务：提交记录先落盘，再推 head，再物化主副本；启动或下一次读取时按提交记录补齐未完成物化。
    3) 用注入失败 / 模拟中断的用例钉住每一步的恢复结论（主副本、head、index 三者最终一致）。
  accept: |
    任一步失败后，下一次 work_status / work_pull 看到的 head、index、主副本一致；
    不出现半个 JSON；恢复路径有 T2 用例；node run-tests.js 全绿。
  blocked_by: 缺少实现（下一个 PR）

- id: work.commit-id-monotonic
  scope: global
  level: T2
  why: |
    提交 id 用 list_commits().last() + 1 生成；work_discard_after 会真的删除提交记录。
    删掉最高 id 后，下一次提交会复用同一个 id，转录、报告或未来提交历史 UI 里的旧引用会指到新提交。
  how: |
    1) 持久化一个单调递增的 next_id（或记录曾经用到的最大 id），分配时只增不复用；
    2) 覆盖"提交 1/2/3 → 丢弃到 1 → 下一次提交必须是 4"的用例；
    3) 同步 docs/workspace 与提交历史缺口的实现说明。
  accept: |
    删除 / 恢复 / 回档之后新提交的 id 仍严格大于历史上出现过的所有 id；用例钉住不复用；node run-tests.js 全绿。
  blocked_by: 缺少实现（下一个 PR）

- id: work.status-consistency-and-scope
  scope: global
  level: T2
  why: |
    work_status 既不过版本库写闸，也不按读作用域过滤路径清单：提交进行中可能读到
    "新 head + 旧 index"或"旧 tree + 新 index"的瞬时组合；受限 agent 也能从状态里看到读不到的路径名。
  how: |
    1) work_status 与 pull / commit 共用同一个 per-work 闸，保证读到一致快照；
    2) 按生效读权限过滤 tree / entries / local_only；显式 paths 先过读作用域；
    3) 补并发与受限读权限的用例（越界路径不出现、状态不撕裂）。
  accept: |
    work_status 不会与提交并发读到撕裂快照；读作用域外的路径不出现在状态回执里；用例钉住；node run-tests.js 全绿。
  blocked_by: 缺少实现（下一个 PR）

- id: work.object-retention
  scope: global
  level: T2
  why: |
    内容寻址对象只增不删：work_discard_after 删除提交记录后，不再可达的对象仍留在 .work/objects/。
    长会话、大图片 / 视频会让版本库只涨不降；目前没有回收或保留策略。
  how: |
    1) 定保留策略：从当前提交、各 agent 基线与仍需回档的提交算可达对象，其余可回收；
    2) 提供显式回收动作（先报告将删除的对象数与字节，再执行），不做后台静默清理；
    3) 用例覆盖"可达对象不删、不可达对象删除、删后可正常 pull / restore"。
  accept: |
    回收后不可达对象被删、可达对象与基线不受影响；恢复 / pull 仍能工作；node run-tests.js 全绿。
  blocked_by: 缺少实现（下一个 PR）

- id: testing.coverage-child-and-platform
  scope: global
  level: T3
  why: |
    node run-tests.js --coverage 只覆盖测试进程内的代码。产品二进制（守门进程 solomni --fence-run、
    L4 端到端）由本入口单独 cargo build，未插桩，作为子进程运行不会被计入；平台 #[cfg] 代码在
    别的平台根本不编译。任何一份覆盖率都只代表"当前平台 + 进程内那几层"，当全貌会误导。
  how: |
    1) 三平台各自跑一次（与 T4 平台探针同一矩阵）；
    2) 若要把子进程计入：产品构建也用同一插桩（-C instrument-coverage），LLVM_PROFILE_FILE 带 %p
       传播到子进程，收尾合并 profraw；
    3) 产出"未覆盖清单"后逐条决定补测或记缺口；补齐能力的"可用 / 缺件 / 补齐后可用"三态探针也按平台各覆盖一次
       （Linux 已有真机验证；Windows / macOS 待各自平台）。
  accept: |
    三平台各有一份覆盖率报告，且报告明确标注"仅进程内 / 仅当前平台"或已聚合子进程；
    未覆盖的生产路径逐条有补测或缺口结论。
  blocked_by: 缺少观察面（子进程插桩与合并尚未实现）
