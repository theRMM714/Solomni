# 全局测试与质量缺口（当前状态：条目存在 = 尚未完成；补上后删除条目）
#
# 这里放两类：**长期目标**（存量收敛、目录迁移）与**已确认但尚未实施的产品/机制缺口**。
# 已经能机器判定的门禁不入账。平台与跨平台层的缺口记在
# tests/cross-platform/gaps.yaml 与 tests/<平台>/gaps.yaml（它们决定 TEST-REPORT-ACCEPTED）。

- id: fence.guest-tier-not-wired
  scope: global
  level: T4
  why: |
    虚拟机档的**五轴组合**（宿主 × VmEngine × GuestImage × GuestChannel × ShareBackend）已落地，执行分派已接线：
    Linux（QEMU/KVM + virtiofs，缺 virtiofsd 时退 9p）与 Windows（QEMU/WHPX + SMB guestfwd 实时共享，缺 smbd 时退 QGA 复制）已真机验收（引擎级探针 + e2e 的 vm 会话场景都过）。
    macOS 的组合还没验，且它要的两块也还没做：Apple vz 引擎与自研 agent（vm.macos-vz-engine）、QEMU 取包
    （vm.qemu-provisioning-macos）。未验平台在 vm::tier_readiness 上把 guest 项判否。
  how: |
    在 macOS 真机上按顺序补齐并验收：先用 QEMU/HVF + 9p 把备选链跑通（依赖取包），再上 Apple vz + 原生 virtiofs + 自研 agent（vsock）。
    依赖不预置、不分发；Linux / Windows 已由 provision 能力按清单（dependencies.yaml + links.yaml，需用户同意）装进项目内 .vm/；macOS 仍是检测 + 指路。
    契约与组合矩阵见 docs/vm/README.md 的「多平台组合」。
  accept: |
    每个组合单独判定：vm 档会话里模块工具真在 guest 内跑（进程与宿主隔离）、删会话即销毁 guest 与其磁盘；
    就绪面板按组合逐项列出缺什么、每项怎么补；每平台探针覆盖"组合可用 / 不可用"两种结论。
    Linux 与 Windows 已验；macOS 通过后销账，全部通过后删除本条，并同步 PRODUCT.md / RUNTIME_SPEC.md / docs/vm/ 的当前状态。
  blocked_by: |
    需要一台 macOS 机器（验收环境）。macOS 侧的取包、vz 引擎与自研 agent 分别在
    vm.qemu-provisioning-macos / vm.macos-vz-engine 两条缺口里。

- id: vm.qemu-provisioning-macos
  scope: global
  level: T4
  why: |
    Windows 与 Linux 的 QEMU 已由 provision 能力装进项目内 .vm/qemu/（Windows 是官方源码在 MSYS2（mingw-w64）下自建的便携包，
    Linux 是 pkgforge Anylinux AppImage；来源在 dependencies.yaml + links.yaml）；
    macOS 仍是检测 + 指路（provision 能力只报缺什么、怎么装），QEMU 要用户自行安装。已定方向：macOS 本期保持"检测 + 指路 + 手动"，
    不在本期做自动补齐；将来做需要 macOS 真机确定来源与 .app / 框架形态。
  how: |
    本期只做检测与指路：缺什么、怎么装，如实列出，不假装可自动装。
    将来若做自动补齐：按平台取包（Homebrew 或官方包）解到 .vm/qemu/，只写项目内、下载要用户同意，来源进 links.yaml；
    具体来源需要一台 macOS 真机确定。macOS 的 QEMU 是 .app / 框架形态，打包与落地方式要和 Linux / Windows 分开设计。
  accept: |
    本期：macOS 上就绪检测如实报"QEMU 不在场 + 怎么补"，不把"未实现自动补齐"写成能力。
    将来：macOS 上能把 QEMU 装进项目内 .vm/ 并被就绪检测认出来，且不需要管理员权限。
  blocked_by: |
    本期不做（macOS 保持检测 + 指路）；将来做需要一台 macOS 机器确定来源与 .app / 框架形态的落地方式。
- id: vm.macos-vz-engine
  scope: global
  level: T4
  why: |
    macOS 的默认组合是 Apple vz（Virtualization.framework）+ 原生 virtiofs + 自研 guest agent（vsock 通道）——
    比 QEMU/HVF 更省、更贴近系统；现在既没有 VzEngine，也没有自研 agent 与它的通道实现。
  how: |
    1) 加 VzEngine 实现 VmEngine（机器 / 磁盘 / 网卡 / 目录共享 / 加速器，走 Virtualization.framework 的绑定）；
    2) 加自研 guest agent + vsock 通道（GuestChannel 的第三个实现）；
    3) 在 macOS 真机上钉定 API 与镜像格式（vz 对磁盘与共享目录的要求与 QEMU 不同）再写适配。
  accept: |
    macOS 真机 vm 档会话跑通（模块工具在 guest 内执行、删会话销毁 guest），e2e 的 vm 场景在该平台通过。
  blocked_by: |
    需要一台 macOS 机器才能钉定 API 与验收。
- id: module.acp-adapter
  scope: global
  level: T3
  why: |
    「常驻服务」目前只实现了 MCP stdio 适配器（`residents/detail/mcp.rs`）：`module.yaml` 的
    `services.<名>.adapter` 写 `acp` 会被如实拒收（未知适配器）——ACP（Agent Client Protocol）这类
    按行 JSON-RPC 的 harness 拉不起来，MCP 之外的常驻服务对模块作者不可用。
  how: |
    1) 定 ACP 的握手 / 方法 / 回执映射：能共用长驻会话端口 `SessionHost` 与按行收发就共用，
       不另造机制；协议形状只进 `residents/detail/` 的适配器，kernel 与 service 不认识 ACP；
    2) 组合根注册该适配器（与 `mcp` 并列，`ServiceAdapter::id()` = `acp`）；
    3) 契约用例（脚本化会话端口）+ 真实服务端到端（自足 fixture，缺依赖时如实 env-skip）；
    4) 同步 docs/residents/README.md、docs/testing/doubles.md 端口矩阵、MODULE_SPEC。
  accept: |
    声明 `adapter: acp` 的模块能拉起、发现操作、调用并看回执；未知适配器仍如实列出可用名；
    `node run-tests.js` 全绿。
  blocked_by: 缺少实现

- id: work.commit-history-ui
  scope: global
  level: T5
  why: |
    共享区的提交记录与"任一提交点可还原"的机制已就位（`work_status` 能看到最近提交），但用户没有入口
    去浏览提交历史或把共享区回滚到某个提交点——只能在会话里由 agent 看到状态。
  how: |
    1) CLI / Web 各加一个入口：列出某工作的提交（id / 作者 / 时间 / message / 改动清单）；
    2) 选中一个提交点给出"回滚共享区到此处"的动作（调 `Workspace::work_restore`，走现有入站契约）；
    3) 回滚要留可回放的记录，并与回档标记模型对齐（提交锚见 docs/session/session-model.md 的五）。
  accept: 用户能在界面上看到提交历史，并把共享区回滚到任一提交点；回滚后新开的 agent 拉取到的是那一点的内容。
  blocked_by: 缺少实现（呈现面未接入）

- id: testing.coverage-child-and-platform
  scope: global
  level: T3
  why: |
    node run-tests.js --coverage 只覆盖测试进程内的代码。产品二进制（守门进程 solomni --guard、
    L4 端到端）由本入口单独 cargo build，未插桩，作为子进程运行不会被计入；平台 #[cfg] 代码在
    别的平台根本不编译。任何一份覆盖率都只代表"当前平台 + 进程内那几层"，当全貌会误导。
  how: |
    1) 三平台各自跑一次（与 T4 平台探针同一矩阵）；
    2) 若要把子进程计入：产品构建也用同一插桩（-C instrument-coverage），LLVM_PROFILE_FILE 带 %p
       传播到子进程，收尾合并 profraw；
    3) 产出"未覆盖清单"后逐条决定补测或记缺口；补齐能力的"可用 / 缺件 / 补齐后可用"三态探针也按平台各覆盖一次
       （Linux 已有真机验证；Windows / macOS 待各自平台）。
  accept: |
    三平台各有一份覆盖率报告，且报告明确标注"仅进程内 / 仅当前平台"或已聚合子进程；
    未覆盖的生产路径逐条有补测或缺口结论。
  blocked_by: 缺少观察面（子进程插桩与合并尚未实现）
- id: prompt.at-ref-session-dialect
  scope: global
  level: T4
  why: |
    用户输入里的 @ 引用由 prompt 能力改写成**宿主**真实绝对路径（refs.rs 的 RefRoots 就是宿主根）。
    本机档没问题；虚拟机档下工作环境提示词给的是 guest 写法，而模块工具在 guest 里执行、看不到宿主路径——
    这类引用喂给模块工具会失败。系统工具不受影响：它寻址前会把 guest 写法译回宿主路径，也接受宿主写法。
  how: |
    1) 把会话的路径桥交给 @ 改写（给 RefRoots 带上会话方言，或由调用方传入路径翻译器），按档位渲染成 guest 写法；
    2) 保持“不改写别人的私有沙箱路径、不泄漏”的规则；
    3) 用例：虚拟机档会话里 @sandbox:<自己>/x 改写后是 guest 写法、模块工具能直接用；本机档行为不变。
  accept: |
    虚拟机档会话里，输入框的 @ 引用进入转录后模块工具能直接用（guest 写法）；本机档行为不变；node run-tests.js 全绿。
  blocked_by: 缺少实现

