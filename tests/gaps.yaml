# 全局测试与质量缺口（当前状态：条目存在 = 尚未完成；补上后删除条目）
#
# 这里放两类：**长期目标**（存量收敛、目录迁移）与**已确认但尚未实施的产品/机制缺口**。
# 已经能机器判定的门禁不入账。平台与跨平台层的缺口记在
# tests/cross-platform/gaps.yaml 与 tests/<平台>/gaps.yaml（它们决定 TEST-REPORT-ACCEPTED）。

- id: fence.guest-tier-not-wired
  scope: global
  level: T4
  why: |
    虚拟机档的选型、诊断、装配计划与**逐项前置检测**都已就位，但 guest 本体未接入：ExecPlan.packages
    全仓没有任何执行消费点（create_work 只把它打进日志），选 vm 档实际仍按本机档跑。这意味着当前产品
    **不存在**"用户不授权本机写权限也能拿到强隔离"的路径——未授权时文件系统与断网围栏都是关的。
    因为 guest 本体是**所有机器**共同缺的一项，虚拟机档现在一律不可选（exec::tier_readiness），
    界面逐项列出缺什么、每项怎么补。
  how: |
    方向已定（不再讨论）：走**平台原生虚拟化**（Windows 虚拟机平台 / Linux KVM / macOS 虚拟化框架），
    **不内置 QEMU、不随仓库分发镜像**——QEMU 与镜像用户自备，产品只检测与指路
    （设置项 qemu_path 与 base；这样不背 GPL 源码分发义务、仓库也不膨胀）。
    要做的事，按顺序：
    1) 把 guest 抽象成端口（core/ports.rs，与 ToolRunner / FenceHost 同层）：start / exec / stop，
       由适配层按平台实现；core 依旧无 IO。FenceSpec 的 rw / ro 在 guest 内变成挂载，net 变成"给不给网卡"。
    2) 三平台后端各一套：Linux QEMU+KVM；macOS Virtualization.framework；Windows 虚拟机平台 / HCS。
    3) 装配接线：消费 exec::plan 的 packages（prefix 只读共享、system 叠层），会话级一个 guest，
       会话删除时销毁 guest 与它的磁盘（与 --fence-clean 同哲学）。
  accept: |
    在真机上选 vm 档跑一次工具：进程确实跑在 guest 内（可达范围与宿主隔离）；会话删除后 guest 与其磁盘被销毁；
    三平台探针覆盖"guest 可用 / 不可用"两种结论；届时删除本条并同步 PRODUCT.md / RUNTIME_SPEC.md 的当前状态。
  blocked_by: |
    有意推迟（不是缺条件）：guest 相对现有围栏的独特价值只有"不授权本机写权限也能拿到强隔离"一条，
    而代价是三套原生 API、每平台真机验证，且 CI 起不了 hypervisor（只能真机验 + env-skip）。
    项目成熟、需求更清楚时再做。

- id: fence.per-agent-write-roots
  scope: global
  level: T4
  why: |
    「垂直分工开发」要求一个 agent 只写自己负责的目录，但当前围栏的可写范围是**整个本次工作共享区**
    `work/`（加该 agent 的私有沙箱与它自己的模块目录），所有 agent 对共享区都可写——"谁改哪一块"
    因此只是约定，不是机制保证。PRODUCT.md 已把它写成开发方向，所以需要可判定的验收路径。
  how: |
    1) `.home/settings.yaml` 为每个 agent 增加一组可写路径（缺省 = `work/`）；
    2) 平台后端按这份清单授权（Windows 走 `confine::grant_targets` 的目录 ACL，Linux/macOS 走规则文本）；
    3) `tests/windows/`、`tests/linux/`、`tests/macos/` 各加一条探针：A agent 写自己目录成功、
       写 B 的目录**被机制拒绝**（不是工具层拒绝）。
  accept: 三平台探针各一条"跨 agent 目录写被机制拒绝"通过；不给该清单时行为与今天一致。
  blocked_by: 缺少实现

- id: module.external-harness-fence-reach
  scope: global
  level: T3
  why: |
    MODULE_SPEC 允许把外部 harness 当模块的一个工具（`tools.<名>.command` 指向它的命令行）。
    围栏目前只按运行包放行解释器目录，系统里已安装的 harness 可执行文件是否落在可达范围内
    **没有验证过**；文档已按"开发方向"标注，不能停在"大概能跑"。
  how: |
    1) 写一个把外部命令行 harness 当工具的测试模块（命令落在模块目录内）；
    2) 在授权围栏（`--fence-live`）下跑 T3 真实边界用例，记录可执行文件的可达性结论；
    3) 若不可达，把可执行文件纳入运行包登记或围栏可达范围，再复跑。
  accept: 授权围栏下该模块的工具跑通一次完整往返；或如实写明"必须把可执行文件放进模块目录"并落到文档与登记处。
  blocked_by: 缺少观察面

- id: module.standalone-entry
  scope: global
  level: T5
  why: |
    模块的工具本来就是真命令，用户**完全不经过 AI** 也能自己跑它；但模块**没有声明自己的独立入口**，
    产品也没有把"直接用模块"摆出来——现在模块只经 agent 会话被使用，这条路径没有入口、也没有验收判据。
  how: |
    1) 定契约：模块怎么声明自己的独立入口（`module.yaml` 加一节，例如命令行入口与参数；GUI 同理）；
    2) CLI 加一条"直接用模块"的命令：列出可独立运行的模块并跑它的入口；
    3) GUI 加对应入口（列表 + 运行 + 看回执），与 CLI 共用同一份事实（清单是目录扫描的纯函数）；
    4) T5 走一遍：不开 AI 会话，直接用模块跑一次，产物落在用户指定目录。
  accept: 声明了独立入口的模块能不经 AI 直接跑通一次；没声明的模块在列表里如实标注"只能经 AI 使用"。
  blocked_by: 缺少实现

- id: permission.management
  scope: global
  level: T2
  why: |
    **权限管理**是独立于会话的一类能力：它回答的是「谁能在本机、在哪些路径上做什么」，
    不是「代理模式的一部分」。
    它包含两块必须**一起**做的东西（共用同一份权限状态与同一处校验）：
    1) **决定粒度**：核心代用户决定到哪一步。今天是两个刻度——**完全代理**（用户选代理形态 = 整块托付）
    与**询问**（核心拿不准就回主对话问用户，即其余形态今天的口径）；将来可能还有别的粒度。
    这里**没有"撤销"这个概念**：粒度是设置，不是把已给的权力收回来。
    2) **额外路径权限**：按 agent / 会话设定额外的可写与只读路径（今天只有本次工作的 work/ 与各 agent
    私沙箱，见 fence.per-agent-write-roots）。
  how: |
    定义一份可落盘、可回放的**权限状态**（决定粒度、范围、有效期、调用者身份、额外读写路径），
    在动作执行前统一校验；粒度变化即时生效（改成询问就回到问用户）；路径权限落到各平台围栏的实现
    （Windows 目录 ACL、Linux / macOS 规则文本），未配置时行为与今天一致。
  accept: |
    决定粒度可在完全代理与询问之间按会话（或更细的粒度）设置并即时生效：完全代理时核心自行决定，
    询问时回到问用户；额外读写路径按设置对指定 agent 生效；未设置时行为与今天一致。
  blocked_by: 缺少实现

- id: work.rewind-and-file-state
  scope: global
  level: T4
  why: |
    共享区已是内容寻址的版本化工作区：提交留下记录，任一提交点都能物化回主副本
    （`Workspace::work_restore` 机制已就位、由测试钉住），但**回档与提交点没有对齐**——回档今天只按
    回合截断会话视图（主会话 + 直接子会话），共享区不跟着回到那一刻。用户要的方向更大：回档做成
    **工作级、可撤销的标记**（不清历史，可以再标记回后面），一个标记同时管所有叶子会话的视图与共享区状态。
  how: |
    1) 定语义：一个标记点（转录位置 / 提交点）怎么同时覆盖主会话、整棵子会话树与共享区；
       回档 = 视图截断 + 共享区物化到对应提交点；**取消回档** = 再标记到更后的点（流水只追加，旧行仍在）；
    2) 提交记录已带 `session` 与单调 `id`，据此建立"标记点 ↔ 提交点"的映射；不沿用旧口径的回合锚点，
       等这一条落地时按标记模型定；
    3) 会话回档与共享区回档必须是同一次动作的两个结果（现在的编排只截会话）。
  accept: |
    多叶子并发改过共享区之后回到某标记：共享区内容与所有相关会话视图都与该点一致；
    再取消回档能完整恢复到取消前；三平台各一条验证。
  blocked_by: 缺少实现（需先定标记语义）

- id: work.commit-history-ui
  scope: global
  level: T5
  why: |
    共享区的提交记录与"任一提交点可还原"的机制已就位（`work_status` 能看到最近提交），但用户没有入口
    去浏览提交历史或把共享区回滚到某个提交点——只能在会话里由 agent 看到状态。
  how: |
    1) CLI / Web 各加一个入口：列出某工作的提交（id / 作者 / 时间 / message / 改动清单）；
    2) 选中一个提交点给出"回滚共享区到此处"的动作（调 `Workspace::work_restore`，走现有入站契约）；
    3) 回滚要留可回放的记录，并与将来的回档标记模型对齐（见 work.rewind-and-file-state）。
  accept: 用户能在界面上看到提交历史，并把共享区回滚到任一提交点；回滚后新开的 agent 拉取到的是那一点的内容。
  blocked_by: 缺少实现（呈现面未接入）
