# 全局测试与质量缺口（当前状态：条目存在 = 尚未完成；补上后删除条目）
#
# 这里放两类：**长期目标**（存量收敛、目录迁移）与**已确认但尚未实施的产品/机制缺口**。
# 已经能机器判定的门禁不入账。平台与跨平台层的缺口记在
# tests/cross-platform/gaps.yaml 与 tests/<平台>/gaps.yaml（它们决定 TEST-REPORT-ACCEPTED）。

- id: fence.guest-tier-not-wired
  scope: global
  level: T4
  why: |
    虚拟机档已把选型、诊断、装配计划、逐项前置检测、guest 端口、QEMU 后端与执行分派收进独立能力 vm，
    Linux 已在真机（KVM + 9p 基础根）跑通；但当前实现把"单一 Debian guest + QEMU + 9p + 仅 Linux 放行"写死：
    QEMU 的 9p/virtfs 只在 Linux / macOS / FreeBSD 宿主构建（Windows 宿主没有），macOS 宿主也没有 virtiofsd，
    所以 Windows / macOS 既跑不通也验不了（vm::tier_readiness 在那两平台把 guest 项判否）。
  how: |
    方向已批准：guest 做成**四轴可扩展组合**——宿主 × VmEngine（默认 QEMU；macOS 后续 Apple vz）×
    GuestImage（默认 Debian，后续用户自备）× GuestChannel（默认 QGA；后续自研 agent + vsock）×
    ShareBackend（virtiofs / 9p / SMB / copy）；各平台默认吃当前最强组合并逐级回退。分阶段：
    0) 抽象落地（不改行为）：拆出四个端口与数据，现有 QEMU+9p 原样迁到适配器；root 改磁盘镜像（qcow2/raw）；
       就绪门改成按组合逐项报；"验过没有"改成组合台账（数据），不再用平台 cfg。
    1) 三平台 QEMU 组合真机跑通：Linux QEMU/KVM + virtiofs（缺 virtiofsd 落 9p）、macOS QEMU/HVF + 9p、
       Windows QEMU/WHPX + SMB over guestfwd（自带用户态 SMB 服务，免管理员）；guest 用 restrict=on 网卡
       （出站全断，guestfwd 内部隧道可用）。
    2) macOS 新增 Apple vz 引擎 + 原生 virtiofs + 自研 guest agent（vsock 通道）。
    3) 多 guest：用户自备镜像契约，再谈非 Linux guest。
    依赖由 setup-vm.js 按平台装进项目内 .vm/，下载源进 links.yaml；产品不自带、不分发。
    契约与组合矩阵见 docs/vm/README.md 的「多平台组合」。
  accept: |
    每个组合单独判定：vm 档会话里模块工具真在 guest 内跑（进程与宿主隔离）、删会话即销毁 guest 与其磁盘；
    就绪面板按组合逐项列出缺什么、每项怎么补；每平台探针覆盖"组合可用 / 不可用"两种结论。
    Linux（QEMU/virtiofs）已验；Windows / macOS 各自组合通过后按组合销账，全部通过后删除本条，
    并同步 PRODUCT.md / RUNTIME_SPEC.md / docs/vm/ 的当前状态。
  blocked_by: |
    阶段 0 已落地（四端口抽象）；阶段 1 三平台 QEMU 组合与 Windows / macOS 真机验收尚未做。
    共享：Windows 走 QGA 复制兜底（实时共享见 vm.share-realtime-windows，Linux 性能档见 vm.share-virtiofs-linux）。
    阶段 2-3（macOS vz、多 guest）在阶段 1 之后。
- id: vm.share-realtime-windows
  scope: global
  level: T4
  why: |
    Windows 宿主没有 9p / virtiofs（QEMU 的 virtfs 只在 Linux / macOS / FreeBSD 构建），所以 Windows 上宿主↔guest
    目前用 QGA 复制兜底（每趟 tar 打包/解包），不是实时共享；大目录与高频写会慢，执行后还要把可写树整棵回拷。
  how: |
    做 A 方案：宿主侧用户态 SMB3 服务 + QEMU guestfwd 隧道，guest 用 mount -t cifs 挂载（免管理员、可热挂载），
    作为 Windows 的实时共享档。共享端口（ShareBackend / ShareGuard / sync_in / sync_out）已就绪，只需新增适配器与就绪项。
  accept: |
    Windows 真机 vm 档会话里，guest 对共享目录的写入在宿主即时可见（不必等执行结束），且不需要管理员权限。
  blocked_by: |
    先要有可启动的 Windows 侧 guest 磁盘镜像（见 fence.guest-tier-not-wired），以及一个用户态 SMB3 实现。
- id: vm.share-virtiofs-linux
  scope: global
  level: T4
  why: |
    Linux 宿主当前用 9p；virtiofs 是 Linux 宿主上最快的实时共享，但需要 virtiofsd（用户态 vhost-user 守护进程，
    每设备一个），产品目前不检测、不起停它。
  how: |
    在 ShareBackend 下加 VirtioFsShare：探测 virtiofsd、按挂载起停守护进程（ShareGuard 已能持外部资源），
    QEMU 参数用 vhost-user-fs-pci，guest 端 mount -t virtiofs；作为 Linux 默认，9p 留作回退。
  accept: |
    Linux 真机 vm 档会话走 virtiofs，工具在 guest 里读写共享目录；virtiofsd 随会话起停、删会话后不残留。
  blocked_by: |
    virtiofsd 用户自备（setup-vm.js 按平台取包）尚未做。
- id: module.acp-adapter
  scope: global
  level: T3
  why: |
    「常驻服务」目前只实现了 MCP stdio 适配器（`residents/detail/mcp.rs`）：`module.yaml` 的
    `services.<名>.adapter` 写 `acp` 会被如实拒收（未知适配器）——ACP（Agent Client Protocol）这类
    按行 JSON-RPC 的 harness 拉不起来，MCP 之外的常驻服务对模块作者不可用。
  how: |
    1) 定 ACP 的握手 / 方法 / 回执映射：能共用长驻会话端口 `SessionHost` 与按行收发就共用，
       不另造机制；协议形状只进 `residents/detail/` 的适配器，kernel 与 service 不认识 ACP；
    2) 组合根注册该适配器（与 `mcp` 并列，`ServiceAdapter::id()` = `acp`）；
    3) 契约用例（脚本化会话端口）+ 真实服务端到端（自足 fixture，缺依赖时如实 env-skip）；
    4) 同步 docs/residents/README.md、docs/testing/doubles.md 端口矩阵、MODULE_SPEC。
  accept: |
    声明 `adapter: acp` 的模块能拉起、发现操作、调用并看回执；未知适配器仍如实列出可用名；
    `node run-tests.js` 全绿。
  blocked_by: 缺少实现

- id: work.commit-history-ui
  scope: global
  level: T5
  why: |
    共享区的提交记录与"任一提交点可还原"的机制已就位（`work_status` 能看到最近提交），但用户没有入口
    去浏览提交历史或把共享区回滚到某个提交点——只能在会话里由 agent 看到状态。
  how: |
    1) CLI / Web 各加一个入口：列出某工作的提交（id / 作者 / 时间 / message / 改动清单）；
    2) 选中一个提交点给出"回滚共享区到此处"的动作（调 `Workspace::work_restore`，走现有入站契约）；
    3) 回滚要留可回放的记录，并与回档标记模型对齐（提交锚见 docs/session/session-model.md 的五）。
  accept: 用户能在界面上看到提交历史，并把共享区回滚到任一提交点；回滚后新开的 agent 拉取到的是那一点的内容。
  blocked_by: 缺少实现（呈现面未接入）

- id: testing.coverage-child-and-platform
  scope: global
  level: T3
  why: |
    node run-tests.js --coverage 只覆盖测试进程内的代码。产品二进制（守门进程 solomni --guard、
    L4 端到端）由本入口单独 cargo build，未插桩，作为子进程运行不会被计入；平台 #[cfg] 代码在
    别的平台根本不编译。任何一份覆盖率都只代表"当前平台 + 进程内那几层"，当全貌会误导。
  how: |
    1) 三平台各自跑一次（与 T4 平台探针同一矩阵）；
    2) 若要把子进程计入：产品构建也用同一插桩（-C instrument-coverage），LLVM_PROFILE_FILE 带 %p
       传播到子进程，收尾合并 profraw；
    3) 产出"未覆盖清单"后逐条决定补测或记缺口。
  accept: |
    三平台各有一份覆盖率报告，且报告明确标注"仅进程内 / 仅当前平台"或已聚合子进程；
    未覆盖的生产路径逐条有补测或缺口结论。
  blocked_by: 缺少观察面（子进程插桩与合并尚未实现）

