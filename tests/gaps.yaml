# 全局测试与质量缺口（当前状态：条目存在 = 尚未完成；补上后删除条目）
#
# 这里放两类：**长期目标**（存量收敛、目录迁移）与**已确认但尚未实施的产品/机制缺口**。
# 已经能机器判定的门禁不入账。平台与跨平台层的缺口记在
# tests/cross-platform/gaps.yaml 与 tests/<平台>/gaps.yaml（它们决定 TEST-REPORT-ACCEPTED）。

- id: module.acp-adapter
  scope: global
  level: T3
  why: |
    「常驻服务」目前只实现了 MCP stdio 适配器（`residents/detail/mcp.rs`）：`module.yaml` 的
    `services.<名>.adapter` 写 `acp` 会被如实拒收（未知适配器）——ACP（Agent Client Protocol）这类
    按行 JSON-RPC 的 harness 拉不起来，MCP 之外的常驻服务对模块作者不可用。
  how: |
    1) 定 ACP 的握手 / 方法 / 回执映射：能共用长驻会话端口 `SessionHost` 与按行收发就共用，
       不另造机制；协议形状只进 `residents/detail/` 的适配器，kernel 与 service 不认识 ACP；
    2) 组合根注册该适配器（与 `mcp` 并列，`ServiceAdapter::id()` = `acp`）；
    3) 契约用例（脚本化会话端口）+ 真实服务端到端（自足 fixture，缺依赖时如实 env-skip）；
    4) 同步 docs/residents/README.md、docs/testing/doubles.md 端口矩阵、MODULE_SPEC。
  accept: |
    声明 `adapter: acp` 的模块能拉起、发现操作、调用并看回执；未知适配器仍如实列出可用名；
    `node run-tests.js` 全绿。
  blocked_by: 缺少实现

- id: work.large-asset-transfer
  scope: global
  level: T3
  why: |
    共享区已按字节资产、流式 IO 与 64 MiB 单文件上限收口：普通图片 / 视频 / 二进制能拉取、提交、
    看三方与显式选边；超过上限的单文件会被明确拒绝。但更大的资产（长视频、整包镜像、归档）
    仍没有存储级分块、可续传上传或分块校验；上传入口仍走 base64 一次性请求，峰值内存随文件线性上升。
    这部分要动提交树 / 对象格式 / 恢复事务与上传协议，不能靠调大常量解决，因此单独记为缺口。
  how: |
    1) 定分块资产格式：提交树里大文件用清单（chunk 列表）而不是单对象；对象仍内容寻址，GC / 恢复 / 物化
       按清单可达集合处理。
    2) 读路径：pull / versions / restore 按 chunk 流式拼装；versions 只读清单与预览窗口。
    3) 写路径：commit 支持按清单登记；上传改为流式 / 可续传（不再 base64 整包），并保留单文件与本次总量上限。
    4) 契约与验收：超大资产能进入共享区并被另一 agent 拉取、提交、显式选边；内存不随文件大小线性增长；
       补 T2 / T3 / T5 用例（含中断恢复与 GC 可达性）。
  accept: |
    超过当前单文件上限的资产有分块 / 可续传路径，能 pull、commit、显式选边并恢复；
    读写内存有界；上传中断可续传；node run-tests.js 全绿。
  blocked_by: 缺少实现（当前只有流式 IO 与 64 MiB 上限；分块存储 / 可续传上传未实现）

- id: testing.coverage-child-and-platform
  scope: global
  level: T3
  why: |
    node run-tests.js --coverage 只覆盖测试进程内的代码。产品二进制（守门进程 solomni --fence-run、
    L4 端到端）由本入口单独 cargo build，未插桩，作为子进程运行不会被计入；平台 #[cfg] 代码在
    别的平台根本不编译。任何一份覆盖率都只代表"当前平台 + 进程内那几层"，当全貌会误导。
  how: |
    1) 三平台各自跑一次（与 T4 平台探针同一矩阵）；
    2) 若要把子进程计入：产品构建也用同一插桩（-C instrument-coverage），LLVM_PROFILE_FILE 带 %p
       传播到子进程，收尾合并 profraw；
    3) 产出"未覆盖清单"后逐条决定补测或记缺口；补齐能力的"可用 / 缺件 / 补齐后可用"三态探针也按平台各覆盖一次
       （Linux 已有真机验证；Windows / macOS 待各自平台）。
  accept: |
    三平台各有一份覆盖率报告，且报告明确标注"仅进程内 / 仅当前平台"或已聚合子进程；
    未覆盖的生产路径逐条有补测或缺口结论。
  blocked_by: 缺少观察面（子进程插桩与合并尚未实现）

- id: vm.windows-macos-guest
  scope: global
  level: T4
  why: |
    当前 fenced guest 执行只承诺 Linux guest 的 /bin/sh；Windows guest 与 macOS guest 的
    guest 内工具 / shell、围栏、agent 通道本期都不开发。macOS 已有 fence.guest-tier-not-wired
    等平台缺口；Windows 没有对应能力。
  how: |
    本期不做；文档与产品状态如实写“不可用”，不把 Windows/macOS guest 当成已支持。
    将来做需要：Windows guest 镜像与 guest 内 agent / 围栏 / PowerShell 通道；macOS 按现有平台缺口补。
  accept: |
    文档、启动报告与界面都如实说 Windows/macOS guest 本期不可用；任何代码路径不声称支持；
    对应的平台缺口保留。将来补齐时另立验收。
  blocked_by: |
    本期不做（用户决定）；macOS 另有平台机制缺口，Windows guest 需要完整的新机制。

- id: release.binary-distribution
  scope: global
  level: T5
  why: |
    产品承诺"发行版二进制为纯 Rust，用户开箱即用，不装环境"，但仓库里没有任何发布链路：没有 release 工作流
    （`.github/workflows` 只有 test / pins / mutants），没有打包脚本，也没有"拿到二进制怎么跑"的说明。现实里唯一的
    入口是 `node start.js`——它要先有 Rust 才能构建核心，所以"用户"目前等于开发者。
    还有一件未决的事是**构建口味**：CI 借 Windows runner 自带的 msvc 工具链，而项目内安装的（`env.js` 的
    `installRust`、`setup-dev.js`）统一是 GNU。若发行产物由 msvc 产出，"本机绿"与发行版就不是同一套编译器 /
    CRT / 链接器行为（raw-dylib、FFI 与 CRT 交互都在其中）；反过来 GNU 产物需要实测不依赖 MinGW 运行时 DLL。
  how: |
    1) 定发行口味并让 CI 与本地一致：选 msvc 则发行构建机必须有 VS C++（开发者不必装），选 GNU 则 Windows 构建机
       要备 GNU 工具链 + winlibs，并实测产物不依赖 libgcc_s_seh-1.dll / libwinpthread-1.dll，核对默认 CRT 静态性；
    2) 加 release 工作流：三平台 `cargo build --release` + 打包（二进制 + `modules/` 布局）+ 校验和；
    3) 写"二进制用户"文档（不需要 Node / Rust / `start.js`），与 README 现在的"运行环境 / 开发环境"两层对齐或替换；
    4) 验收：在一台**没有** Node、Rust、VS 的干净机器上解包即跑。
  accept: |
    三平台各有可下载的发行产物与校验和；干净机器（无 Node、无 Rust、无 VS）解包即能启动；
    构建口味与 CI 一致且有记录；README 的安装与运行一章只描述真实存在的两条路径。
  blocked_by: |
    本期不做（用户决定：仍在开发阶段）。发行链路与口味统一需要新建 CI 工作流与打包脚本，另立任务。

- id: workspace.external-root-vm-tier
  scope: global
  level: T4
  why: |
    外部工作区（会话把共享区主副本绑定到产品根之外的绝对目录）在 Windows 真机（WHPX + SMB 的探针与 e2e 场景）
    与代码 / 单测两层已收口：
    虚拟机档的稳定挂载拆成会话树根（rw）+ 外部工作区根（rw，仅外部绑定时）+ 模块树根，不再用
    shared.parent()；起 guest 前校验各 agent 私沙在会话树根下、每个稳定根能经路径桥往返，不能表示的根
    （Windows UNC / 网络路径）如实拒绝（映射盘符不解决，支持计划见 workspace.external-root-unc）；
    建会话失败时 discard 连版本库 .work 一起清。
    外部工作区根保持可写——宿主会把只读挂载无条件并入每次调用的允许集，只读会绕过 per-agent 的共享区
    读取范围；guest 不直接写共享区，写共享区走宿主侧 work_commit。
    仍缺 Linux 真机验收：virtiofs（默认档）与 9p（回退档）两条用户链都还没跑过「绑定外部根后 guest 内
    读写工作区、越界被拒」；Windows 侧 SMB 档已通过 vm_live_external_workspace_round_trip 与 e2e 外部工作区
    场景（读外部根 / 写私沙落宿主 / 写共享区被拒 / 删会话不删外部根），macOS 由既有平台缺口阻断、不在本条范围。
  how: |
    在有 KVM 的 Linux 真机上跑外部工作区往返探针（虚拟根默认 debian，可用 SOLOMNI_VM_GUEST 换）：
    `SOLOMNI_VM_LIVE=1 SOLOMNI_VM_QEMU=<.vm/qemu/bin/qemu-system-x86_64> node dev.js cargo -- test --bin solomni -- vm_live_external_workspace_round_trip`
    virtiofs 变体再设 `SOLOMNI_VM_VIRTIOFSD=<.vm/virtiofsd/virtiofsd>`；9p 变体不设它（候选落到 9p），
    两个变体各跑一次并把命令与回执贴进 PR。
  accept: |
    Linux 的 virtiofs 与 9p 两个共享档各有一条真机通过：绑定产品根之外的目录能起 guest、工具在 guest 内
    读写该工作区、越界被拒、会话树里的私沙仍可用；证据（命令与回执）贴在 PR 上。
  blocked_by: 缺少 Linux KVM 真机

- id: workspace.external-root-unc
  scope: global
  level: T4
  why: |
    Windows 的 UNC / 网络路径（\\server\share\dir，以及映射到网络共享的盘符）暂不能作为外部工作区。
    本轮只把现状与失败原因如实记清（并纠正"先映射成盘符"的错误建议）；真正支持按方案 B：
    先修 rust-smb-server 依赖的 cap-primitives，再由产品支持 **Windows 虚拟机档** 的 UNC 外部工作区
    （本机档因 Windows 容器围栏限制明确不做网络工作区）。
    调查证据（Windows 真机 + 源码）：
    1) 产品绑定层：canonicalize 的 \\?\UNC\… 被 kernel/domain/path.rs 的 native() 只剥 \\?\ 前缀，
       变成相对路径 UNC\server\…（entry/root.rs 与 kernel/detail/confine/mod.rs 另有两处同款副本）。
       这是"创建即失败"的直接原因；修好这三处是 B 的前置，但不构成支持（见第 2/3 条）。
    2) 虚拟机档阻塞（决定性）：smbd helper 用 cap-primitives 3.4.6 的 Dir 打开共享根；其 Windows
       get_path 只剥 4 个字符 \\?\，把句柄的 \\?\UNC\server\share\… 变成相对路径 UNC\server\…；
       read_dir / create_dir / remove_file / remove_dir / rename 都用它拼路径再调 std::fs（路径式 API
       按进程 CWD 解析）。真机匿名 SMB 实测：open / read / write / stat / 卷信息正常；目录枚举、
       建目录、重命名返回 STATUS_OBJECT_NAME_NOT_FOUND；删除返回成功但宿主文件仍在（delete-on-close
       失败只 warn，见 helper 的 files/table.rs）。cap-primitives 3.4.6 / 4.0.3 / 上游 main 同代码，
       升依赖无效；把共享映射成本地盘符也不行（句柄 final path 仍是 \\?\UNC\…）。因此 guest 即使
       cifs 挂载成功，一 ls 就失败，VM 档不可用；产品侧无法绕过，必须先修 helper。
       上游现状：同一根因已在 cap-std 的 issue #318（2023，entries 失败）与 #348（2024，
       UNC / DOS device 路径）记录；维护者说明 proper fix 需要把剩余"路径拼接 + 路径式 API"
       迁移到 NtCreateFile，且 cap-std 已移出 Bytecode Alliance、作者称仅最小维护并考虑归档
       （issue #426）。因此不能把"等上游发版"当唯一路径，需要下游补丁。
    3) 本机档阻塞：Windows 容器只授 internetClient（container.rs:221-242/259-275），不授
       privateNetworkClientServer、不做 loopback 豁免；文件围栏 ACL 还是递归 TreeSetNamedSecurityInfo，
       对网络共享会递归改远端 DACL。无围栏的降级模式不算能力承诺，所以本机档不做网络工作区。
    4) 连带安全问题（B 实施时必须同批修，否则开放 UNC 会引入越界与并发风险）：
       - UNC 别名可绕过"外部根与产品根互不包含"的文本 starts_with 校验（实测
         \\localhost\D$\…\Solomni 与产品根 FileID 相同）；
       - 跨会话工作区锁按 canonical 字符串做键，同一物理目录的 UNC / 盘符两种写法会拿到两把锁；
       - same_host_path 的 lossy 比较会把非 UTF-8（unpaired surrogate）路径误判成可往返，破坏路径桥单射。
    5) 入口：Web 创建工作区的输入框只读、目录选择器只列盘符，UNC 目前只能经 API 的 workspace 传入；
       B 实施时要放开输入并做后端校验。
  how: |
    方案 B（先上游、后产品；本轮不实施）：
    一、上游 helper（不必等上游发版）
    1) 修 cap-primitives 的 Windows 路径重建：get_path 对 \\?\UNC\server\share\… 不能只剥 \\?\；
       短期最小补丁是还原成非 verbatim 的 \\server\share\…（与盘符分支同策略；\\?\Volume{} 等
       不可还原的保持原样），补 read_dir / create_dir / remove / rename 的 UNC 回归测试；
       彻底方案是把剩余的路径拼接 + 路径式 API 迁到 NtCreateFile（与上游维护者的判断一致）。
       同时在 cap-std issue #318 / #348 评论（避免开重复 issue）并附本仓复现与补丁链接。
    2) smbd helper（theRMM714/rust-smb-server）：不必等上游 release——在 fork 里用
       [patch.crates-io] 指向自己 fork / vendor 的 cap-primitives（只有 UNC 归一化一个补丁），
       或直接 vendor 源码；补 helper 级 UNC 共享根测试（枚举 / 建 / 改名 / 删必须真生效）；发新
       Release（如 smbd-v0.1.1）。FORK.md 的"不维护上游补丁"策略按实际做法更新为
       "临时补丁 + tracking issue；上游发版后移除"。
    3) 产品依赖：node pins.js bump smbd <新 tag>（同时更新 links.yaml 的 URL + sha256），同步
       dependencies.yaml 的 note（helper 版本 / 能力），再跑 pins check。
    二、产品侧（Windows，范围 = 虚拟机档；本机档明确拒绝网络工作区）
    1) 收敛 native() / entry/root.rs::strip_unc_prefix / confine/mod.rs::strip_verbatim_prefix 三处
       同款剥离逻辑为一个 kernel helper（按 Prefix::VerbatimUNC / VerbatimDisk 重建，保留 \\?\Volume{}
       等不可还原形态）；新增 is_network_path(Path)（覆盖 // 与 \\ 两种写法）。
    2) 路径桥：posix_mirror / posix_unmirror 增加 UNC 段编码
       /solomni-host/unc/<server>/<share>[/<rest…>]（raw 段；server/share 用 Prefix::UNC 取段，
       不要用 as_os_str；非 UTF-8 与 . / .. 段拒绝）；保持 GuestMount.guest == bridge.to_guest(host)，
       不做双根 codec。
    3) 绑定：resolve_workspace_binding 增加档位参数——本机档对网络路径（UNC + GetDriveTypeW=DRIVE_REMOTE
       的映射盘）在 canonicalize 之前拒绝（不触网、无凭据提示）；虚拟机档允许 UNC，拒绝共享根
       （\\server\share 的 parent()==None，文案说清绑到共享下目录）与非 UTF-8。
    4) 落点身份与锁：用 (volume serial, file index)（Windows FFI）做 same-location 与外部根 / 产品根
       物理包含校验；锁键改用落点身份而不是 canonical 字符串；同批补"手改 meta"的加载复检。
    5) 起 guest 前 check_stable_roots 接受 UNC（round_trips 通过）；mount 计划与 per-call 围栏逻辑不变。
    6) Web：创建工作区的输入框允许手填 UNC，错误由后端如实展示。
    7) 测试：
       - T1（cfg(windows) 纯逻辑）：native / strip 的 UNC 还原、is_network_path、
         PathBridge UNC 往返 / 无歧义 / 拒绝 verbatim 与非 UTF-8、stable_roots + check_stable_roots、
         绑定分档拒绝文案与"不触网"、same_location（硬链接）；
       - T2（假引擎 / 假工作区）：VM 档 UNC 外部根的 mounts 计划含 UNC host 与编码后的 guest 点；
         本机档拒绝；
       - T4（真机，SOLOMNI_UNC_ROOT 指向可写 UNC 目录，缺省 [探针] 跳过）：绑定 / 导入 / pull / commit /
         sync / status、.work-root 为 native UNC、删会话不删外部；产品根 UNC 别名必须拒；VM 档 SMB 真机
         探针（guest 读 UNC 根、写私沙落宿主、写共享区被拒、删会话不删外部；**断言目录枚举 / 建 / 改名 /
         删除全部真生效**）；
       - L4 e2e：设 SOLOMNI_UNC_ROOT 才跑 UNC 第二遍，同一组断言，不新开场景。
    8) 文档：docs/workspace、docs/session、docs/vm、docs/tools 的路径模型、docs/testing/execution-ci、
       PRODUCT / README 同步为"Windows 虚拟机档支持 UNC；本机档明确拒绝；映射盘符不解决；
       凭据 = 当前登录用户；共享根 / 不可达 / 无权限按真实原因拒绝"。
    三、补丁/上游修复后的收尾顺序
    1) 我们的 fork 补丁（或上游合并后的 release）可复现构建 → 新 smbd Release 可下载
       （URL + sha256 已发布）；上游正式发版后把 [patch] 切回 registry 版本（可再发一次，不阻塞 B）；
    2) 产品升 pins（links.yaml / dependencies.yaml）并全绿；
    3) 按上面 7 的 T1 / T2 / T4 / e2e 在 Windows 真机跑通，把命令与回执贴进 PR
       （SOLOMNI_UNC_ROOT 用本机可写 UNC 目录，如 \\localhost\D$\…；CI 无 UNC / WHPX，不能代劳）；
    4) node run-tests.js 全绿（node run-tests.js --docs 亦绿），文档改成支持状态；
    5) 删除本条缺口。若上游修复长期不落地，本条保留在 global 账（不挪进 tests/windows/gaps.yaml，
       避免影响 TEST-REPORT-ACCEPTED）。
  accept: |
    Windows 虚拟机档：UNC 外部工作区能绑定、起 guest；guest 内目录枚举 / 读 / 建 / 改名 / 删除全部真生效
    （删除后宿主文件确实消失），写私沙落宿主、写共享区被拒、停 / 删会话不删外部；路径桥 UNC 编解码与
