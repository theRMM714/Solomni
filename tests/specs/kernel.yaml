# 内核（地基，不是业务单元） 的用例声明（一个单元一份；文件名 = 单元名）。
# 文件级条目：一个 Rust 测试模块 = 一条；搬实现只改适配层，这里仍指向行为。
# 格式：- id: cargo/tests::<模块路径> | e2e/<旅程 id>，紧跟 tier 与一句 note。

unit: kernel
title: 内核（地基，不是业务单元）

mutation:
  schedule: weekly
  files:
    - src/kernel/detail/confine/paths.rs
    - src/kernel/detail/confine/ledger.rs
    - src/kernel/detail/unpack.rs
    - src/kernel/domain/path.rs
cases:
  - id: cargo/tests::detail::logs
    tier: T1
    note: 日志落盘
  - id: cargo/tests::entry
    tier: T1
    note: 组合根
  - id: cargo/tests::kernel
    tier: T1
    note: 内核：路径/围栏/进程
