# 常驻服务 的用例声明（一个单元一份；文件名 = 单元名）。
# 文件级条目：一个 Rust 测试模块 = 一条；搬实现只改适配层，这里仍指向行为。
# 格式：- id: cargo/tests::<模块路径> | e2e/<旅程 id>，紧跟 tier 与一句 note。

unit: residents
title: 常驻服务
cases:
  - id: cargo/tests::mcp
    tier: T1
    note: 常驻服务（MCP）起停
  - id: e2e/parent-death
    tier: T5
    note: 父死子亡：核心被强杀后常驻服务进程跟着消失
  - id: cargo/tests::residents
    tier: T1
    note: 常驻服务：起停、崩溃标记、按租约回收
