# 引导与工具链 的用例声明（一个单元一份；文件名 = 单元名）。
# 文件级条目：一个 Rust 测试模块 = 一条；搬实现只改适配层，这里仍指向行为。
# 格式：- id: cargo/tests::<模块路径> | e2e/<旅程 id>，紧跟 tier 与一句 note。

unit: provision
title: 引导与工具链
cases:
  - id: cargo/tests::provision::ports
    tier: T2
    note: 端口契约：引导
  - id: cargo/tests::provision::service
    tier: T1
    note: 工具链引导
  - id: cargo/tests::toolchains
    tier: T1
    note: 工具链与环境引导
