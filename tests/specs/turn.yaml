# 一轮推进与环境 的用例声明（一个单元一份；文件名 = 单元名）。
# 文件级条目：一个 Rust 测试模块 = 一条；搬实现只改适配层，这里仍指向行为。
# 格式：- id: cargo/tests::<模块路径> | e2e/<旅程 id>，紧跟 tier 与一句 note。

unit: turn
title: 一轮推进与环境
cases:
  - id: cargo/tests::env
    tier: T1
    note: 环境快照
  - id: cargo/tests::flow
    tier: T1
    note: 流程面：替身流程跑在同一条驱动循环上
  - id: cargo/tests::session::turn
    tier: T1
    note: 一轮对话推进
