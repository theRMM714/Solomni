# 构建与存储回收 的用例声明（一个单元一份；文件名 = 单元名）。
# 文件级条目：一个 Rust 测试模块 = 一条；搬实现只改适配层，这里仍指向行为。
# 格式：- id: cargo/tests::<模块路径> | e2e/<旅程 id>，紧跟 tier 与一句 note。

unit: maintenance
title: 构建与存储回收
cases:
  - id: cargo/tests::boot
    tier: T1
    note: 启动装配与回收（也覆盖 catalog 登记处装载）
  - id: cargo/tests::storage
    tier: T1
    note: 存储回收
  - id: cargo/tests::builds
    tier: T1
    note: 构建入口判据与拒收说辞
