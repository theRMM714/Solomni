- id: harness.fence-clean-under-restricted-token
  scope: global
  level: T4
  why: |
    L4 收尾用 `spawnSync(BIN, ["--fence-clean", …], { encoding: "utf8" })` 回收围栏痕迹。在受限令牌
    （低完整性 / 沙箱）下，Node 的**管道 stdio 捕获会被拒（EPERM）**：`status` 变成 null、输出为空，
    编排把这一情形判成"本机留下了没人管的痕迹"（硬失败）——而实际是**环境不允许执行**。
    真失败（回收真跑了但没撤干净）与环境不允许必须分开，否则受限 shell 里 L4 永远红，且红得指向错误的方向。
  how: |
    围栏回收改成 `stdio: "inherit"`（与 driver / mock 同一条口径，不抓管道），或按 `spawnSync` 的
    `error` / `status === null` 分辨"没能执行"（如实标注环境不满足并打印原因）与"执行了但失败"（硬失败）。
  accept: |
    受限环境下如实标注"环境不允许回收"（env-skip + 原因），不判成留下痕迹；
    普通环境与 CI 上回收失败仍然是硬失败。
  blocked_by: 缺少实现
- id: harness.acl-ops-denied-on-volume
  scope: global
  level: T4
  why: |
    在普通 / 提权 shell（Medium 完整性）里，项目工作副本所在卷上的 DACL **读写都返回错误码 5**：
    doctor 报「改不动目录 ACL（读 DACL 失败…错误码 5）」，而
    grants_are_written_when_the_environment_allows_it 从「环境不允许、如实跳过」变成**真失败**
    （授权应当成功：Some(写 DACL 失败（…\target\tmp）：错误码 5)）。
    原因未定：卷不支持 ACL（exFAT / 网络盘之类）或权限不足——需要 fsutil fsinfo volumeinfo <盘符> 判定。
    无论哪种，结论都是：**这份副本上容器围栏与 ACL 类验收不成立**，真机围栏结论只能在 CI / 一次性 runner 上取。
  how: |
    先判定卷是否支持 ACL；不支持就把它写成「本机不能验收 ACL 类探针」的**环境不满足**（像其它 env-skip 一样
    如实标注），不让它以断言失败的形式出现（否则卷不支持会被读成产品缺陷）；支持则查权限来源并修。
  accept: |
    卷不支持 ACL 时，ACL 类探针与 doctor 一致地报「环境不满足」且不判失败；支持 ACL 的环境上授权 / 撤权探针真跑并通过。
  blocked_by: 缺少判定（卷能力）与实现（环境不满足的标注口径）

- id: harness.tool-python-unresolved
  scope: global
  level: T3
  why: |
    L4 的真工具场景里，工具进程执行 `python …` 报 not recognized（harvest.scan → corpus.jsonl 缺席 → indexer 全挂）。
    已在 Medium 完整性下用**与产品同一份环境白名单**（env_clear + PATH/PATHEXT/SystemRoot/COMSPEC/SYSTEMDRIVE，
    并把 LOCALAPPDATA/USERPROFILE/HOME/TEMP 改指沙箱）直接复现：`cmd /c python -c …` 与 `where python` **都成功**，
    且 `python.exe` 是 591360 字节的 **HardLink（真二进制，不是依赖 LOCALAPPDATA 的 shim）**——
    所以"白名单 / shim 依赖"这两个假设**已被证伪**，真正原因**尚未定位**。
    **最小复现（可直接跑）**：`solomni.exe --fence-run <扁平 FenceJob json> -- "where.exe python"`。
    在**同一次 Medium 完整性**的执行里：shell 里 `python --version` → 3.14.7、`where python` 找到真身；
    而经这条链的工具进程里 `where.exe python` → 找不到、python 的**绝对路径** → `Access is denied.`。
    环境已排除：工具进程的 `set` 显示 PATH 里就有 `…\Python\bin`，且它跑的只是 `KILL_ON_JOB_CLOSE |
    ACTIVE_PROCESS` 的 Job（没有安全限制），守门进程 `guard::fence_run` 也只做 argv 分发。
    剩下两条待查方向：①工具进程启动时的**令牌**（是不是带着受限 SID）；②该目录上是否残留了
    只对本程序令牌生效的 ACE（本项目自己的围栏会写/撤 ACL，"孤儿 ACE 把目录对受限进程藏住"正是已知形态）。
  how: |
    抓一次**真实工具进程**的环境与令牌（例如让工具打印 `set` 与 `whoami /groups`，或用 Process Monitor 类工具看
    它拿到什么 PATH），再对照本脚本的白名单复现；定位后修启动路或白名单，并补一条真进程用例。
  accept: |
    在这台机器（新版 Python 安装管理器 + 普通 shell）上，模块的 python 工具在白名单环境里跑通；
    白名单仍不泄漏无关凭据。
  blocked_by: 缺少定位（真实工具进程的环境 / 令牌）
