# 跨平台层的缺口账（当前状态：条目存在 = 这条测试还没有；补上就删条目）。
#
# 「删会话即请求撤销授权」的接线已完成（由 src/tests/core.rs 的
# deleting_a_session_asks_the_fence_to_release_its_grants 钉住）；真实撤权机制是否生效另记在
