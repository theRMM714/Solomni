- id: harness.fence-clean-under-restricted-token
  scope: global
  level: T4
  why: |
    L4 收尾用 `spawnSync(BIN, ["--fence-clean", …], { encoding: "utf8" })` 回收围栏痕迹。在受限令牌
    （低完整性 / 沙箱）下，Node 的**管道 stdio 捕获会被拒（EPERM）**：`status` 变成 null、输出为空，
    编排把这一情形判成"本机留下了没人管的痕迹"（硬失败）——而实际是**环境不允许执行**。
    真失败（回收真跑了但没撤干净）与环境不允许必须分开，否则受限 shell 里 L4 永远红，且红得指向错误的方向。
  how: |
    围栏回收改成 `stdio: "inherit"`（与 driver / mock 同一条口径，不抓管道），或按 `spawnSync` 的
    `error` / `status === null` 分辨"没能执行"（如实标注环境不满足并打印原因）与"执行了但失败"（硬失败）。
  accept: |
    受限环境下如实标注"环境不允许回收"（env-skip + 原因），不判成留下痕迹；
    普通环境与 CI 上回收失败仍然是硬失败。
  blocked_by: 缺少实现
- id: harness.local-run-elevation-unverified
  scope: global
  level: T4
  why: |
    受限令牌会话（低完整性 / 文件沙箱）里跑门禁会拿到假失败（解释器不可达、改 DACL 被拒、管道 stdio EPERM）。
    文档给了两条出路：换普通 shell（常规），或**对单次执行放宽沙箱（提权）**。后者在当前会话里试了两次，
    都因**无人批准**而根本没有启动（无输出、无日志），所以"提权能拿到与普通 shell 同一种结论"这句话
    **还没有被实际验证过**；它必须有人批准，批不到就一直等。
  how: |
    在一次放宽沙箱的执行里跑 `node run-tests.js`，把 L4 的结论与普通 shell 的结果对照（同一种结论才算成立）；
    验过之后把 docs/testing/execution-ci.md 里那条"尚未验证"的说明删掉、删本条目。
  accept: |
    放宽沙箱的一次执行里 L4 通过，且与普通 shell 的结论一致（或如实说明差异）；文档不再标"未验证"。
  blocked_by: 缺少实现（需要人工批准的一次性提权执行）
