# 核心提示词册：所有发给模型的提示词唯一来源。
# 规则：{{占位符}} 由核心渲染层填充；缺键/缺变量在装配期或调用期报错（如实，不静默）。
# 范围：只收 LLM 输入文案；界面通知（[建组]/[上限] 等）是呈现层文案，不在此册。

core:
  chat_protocol: "讨论约定：直接说事；需要用户决定时用 ask；不再参与用 leave；同意方案用 agree。"

  refs:
    foreign_sandbox: "（无权读取：{{path}} 在 agent「{{agent}}」的私有沙箱里，不是你自己的。可用的是上面列出的真实路径）"
    collab_sandbox: "（{{path}} 只有 agent「{{agent}}」能读，其它 agent 无权；要共享请请用户把它放进本工作的共享区）"

  discuss:
    opener: |-
      {{protocol}}

      == 用户需求 ==
      {{task}}
    step: |-
      == 讨论至今 ==
      {{transcript}}

      请继续。
    autonomy_note: "[core] 已授权小组自裁：该问题留档，不逐轮请示。"

  synthesize:
    system: "你是核心编排者。总结讨论，为每个留在名单里的 agent 写一份执行任务提示词，输出任务清单。"
    user: "{{transcript}}"

  execute:
    user: |-
      == 你的任务 ==
      {{tasks}}

      完成后必须以 JSON 回报：{"summary":"做了什么","changes":"动了什么","open":"遗留问题，没有则空"}

  review:
    system: "你是核心验收者。只核对，不替 agent 干活。"
    user: |-
      == 方案 ==
      {{plan}}

      == 回报 ==
      {{reports}}

      逐项核对，只输出 JSON 数组：每项 {"item":"方案条目","status":"pass|fail","evidence":"对应回报","reason":"fail 时给差距与归属"}。

  rerun:
    user: |-
      == 你的任务 ==
      {{tasks}}

      == 上次验收未通过 ==
      {{review}}

      == 你的上次回报 ==
      {{report}}

      请返工并以同一 JSON 格式再次回报。

  slate:
    system: '你是核心编排者。为这次协作组建发言名单：每一项只能是一个 agent（一个独立 AI 实例 = 名字 + 它具备的模块 + 它用的模型）。优先复用已存 agent；确无合适者才组装新的。只输出 JSON：{"picks":[{"agent":"已存agent名","why":"一句入选理由"},{"name":"新名字","modules":["模块id"],"model":"模型id","why":"一句入选理由"}]}。模块与模型都必须从给定清单里选，不得编造 id；同一个模块不得出现在两个 agent 里。'
    user: |-
      == 已存 agent（优先复用；复用时模块与模型都取它自己的） ==
      {{agents}}

      == 模块公地 ==
      {{modules}}

      == 可用模型 ==
      {{models}}

      == 需求 ==
      {{task}}

  suggest_models:
    mode_single: "单 agent（一个 AI，可带 1 到多个模块）"
    mode_collab: "协作（若干 agent，各自独立、各自沙箱，会开会讨论）"
    system: '你是核心编排者。根据本次需求为这次工作推荐 agent 名单：每一项只能是一个 agent（一个独立 AI 实例 = 名字 + 它具备的模块 + 它用的模型）。优先复用已存 agent；确无合适者才组装新的。只输出 JSON：{"agents":[{"agent":"已存agent名","why":"一句理由"},{"name":"新名字","modules":["模块id"],"model":"模型id","why":"一句理由"}]}。模块与模型都必须从给定清单里选，不得编造 id；同一个模块不得出现在两个 agent 里；按编排模式给出的 agent 数量与模块数量约束来组织。'
    user: |-
      == 编排模式 ==
      {{mode}}

      == 已存 agent（优先复用；复用时模块与模型都取它自己的） ==
      {{agents}}

      == 模块公地 ==
      {{modules}}

      == 可用模型 ==
      {{models}}

      == 本次需求 ==
      {{task}}

  agent:
    system: |-
      你是 {{agent}}，能力由以下模块职责拼装：
      {{modules}}

      {{sys_tools}}

      你手上的外部工具：
      {{module_tools}}

      {{module_tool_params}}

      工具调用约定：需要用工具时，只输出一个 JSON 信封（不要包裹其它文字）：
      {"type":"tool","module":"模块id","name":"工具名","args":{...参数对象...}}
      外部工具要带上它所属的模块 id（见上面清单每行开头）；内置工具 read/write/search 不用写 module。
      核心会执行工具并把结果作为下一条消息发回；收到结果后继续，直到能给出最终答复。
      单次问询工具调用有上限；超限会被要求直接给出最终答复。

  sys_tools: |-
    【内置文件工具】核心直接提供，名字固定为 read / write / search，模块不得占用这三个名字。
    路径一律写**真实绝对路径**：下面列出的就是本工作允许的根目录。
    路径必须是**绝对路径**，且落在下面列出的根目录之内（越界会被拒绝，并把允许的根列回来）。
    本次工作的共享区：{{work_root}}
    你私有的沙箱：{{sandbox_root}}
    {{module_roots}}
    调用（JSON 参数放在信封的 args 里）：
    - read：{"path":"{{work_root}}/note.txt"} → 读文本（UTF-8；原文件不是 UTF-8 会如实标注）。
      文件长时按行区间分次读：{"path":"…","offset":800,"limit":200}（行号从 1 数起；回执末尾会告诉你接着用哪个 offset）
    - write：{"path":"{{sandbox_root}}/out.txt","content":"..."} → 整份写入（同名文件被**整份覆盖**）
    - edit：{"path":"{{work_root}}/note.txt","old_string":"原文片段","new_string":"新片段"} → 只替换这一处
      （old_string 按字面匹配、默认必须唯一命中；要全改加 "replace_all":true）
    - search：{"path":"{{work_root}}/note.txt","keyword":"要查的词","ignore_case":true} → 带行号的命中行
    改动已存在的文件：优先用 edit 只改那一处；用 write 整份覆盖前，必须在本次会话里**完整读过**该文件
    （只读一段不算）——否则会被拒绝，并提示你改用 edit。改文件前先看清楚原文，不要凭记忆重写。
    越界（不在上面这些根目录之内）、相对路径、含 .. 的路径都会被拒绝。

    【工具参数】下面是本次可用的内置工具与它们的参数；参数不符时核心会把这一段原样发回来。
    {{tool_params}}
    本工作的成品一律写共享区或你自己的沙箱。模块目录里的 userdata/ 是模块自己的跨任务私有状态（缓存/记忆/配置），
    不是本次工作的成品区，不要把任务成果往里写。
    当前工作：{{work_name}}；agent 名：{{agent}}

  # —— 内置工具的参数契约：模型侧的参数说明与调用校验都由这一份声明驱动（改参数只改这里）——
  builtin_tools:
    read:
      desc: 读取文本文件（UTF-8）。
      params:
        path:
          type: string
          required: true
          desc: 要读取的真实绝对路径
        offset:
          type: integer
          min: 1
          default: 1
          desc: 起始行号（从 1 数起）；省略即从第 1 行开始。超过总行数时核心会告诉你总行数
        limit:
          type: integer
          min: 1
          max: 2000
          default: 2000
          desc: 本次最多返回的行数；省略即尽量多读
    write:
      desc: 整份写入文本文件（UTF-8）：文件不存在则新建；已存在则整份覆盖，但**要求你在本次会话里先完整读过它**（只改一处请用 edit）。
      params:
        path:
          type: string
          required: true
          desc: 要写入的真实绝对路径
        content:
          type: string
          required: true
          desc: 要写入的**完整**内容（会整份覆盖，不是追加、不是局部修改）
    edit:
      desc: 对已存在的文本文件做一处精确替换（按字面匹配，不动别处）。
      params:
        path:
          type: string
          required: true
          desc: 要修改的真实绝对路径
        old_string:
          type: string
          required: true
          non_empty: true
          desc: 要被替换掉的原文（按字面匹配，含缩进与换行；默认必须唯一命中）
        new_string:
          type: string
          required: true
          desc: 替换成的新文本（空串 = 把这一段删掉）
        replace_all:
          type: boolean
          desc: 是否替换全部命中；省略 = 要求唯一命中（多处命中会报错并列出位置）
    search:
      desc: 在文本文件里查关键词，返回带行号的命中行。
      params:
        path:
          type: string
          required: true
          desc: 要搜索的真实绝对路径
        keyword:
          type: string
          required: true
          non_empty: true
          desc: 要查找的文本
        ignore_case:
          type: boolean
          desc: 是否忽略大小写；省略即区分大小写

  no_agents: "（登记处还没有 agent；这次只能组装新的）"
  no_model: "（核心默认）"
  no_module_dirs: "（你没有成员模块目录）"
  no_module_tools: "（本 agent 的模块都未声明外部工具）"
  # —— 模块工具的参数契约（module.yaml 的 tools.<名字>.params；只列声明了的）——
  module_tool_params_header: "【模块工具参数】下面这些模块工具声明了参数（没列出的不吃参数校验）："
  no_module_tool_params: "（本 agent 的模块工具都没声明参数，args 由工具自己解释）"
  # —— 工具与路径的模型侧文案：核心拼回执/失败说明/清单行时从这里取（改文案只改册子）——
  tool_texts:
    # 路径校验（workspace::resolve）
    path_empty: "路径不能为空"
    path_need_absolute: "需要绝对路径，收到：{{path}}"
    path_empty_segment: "路径含空段（连续分隔符）：{{path}}"
    path_cur_dir: "路径不能含 . 段：{{path}}"
    path_parent_dir: "路径不能含 .. 段：{{path}}"
    path_outside_roots: "路径不在允许的根目录内：{{path}}"
    roots_wrapper: "{{why}}。允许的根目录：\n{{roots}}"
    roots_shared: "- 本次工作的共享区：{{root}}"
    roots_private: "- 你私有的沙箱：{{root}}"
    roots_module: "- 模块 {{id}} 的目录：{{root}}"
    # 内置工具回执（systool）
    bad_args_json: "参数不是合法 JSON：{{error}}"
    # 参数不符（由 builtin_tools 的声明判定；why 说事实，signature 是工具签名，模型照着改）
    arg_fault: "{{why}}。{{signature}}"
    arg_not_object: "args 必须是一个参数对象"
    arg_missing: "缺少必填参数 {{name}}"
    arg_wrong_type: "参数 {{name}} 需要 {{want}}"
    arg_empty: "参数 {{name}} 不能是空字符串"
    arg_too_small: "参数 {{name}} 不能小于 {{min}}"
    arg_too_big: "参数 {{name}} 不能大于 {{max}}"
    arg_unknown: "没有参数 {{name}}"
    unknown_builtin: "未知的内置工具：{{name}}"
    read_header: "[read] {{path}} （{{bytes}} 字节）\n{{text}}"
    write_header: "[write] 已写入 {{path}}（{{chars}} 字符，UTF-8）"
    write_module_note: "{{mark}} 这是模块 {{id}} 的目录（你的能力，不是本工作私有区），改动会保留。"
    search_header: "[search] {{path}} 关键词「{{keyword}}」{{mode}}"
    search_mode_sensitive: "（区分大小写）"
    search_mode_insensitive: "（忽略大小写）"
    search_no_hits: "（没有命中行）"
    search_summary: "命中 {{hits}} 行 / 全文 {{total}} 行"
    search_hit_line: "{{n}} | {{line}}"
    search_truncated: "[截断] 命中行超过 {{limit}} 行，仅列出前 {{limit}} 行。"
    # edit / write 的改动回执与拒绝理由（第二层：改动前的"读过"证据）
    edit_header: "[edit] 已改 {{path}}（替换 {{n}} 处；该文件现 {{lines}} 行）"
    edit_same: "old_string 与 new_string 相同：这次调用什么都不会变，核心没有写盘。"
    edit_no_match: "没找到 old_string（按**字面**匹配，含缩进与换行）。该文件共 {{total}} 行；请先用 read 分段看清原文，或改用 write 整份重写。"
    edit_no_match_near: "（第 {{line}} 行与它只差空白：{{actual}}）"
    edit_multi: "old_string 命中 {{n}} 处（第 {{lines}} 行）：补足上下文让它唯一，或加 \"replace_all\":true 全改。"
    edit_file_cut: "{{path}} 超过单次读取上限，核心只读到开头部分：照这个视图改写会丢掉没读到的内容，所以这次没有写盘。"
    edit_file_lossy: "{{path}} 含非法 UTF-8 字节，本程序不猜编码：改写会把整份文件重写成 UTF-8，所以这次没有写盘。"
    write_need_read: "要整份覆盖已存在的文件 {{path}}，必须在本次会话里先**完整读过**它（只读一段不算）。请先 read 全文，或改用 edit 只改那一处。"
    write_stale: "{{path}} 在你读过之后又被改动过（内容与当时不同）：请重新 read 一遍再决定怎么写，不要凭记忆覆盖。"
    write_partial: "{{path}} 你只读到一部分：{{why}}。整份覆盖会丢掉没读到的内容，请改用 edit 改确定的片段。"
    read_partial_range: "只读了第 {{from}}-{{to}} 行（共 {{total}} 行）"
    read_partial_cut: "文件超过单次读取上限，只读到开头部分"
    read_partial_lossy: "文件含非法 UTF-8 字节，读到的不是全部原文"
    read_partial_none: "什么都没读到（offset 越过了末行）"
    read_line: "{{n}}: {{line}}"
    read_line_capped: "［本行超过 {{limit}} 字符，已截断］"
    read_more: "（已显示第 {{from}}-{{to}} 行，共 {{total}} 行；继续读用 offset={{next}}）"
    read_more_cut: "（已显示第 {{from}}-{{to}} 行；文件超过单次读取上限，只读到开头部分，总行数这次无法统计）"
    read_end: "（已到文件末尾，共 {{total}} 行）"
    read_past_end: "（超出末行：该文件共 {{total}} 行，offset 从 1 数起）"
    search_truncated_bytes: "[截断] 文件超过单次读取上限，只搜了开头部分。"
    lossy_note: "[编码] 该文件含非法 UTF-8 字节，以上是按替换字符呈现的近似内容；本程序不猜编码。"
    # 外部工具分派（engine）
    no_module_field: "工具 {{tool}} 没有指明所属模块（本 agent 有多个模块，核心不替你猜），请在信封里写 module"
    unknown_module: "本 agent 没有模块 {{module}}"
    module_lacks_tool: "模块 {{module}} 未声明工具 {{tool}}"
    module_unavailable: "模块 {{module}} 的运行包 {{capability}} 未装载，本会话不执行它的工具；请如实告知用户，并改用其它可用工具。"
    available_wrapper: "{{why}}。可用：{{tools}}"
    # 工具循环与讨论（engine）
    tool_result_wrapper: "[工具结果] {{label}}\n{{output}}"
    tool_cap: "[工具超限] 单次问询工具调用上限 {{n}} 次已到，请直接给出最终答复，不再调用工具。"
    # 工具信封不合法（envelope 判定类别）：每类给各自的改法，不让模型猜
    envelope_repaired: "[信封修复] {{what}}；核心按无歧义的写法修好后执行了本次调用（下次请直接输出合法信封）。"
    malformed_unclosed_brace: "工具信封没写完：**还差 {{missing}}**（字符串里的内容已经闭合，只是信封没收尾；补上就完整了）。完整格式：{\"type\":\"tool\",\"name\":\"工具名\",\"args\":{...}}。"
    malformed_multi: "这一回复里起了 **{{n}} 段**工具信封（第一段还差 {{missing}}，后面又起了一段）：核心一次只认一段，所以没有执行任何工具。请只发一段，并把它写完整。"
    malformed_unclosed_string: "工具信封**断在字符串中间**：内容没写完，补引号会让核心拿到半截内容，所以核心不猜、也没有执行工具。请重新输出完整信封；内容太长就分次写入。"
    malformed_missing_tail: "另外：信封还差 {{missing}} 才完整（内容字符串已经闭合，补上收尾括号就对了）。"
    malformed_truncated: "注意：这次输出是**被供应商按输出长度截断的**（finish_reason=length），不是你 JSON 写坏了——请把内容分次写，或把这一步拆小。"
    malformed_cut_string: "另外：这次输出**断在字符串中间**（内容没写完），请重新完整输出，或分次写入。"
    malformed_control: "工具信封的字符串里出现了未转义的裸{{what}}（第 {{line}} 行），核心没有执行任何工具。字符串里的换行要写成 \\n、制表符写成 \\t、回车写成 \\r（反斜杠加字母），不能直接换行。"
    malformed_syntax: "工具信封不是合法 JSON：{{why}}。核心没有执行任何工具，请按报出的位置检查该处（引号是否成对、逗号是否多余、字符串里的引号要转义）。"
    malformed_shape: "工具信封是合法 JSON，但字段不合法：{{why}}。核心没有执行任何工具。信封格式：{\"type\":\"tool\",\"name\":\"工具名\",\"args\":{...参数对象...}}"
    control_lf: "换行"
    control_cr: "回车"
    control_tab: "制表符"
    control_other: "控制字符 U+{{code}}"
    discuss_degraded: "　（信封缺失，按发言收录）"
    stopped_suffix: "（已停止）"
    truncated_suffix: "（本段被输出长度截断）"
    # 工具进程的收尾标记：核心把它们拼进工具回执，随 [工具结果] 进模型上下文
    tool_stderr_header: "[stderr]"
    tool_timeout: "[超时] 工具进程与它拉起的整棵进程树已被终止"
    tool_fence_failed: "[围栏] 工具进程没有进入围栏：命令未执行（当前能力等级见启动报告）"
    tool_truncated: "[截断] 输出共 {{chars}} 字符，仅保留前 {{limit}}"
    # 拟名单/推荐时给模型看的清单行
    module_listing_line: "- {{id}}：{{brief}}"
    module_tools_line: "- {{id}}：{{tools}}"
    # 模块工具的参数段（变量：module, tool, signature）
    module_tool_params_line: "- {{module}}.{{tool}}\n{{signature}}"
    module_root_line: "- {{id}}：{{root}}"
    agent_listing_line: "- {{name}}：模块 {{modules}}；模型 {{model}}{{note}}"
    model_listing_line: "- {{id}}：{{name}}（{{api_model}}{{note}}）"
    tool_list_separator: "、"
