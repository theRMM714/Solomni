# conductor 的业务缺口账。
# 业务 AI 只记缺口、不写测试；测试 AI 负责实现测试并销账，补齐后删除条目，不保留完成历史。
# 格式与判据见 docs/testing/gaps-acceptance.md §十二（id / scope / level / why / how / accept / blocked_by）。

- id: conductor.proxy-host-not-implemented
  scope: global
  level: T3
  why: |
    六个代理工具的宿主已接上真实会话：catalog（登记处 / 模块清单）、observe（不含正文的元信息）、
    messages（0 = 最新的倒查）、create_session（建**子工作**：parent 只表编排归属，own_work 让它有
    自己的 work/ 与沙箱）、control_session.stop（按 meta.parent **级联整棵子树**立即中断）。
    仍缺：send_session_message 真正把消息投进子会话（按子会话形态映射到 say / 派发行 / 协作步），
    pause / resume 的持久运行态，close 的在位语义，以及把建子工作的开场事实推给事件台。
  how: |
    proxy_send：先按 target 判形态——单 agent 的 task/review/rework 走派发行（note_task + 生成），
    user_reply/follow_up 走用户发言；协作子会话走它自己的阶段步与 decide；核心转达一律标注 core_proxy
    并进目标会话的可回放转录。proxy_control 补 pause/resume（持久运行态：冻结派发、可恢复）与 close
    （保留历史地停掉）。create 的开场事实经事件台外送。
  accept: |
    六个工具在真实会话上跑通：转达进目标转录且来源可查、pause/resume 可恢复、close 只在允许时执行、
    建子工作的开场事实在事件台可见；node run-tests.js 全绿。
  blocked_by: 缺少实现

- id: conductor.core-proxy-loop
  scope: global
  level: T3
  why: |
    core_proxy 角色与它的六个代理工具已经能被测试直接驱动，但没有一个生产调用点：
    核心代理的生成循环（模型调用 → 从工具参数取载荷 → 调 ProxyTools → 回灌结果）尚未落地，
    所以目前模型还调不动这六个工具，子会话的门也不会被投递到这里。
  how: |
    在 conductor 里加 core_proxy 的生成循环（与既有核心操作回路同源）：按角色发放工具面、跑模型、
    把代理工具的调用交给 ProxyTools、把回执按通道形态回灌；代理工具会改核心状态（建会话/派发），
    执行必须回到核心线程（握手），不破坏状态所有权。子会话的门与意外停止主动唤醒代理（不轮询），
    且不把子会话整份转录灌进代理上下文。接上后删掉三处 dead_code allow（见 docs/testing/quality-isolation.md §三）。
  accept: |
    真实模型（原生与手写信封两套通道）能连续调用六项代理工具完成一次代理流程；门由核心回答、
    越权/无授权调用如实拒绝并落工具行、中途停止立即生效。
  blocked_by: 缺少实现

- id: conductor.proxy-authorization-persistence
  scope: global
  level: T2
  why: |
    工具层已经要求「任务级授权 + 调用前校验 + 没有授权什么都不做」，但授权本身还没有来源：
    真实用户在哪里授予、怎么落盘、怎么回放，都还没有实现（产品级总缺口见 tests/gaps.yaml 的 core.agency-mode）。
    范围口径已定为**全权**（不做细粒度范围/期限），所以这一条的剩余部分只是“授权事实的来源与持久化”。
  how: |
    在会话 meta 里落一个**全权委托标志 + 授予时间**，并追加一条可回放的 delegation 转录事件（授予）；
    建工作时由真实用户授予（新建入口带上它）；在工具执行前从这份事实构造 Grant（tools = 角色表发放的
    整套代理工具面）并校验；无委托一律拒绝。
  accept: |
    有委托时六项工具在范围内运行；无委托时明确拒绝且无副作用；委托事实可从 meta 与转录追溯、重启后重建一致。
  blocked_by: 缺少实现

- id: conductor.proxy-permission-state
  scope: global
  level: T2
  why: |
    用户已决定：**撤销委托本轮不做**——它本质是“会话权限状态”（谁能对这条会话做什么），
    与停止/暂停无关，要单独做。所以“撤销即时生效、撤销后回到点名”还没有实现路径。
  how: |
    定义会话权限状态（授予/撤销、范围与有效期、调用者身份、当前主会话与目标子会话），落盘且可回放；
    撤销后核心不能继续派发或代答，回到点名。届时把 core.agency-mode 的撤销部分销账。
  accept: |
    权限状态可授予、可撤销、可从转录与工具台账追溯；撤销即时生效，之后代理工具一律拒绝。
  blocked_by: 缺少实现
