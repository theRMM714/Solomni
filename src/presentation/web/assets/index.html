<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<title>Solomni · 转录中心</title>
<!-- 令牌 → 组件 → 页面：页面不写字面量样式，组件只引用令牌。 -->
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <!-- 顶栏：品牌 + 状态 + 侧栏开关（桌面收起 / 移动端抽屉） -->
  <header class="topbar">
    <button id="btn-drawer" class="icon-btn" aria-label="收起或展开侧栏">☰</button>
    <div class="brand">Solomni <span class="brand-sub">转录中心</span></div>
    <div id="conn-state" class="conn-state" title="服务器连接状态"><span class="dot dot-ok"></span><span id="conn-text">已连接</span></div>
  </header>

  <!-- 围栏横幅：只有“本进程降级”或“启动要求未满足”时显示；正常 / best_effort 不打扰。 -->
  <div id="fence-banner" class="fence-banner hidden" role="status" aria-live="polite">
    <span id="fence-text" class="fence-text"></span>
    <button id="fence-settings" class="btn fence-btn" type="button">去设置</button>
  </div>

  <div class="layout">
    <!-- 侧栏：新建 + 会话树 + 底部设置；收起时只留图标栏 -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-main">
        <section class="panel">
          <button id="btn-new-work" class="btn btn-primary btn-block">+ 新建工作</button>
        </section>
        <div id="rejected" class="rejected"></div>
        <section class="panel">
          <h2>会话历史</h2>
          <div id="history-list" class="history-list"></div>
          <p class="panel-note">点条目直接打开会话；编辑 / 删除在行尾铅笔菜单里。</p>
        </section>
        <p class="sidebar-note">密钥只进登记处，任何界面不显示、不转发。</p>
      </div>
      <div class="sidebar-foot">
        <button id="btn-settings" class="sidebar-action" type="button" title="设置"></button>
      </div>
      <div id="sidebar-rail" class="sidebar-rail"></div>
    </aside>
    <div id="drawer-mask" class="drawer-mask"></div>

    <!-- 主区：会话标签 + 转录流 + 输入区 + 弹层 -->
    <main class="main">
      <nav id="tabs" class="tabs" aria-label="会话标签"></nav>
      <div id="stream" class="stream" aria-live="polite"></div>
      <div id="gate" class="gate"></div>
      <div id="readonly-bar" class="readonly-bar hidden"></div>
      <div id="composer" class="composer">
        <div id="at-menu" class="at-menu hidden"></div>
        <div class="composer-inner">
          <button id="btn-upload" class="btn btn-add" type="button" title="上传文件到本次工作的 work/">＋</button>
          <textarea id="input" rows="1" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button id="btn-update-task" class="btn hidden" title="改本次需求（回到需求行，追加新需求）">改需求</button>
          <button id="btn-continue" class="btn hidden" title="">继续</button>
          <button id="btn-send" class="btn btn-primary">发送</button>
        </div>
      </div>
      <div id="modal-root" class="modal-root"></div>
      <div id="notice-root" class="notice-root"></div>
      <div id="toast-root" class="toast-root" aria-live="polite"></div>
      <div id="menu-root"></div>
    </main>
  </div>
</div>
<script src="/md.js"></script>
<script src="/ui.js"></script>
<script src="/app.js"></script>
</body>
</html>
